# ============================================================================
# Tunarr Studio
# ----------------------------------------------------------------------------
# The Node backend (server.js) serves the UI, proxies /api -> Tunarr (same
# origin, no CORS), persists per-channel prefs + named collections to
# /data/prefs.json, and re-feeds the guide on a timer so it never runs dry.
#
# SETUP (see docs/truenas-setup.md for the full walkthrough):
#   1. Copy server.js + tunarr-studio.html into the host dir below.
#   2. mkdir -p /mnt/pool/apps/tunarr-studio/data   (writable prefs store)
#   3. Set TUNARR_BASE and TZ, and fix the volume paths.
#   4. Apply this compose (TrueNAS: Apps -> Custom App -> install via YAML).
#   5. Browse http://<host>:8088
#
# node:22-alpine needs no build — server.js uses only Node core modules.
# ============================================================================

services:
  tunarr-studio:
    image: node:22-alpine
    container_name: tunarr-studio
    working_dir: /app
    command: ["node", "/app/server.js"]
    ports:
      - "8088:80"
    environment:
      TUNARR_BASE: "http://tunarr.local:8000"   # Tunarr API base (NO trailing /api)
      PORT: "80"
      PREFS_FILE: "/data/prefs.json"
      UI_FILE: "/app/tunarr-studio.html"
      FEED_INTERVAL: "360"                       # minutes between guide re-feeds (6h)
      TZ: "America/Los_Angeles"
      # Only if your Tunarr has its optional basic-auth login turned on. Use the
      # SAME values as Tunarr. Studio will send them to Tunarr and ask browsers
      # for the same login. Leave both unset for no login.
      # TUNARR_BASIC_AUTH_USER: "admin"
      # TUNARR_BASIC_AUTH_PASSWORD: "change-me"
    volumes:
      - /mnt/pool/apps/tunarr-studio/server.js:/app/server.js:ro
      - /mnt/pool/apps/tunarr-studio/tunarr-studio.html:/app/tunarr-studio.html:ro
      - /mnt/pool/apps/tunarr-studio/data:/data
    restart: unless-stopped
