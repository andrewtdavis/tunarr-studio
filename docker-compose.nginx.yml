# ============================================================================
# Tunarr Studio — LEGACY nginx version (rollback only)
# ----------------------------------------------------------------------------
# This is the original production setup, kept for rollback. It serves the UI
# statically and proxies /api via default.conf.template (envsubst fills in
# TUNARR_HOST/TUNARR_PORT). It does NOT persist prefs/collections and does NOT
# feed the guide — those only exist in the Node version (docker-compose.yml).
#
# To roll back: ensure default.conf.template is present in the host volume dir,
# then apply this file instead of docker-compose.yml. Nothing else to change —
# same port (8088) and same tunarr-studio.html.
# ============================================================================

services:
  tunarr-studio:
    container_name: tunarr-studio
    image: nginx:1.27-alpine
    ports:
      - '8088:80'
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      TUNARR_HOST: tunarr.local
      TUNARR_PORT: '8000'
    volumes:
      - /mnt/pool/apps/tunarr-studio/tunarr-studio.html:/usr/share/nginx/html/tunarr-studio.html:ro
      - /mnt/pool/apps/tunarr-studio/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
