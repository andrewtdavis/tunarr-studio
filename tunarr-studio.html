<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunarr Studio — Channel Programming</title>
<style>
  .lab2{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:4px}
  :root{
    --bg:#0d0f14; --panel:#151821; --panel-2:#1b1f2b; --line:#262b38;
    --ink:#e8eaf0; --ink-dim:#8b93a7; --ink-faint:#5a6276;
    --accent:#ff6a1a; --accent-dim:#c44a00; --accent-soft:#ff6a1a22;
    --green:#2dc43a; --red:#e2463c; --amber:#e8b53a;
    --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.45;
  }
  button{font-family:inherit}
  a{color:var(--accent)}

  /* ---- top bar ---- */
  header{
    display:flex; align-items:center; gap:16px; padding:10px 18px;
    background:linear-gradient(180deg,#171a23,#11131a);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.5px}
  .brand .dot{
    width:22px;height:22px;border-radius:6px;
    background:radial-gradient(circle at 35% 30%,#ff8c00,#c44a00);
    box-shadow:0 0 0 2px #00000040 inset;
  }
  .brand small{font-weight:600;color:var(--ink-dim);letter-spacing:0}
  header .conn{display:flex;align-items:center;gap:8px;margin-left:auto;font-family:var(--mono);font-size:12px}
  header input[type=text]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:6px 9px;border-radius:7px;font-family:var(--mono);font-size:12px;width:230px;
  }
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    font-family:var(--mono);font-size:11px;border:1px solid var(--line);color:var(--ink-dim)}
  .pill .led{width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
  .pill.ok .led{background:var(--green);box-shadow:0 0 6px var(--green)}
  .pill.err .led{background:var(--red);box-shadow:0 0 6px var(--red)}

  .btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
    padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
    transition:.12s; white-space:nowrap;
  }
  .btn:hover{border-color:#3a4256;background:#222736}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0a02}
  .btn.primary:hover{background:#ff7d33}
  .btn.danger{color:#ffb4ae;border-color:#46221f;background:#1f1413}
  .btn.danger:hover{background:#2a1715}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}

  /* ---- layout ---- */
  .wrap{display:grid;grid-template-columns:230px 1fr;height:calc(100vh - 53px)}
  aside{
    background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:10px;
  }
  aside h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);
    margin:8px 6px;font-weight:700}
  .chan{
    display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;
  }
  .chan:hover{background:var(--panel-2)}
  .chan.active{background:var(--accent-soft);border-color:#5a3318}
  .chan .num{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:26px}
  .chan .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  main{overflow-y:auto;padding:18px 22px}
  .head-row{display:flex;align-items:flex-end;gap:14px;margin-bottom:4px}
  .head-row h1{font-size:22px;margin:0;font-weight:800}
  .head-row .meta{font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-bottom:3px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
  .toolbar .spacer{flex:1}
  .search-in{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:7px 10px;border-radius:8px;font-size:13px;min-width:180px;
  }
  select.search-in{cursor:pointer}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tab{padding:9px 14px;cursor:pointer;color:var(--ink-dim);font-weight:600;font-size:13px;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  /* ---- show rows (mixing-board style) ---- */
  .show{
    display:grid;grid-template-columns:26px 1fr 150px 70px 84px;gap:12px;align-items:center;
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    margin-bottom:7px;
  }
  .show:hover{border-color:#333a4b}
  .show .chk{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
  .show .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .show .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .rating-tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;
    border:1px solid var(--line);border-radius:5px;color:var(--ink-dim);margin-left:7px;vertical-align:1px}

  /* ---- up-next reorder rows ---- */
  .upnext-row{
    display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;
    padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    margin-bottom:6px;cursor:grab;
  }
  .upnext-row:hover{border-color:#333a4b}
  .upnext-row.dragging{opacity:.4}
  .upnext-row.drop-target{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .upnext-row.on-now{border-color:var(--accent)}
  .upnext-row .grip{color:var(--ink-faint);font-size:14px;letter-spacing:-2px;cursor:grab;user-select:none}
  .upnext-row .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .upnext-row .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}

  /* weight fader */
  .fader{position:relative;height:26px;display:flex;align-items:center;gap:8px}
  .fader input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent-dim),var(--accent));outline:none;flex:1}
  .fader input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:pointer}
  .fader input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);cursor:pointer}
  .fader .wval{font-family:var(--mono);font-size:12px;width:30px;text-align:right;color:var(--ink)}
  .epcount{font-family:var(--mono);font-size:12px;color:var(--ink-dim);text-align:right}

  /* now-playing strip */
  .now{
    display:flex;align-items:center;gap:14px;margin:14px 0 4px;padding:12px 14px;
    border:1px solid var(--line);border-radius:12px;
    background:linear-gradient(110deg,#1a1410,#14161e 55%);
  }
  .now .live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
    text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  .now .live .led{width:8px;height:8px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px var(--accent);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .now .np-title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .now .np-sub{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
  .now .np-body{flex:1;min-width:0}
  .now .np-actions{display:flex;gap:8px;flex-shrink:0}
  .now-prog{height:5px;border-radius:3px;background:#2a2f3d;margin-top:7px;overflow:hidden}
  .now-prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent))}

  .empty{padding:50px 20px;text-align:center;color:var(--ink-faint)}
  .empty b{display:block;color:var(--ink-dim);font-size:15px;margin-bottom:6px}

  /* sticky action bar */
  .actionbar{
    position:sticky;bottom:0;margin-top:16px;padding:12px 14px;border:1px solid var(--line);
    border-radius:12px;background:linear-gradient(180deg,#1a1e29,#12141c);
    display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px #00000040;
  }
  .actionbar .info{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
  .actionbar .spacer{flex:1}
  /* build options panel */
  .opts{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;
    padding:13px 14px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);margin-top:14px}
  .opt{display:flex;flex-direction:column;gap:5px}
  .opt label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);font-weight:700}
  .opt select,.opt input[type=number]{background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);padding:7px 9px;border-radius:8px;font-size:13px}
  .opt .hint{font-size:11px;color:var(--ink-faint);max-width:190px;line-height:1.35}
  .opt.toggle{flex-direction:row;align-items:center;gap:9px}
  .opt.toggle input{width:17px;height:17px;accent-color:var(--accent)}
  .opt.toggle .lab{display:flex;flex-direction:column;gap:2px}
  .opt.toggle label{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-weight:600}

  /* add/search results */
  .result{
    display:grid;grid-template-columns:26px 1fr 90px 70px;gap:12px;align-items:center;
    padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:var(--panel)
  }
  .result .title{font-weight:600}
  .result.on-channel{background:rgba(64,160,96,.10);border-color:rgba(80,180,110,.5)}
  .on-tag{display:inline-block;font-size:10px;padding:1px 6px;margin-left:7px;border-radius:5px;
    background:rgba(80,180,110,.18);color:#7fd6a0;vertical-align:1px}
  .facet-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
  .chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);
    cursor:pointer;font-size:12px;font-family:var(--mono);color:var(--ink-dim)}
  .chip:hover{border-color:#3a4256;color:var(--ink)}
  .chip.on{background:var(--accent-soft);border-color:#5a3318;color:var(--accent)}

  /* toast */
  #toast{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:8px}
  .toast{padding:11px 15px;border-radius:9px;font-size:13px;border:1px solid var(--line);
    background:#1c2230;box-shadow:0 8px 24px #00000060;min-width:220px;animation:slide .25s}
  .toast.ok{border-color:#1f5a28}.toast.err{border-color:#5a2420}.toast.warn{border-color:#5a4a1f}
  @keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ink-faint);
    border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
  @keyframes rot{to{transform:rotate(360deg)}}

  .modal-bg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:480px;width:90%;
    max-height:calc(100vh - 32px);overflow:auto}
  .modal.wide{max-width:680px}
  .modal h2{margin:0 0 8px;font-size:17px}
  .theme-card{padding:11px 13px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--panel-2)}
  .theme-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .theme-head .title{font-weight:600;font-size:14px;color:var(--ink)}
  .theme-head .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:1px}
  .theme-head .btn{flex:none}
  .theme-lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px;margin-top:8px}
  .theme-lists h4{margin:0 0 3px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .theme-lists h4 span{font-family:var(--mono);color:var(--ink-dim);margin-left:4px}
  .theme-lists ul{list-style:none;margin:0;padding:0;font-size:12px;color:var(--ink-dim);line-height:1.55}
  .theme-lists li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .theme-lists li.more{color:var(--ink-faint);font-style:italic}
  /* shows/movies sub-tabs (Manage + new-channel picker) */
  .subtabs{display:flex;gap:6px;margin:0 0 4px}
  .subtab{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);
    cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-dim);user-select:none}
  .subtab:hover{color:var(--ink);border-color:#3a4256}
  .subtab.active{background:var(--accent-soft);border-color:#5a3318;color:var(--accent)}
  .subtab .n{font-family:var(--mono);font-weight:400;font-size:11px;margin-left:3px;opacity:.85}
  .hint-inline{font-size:11px;color:var(--ink-faint)}
  .head-row .spacer{flex:1}
  .head-row .chan-opts{margin-bottom:2px}
  .danger-zone{display:flex;align-items:center;gap:12px;margin-top:18px;padding:11px 12px;
    border:1px solid #5a2a2a;border-radius:9px;background:rgba(200,60,60,.06)}
  .danger-zone > div{flex:1}
  .danger-zone .hint{font-size:11px;color:var(--ink-faint);margin-top:2px}
  /* logo editor */
  .co-section{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .co-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .co-head .hint{font-size:11px;color:var(--ink-faint);display:flex;align-items:center;gap:6px}
  .cur-logo{height:28px;border-radius:4px}
  .head-logo{height:40px;max-width:60px;object-fit:contain;align-self:center}
  .logo-ed{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
  .logo-ed.compact{grid-template-columns:160px 1fr;gap:12px}
  .logo-prev{background:repeating-conic-gradient(#1a1f2b 0 25%, #151924 0 50%) 0 0/16px 16px;border:1px solid var(--line);
    border-radius:9px;aspect-ratio:4/3;overflow:hidden}
  .logo-prev svg{width:100%;height:100%;display:block}
  .logo-ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
  .logo-ctl .search-in{width:100%}
  .logo-ctl .hint{font-size:11px;color:var(--ink-faint)}
  .logo-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .logo-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .logo-ed.compact .logo-grid{gap:6px}
  .logo-thumb{aspect-ratio:4/3;border:2px solid var(--line);border-radius:8px;cursor:pointer;overflow:hidden;
    background:repeating-conic-gradient(#1a1f2b 0 25%, #151924 0 50%) 0 0/12px 12px}
  .logo-thumb:hover{border-color:#4a5368}
  .logo-thumb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .logo-thumb svg{width:100%;height:100%;display:block}
  .logo-nav{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:-4px}
  .logo-nav .pg{flex:1;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .logo-btns label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);cursor:pointer}
  .logo-btns input[type=checkbox]{accent-color:var(--accent)}
  #pkLogo{margin-top:12px}
  .show{user-select:none}
  .show.movie .fader{visibility:hidden}
  .pick-list{max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}
  .pick-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:6px 10px;
    border-bottom:1px solid var(--line);cursor:pointer;user-select:none;font-size:13px}
  .pick-row:last-child{border-bottom:none}
  .pick-row:hover{background:var(--panel)}
  .pick-row .chk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .pick-row .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick-row .yr{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:7px}
  .pick-row .right{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .pick-foot{display:flex;align-items:center;gap:10px;margin-top:12px}
  .pick-foot .info{font-size:12px;color:var(--ink-dim)}
  .opt.airtime .airtime-row{display:flex;align-items:center;gap:8px}
  .opt.airtime input[type=range]{width:150px;accent-color:var(--accent)}
  .opt.airtime .air-lab{font-family:var(--mono);font-size:11px;color:var(--ink-dim);min-width:74px}
  #pkAir .opt{margin-top:12px}
  #pkAir .hint{max-width:none}
  .theme-lists li .yr{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:6px}
  .theme-lists li .cr{font-family:var(--mono);font-size:9px;color:var(--ink-faint);border:1px solid var(--line);
    border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
  .theme-lists h4 em{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-faint)}
  .modal p{color:var(--ink-dim);margin:0 0 16px}
  .modal .row{display:flex;gap:10px;justify-content:flex-end}
  code.k{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:1px 6px;border-radius:5px;color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> Tunarr&nbsp;Studio <small>· programming desk</small></div>
  <div class="conn">
    <input id="urlInput" type="text" spellcheck="false" placeholder="http://tunarr.local:8000">
    <button class="btn sm" id="connectBtn">Connect</button>
    <span class="pill" id="connPill"><span class="led"></span><span id="connTxt">offline</span></span>
  </div>
</header>

<div class="wrap">
  <aside>
    <h3>Channels</h3>
    <div id="chanList"></div>
  </aside>

  <main id="main">
    <div class="empty"><b>Connect to your Tunarr server</b>
      Enter your server URL above and hit Connect to load channels.</div>
  </main>
</div>

<div id="toast"></div>

<!-- confirm modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Confirm</h2>
    <p id="modalBody"></p>
    <div class="row">
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalOk">Confirm</button>
    </div>
  </div>
</div>

<script>
/* ============================================================= *
 *  Tunarr Studio — single-file control surface for channel
 *  programming. Talks directly to the Tunarr REST API.
 *  Verified endpoints:
 *    GET  /api/channels
 *    GET  /api/channels/:id/programming   {lineup, programs}
 *    POST /api/channels/:id/programming    (manual|random)
 *    POST /api/programs/search             filter tree + facets
 *    GET  /api/programs/facets/:name       discover rating values
 *    GET  /api/media-sources               list plex/jellyfin sources
 *    GET  /api/media-sources/:id/libraries
 * ============================================================= */

const State = {
  base: '',
  channels: [],
  current: null,        // channel object
  programming: null,    // raw {lineup, programs}
  shows: [],            // grouped [{showId,title,count,ids,rating,weights...}]
  tab: 'manage',        // manage | add
  manageKind: 'show',   // Manage tab list: show | movie
  exampleMode: 'top',   // Add-channel example lists: top | random | recent | newest
  mediaSources: [],
  libraries: [],
  ratingFacet: null,    // facet name that holds content ratings
  ratingValues: {},     // value -> count
  addResults: [],
  addSelected: new Map(),// id -> result item
  filterRatings: new Set(),
  addType: 'show',      // 'show' | 'movie' — what the Add tab searches/adds
  metaField: '',        // '' = free-text title; else a filterable attribute key
  addCapped: false,     // true when search results were truncated by the fetch limit
};

// Metadata fields the Add tab can search by. Verified filterable against the
// live index; values are matched EXACTLY (case-insensitive), partials don't
// match. `key` is the Meilisearch attribute; `q:true` means "use the free-text
// query string" instead of an exact filter. `movieOnly` fields are hidden for
// shows (e.g. studio is only populated on movies in this Plex data).
const META_FIELDS = [

/* ---------- HTTP ---------- */
async function api(method, path, body){
  const url = State.base.replace(/\/$/,'') + '/api' + path;
  const opt = {method, headers:{'Accept':'application/json'}};
  if(body!==undefined){opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body);}
  const r = await fetch(url, opt);
  if(!r.ok){
    const t = await r.text().catch(()=> '');
    throw new Error(`HTTP ${r.status} ${method} ${path}\n${t.slice(0,300)}`);
  }
  const txt = await r.text();
  return txt.trim() ? JSON.parse(txt) : null;
}

/* ---------- toast ---------- */
function toast(msg, kind='ok', ms=3200){
  const t = el('div','toast '+kind, msg);
  $('#toast').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);}, ms);
}

/* ---------- confirm modal ---------- */
function confirmModal(title, body){
  return new Promise(res=>{
    $('#modalOk').style.display=''; $('#modalCancel').textContent='Cancel';
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = body;
    $('#modalBg').classList.add('show');
    const done = v=>{ $('#modalBg').classList.remove('show'); $('#modalOk').onclick=null; $('#modalCancel').onclick=null; res(v); };
    $('#modalOk').onclick = ()=>done(true);
    $('#modalCancel').onclick = ()=>done(false);
  });
}

/* ---------- prompt modal (text input) ---------- */
function promptModal(title, label, placeholder='', initial=''){
  return new Promise(res=>{
    $('#modalOk').style.display=''; $('#modalCancel').textContent='Cancel';
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML =
      `<label style="display:block;margin-bottom:6px;color:var(--ink-dim);font-size:13px">${label}</label>`+
      `<input id="promptInput" class="search-in" style="width:100%" placeholder="${placeholder.replace(/"/g,'&quot;')}" value="${initial.replace(/"/g,'&quot;')}">`;
    $('#modalBg').classList.add('show');
    const inp=$('#promptInput'); setTimeout(()=>inp.focus(),30);
    const done=v=>{ $('#modalBg').classList.remove('show'); $('#modalOk').onclick=null; $('#modalCancel').onclick=null; inp.onkeydown=null; res(v); };
    $('#modalOk').onclick=()=>done(inp.value.trim()||null);
    $('#modalCancel').onclick=()=>done(null);
    inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault(); done(inp.value.trim()||null);} };
  });
}

function closeModal(){
  $('#modalBg').classList.remove('show'); $('.modal').classList.remove('wide');
  $('#modalOk').style.display=''; $('#modalCancel').textContent='Cancel';
  $('#modalOk').onclick=null; $('#modalCancel').onclick=null;
}

/* ---------- connection ---------- */
function setConn(state, txt){
  const p = $('#connPill'); p.className = 'pill '+(state||'');
  $('#connTxt').textContent = txt;
}

async function connect(){
  const url = $('#urlInput').value.trim();
  if(!url){toast('Enter a server URL first','warn');return;}
  State.base = url;
  localStorage && localStorage.setItem('tunarrStudioUrl', url);
  setConn('', 'connecting…');
  try{
    State.channels = await api('GET','/channels');
    setConn('ok', `online · ${State.channels.length} ch`);
    renderChannels();
    // background: load media sources for the Add tab
    loadMediaSources();
    if(State.channels.length) selectChannel(State.channels[0]);
  }catch(e){
    setConn('err','connection failed');
    toast('Could not reach Tunarr. If the page and server are on different origins, Tunarr needs CORS enabled (see notes).','err',6000);
    console.error(e);
  }
}

/* ---------- channels sidebar ---------- */
function renderChannels(){
  const box = $('#chanList'); box.innerHTML='';
  State.channels.slice().sort((a,b)=>(a.number||0)-(b.number||0)).forEach(ch=>{
    const row = el('div','chan'+(State.current&&State.current.id===ch.id?' active':''));
    row.append(el('span','num', ch.number!=null?ch.number:'—'));
    row.append(el('span','nm', ch.name||'(unnamed)'));
    row.onclick=()=>selectChannel(ch);
    box.append(row);
  });
  const add=el('div','chan add-chan'); add.style.cursor='pointer'; add.style.opacity='.85';
  add.append(el('span','num','＋'));
  add.append(el('span','nm','Add channel…'));
  add.onclick=openAddChannel;
  box.append(add);
}

// Genre decides the style; the name is only a fallback when genres are unknown.
function guessLogoStyle(name, genres){
  for(const g of (genres||[])) for(const [k,s] of Object.entries(LOGO_STYLES)) if(s.genres.includes(g)) return k;
  for(const [k,s] of Object.entries(LOGO_STYLES)) if(s.words && s.words.test(name||'')) return k;
  return 'retro';
}
function hashStr(s){ let h=2166136261>>>0; for(const c of String(s)){ h^=c.codePointAt(0); h=Math.imul(h,16777619)>>>0; } return h; }
function seededRng(seed){
  let a=hashStr(seed);
  return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
}

const f1=n=>Math.round(n*10)/10;
function hexLum(h){ const m=/^#([0-9a-f]{6})$/i.exec(h||''); if(!m) return .5;
  const v=parseInt(m[1],16); return (.299*(v>>16)+.587*((v>>8)&255)+.114*(v&255))/255; }
// Closed Catmull-Rom curve through points, as cubic Béziers.
function smoothPath(pts){
  const n=pts.length; let d=`M${f1(pts[0][0])},${f1(pts[0][1])}`;
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
    d+=` C${f1(p1[0]+(p2[0]-p0[0])/6)},${f1(p1[1]+(p2[1]-p0[1])/6)} ${f1(p2[0]-(p3[0]-p1[0])/6)},${f1(p2[1]-(p3[1]-p1[1])/6)} ${f1(p2[0])},${f1(p2[1])}`;
  }
  return d+'Z';
}
const polyPath=pts=>'M'+pts.map(p=>`${f1(p[0])},${f1(p[1])}`).join(' L')+'Z';
const circlePath=(x,y,R)=>`M${f1(x-R)},${f1(y)} a${f1(R)},${f1(R)} 0 1 0 ${f1(R*2)},0 a${f1(R)},${f1(R)} 0 1 0 ${f1(-R*2)},0Z`;
const heartPath=(x,y,sx,sy)=>`M${f1(x)},${f1(y+sy*.95)} C${f1(x-sx*1.25)},${f1(y+sy*.15)} ${f1(x-sx*1.05)},${f1(y-sy*.95)} ${f1(x)},${f1(y-sy*.42)} C${f1(x+sx*1.05)},${f1(y-sy*.95)} ${f1(x+sx*1.25)},${f1(y+sy*.15)} ${f1(x)},${f1(y+sy*.95)}Z`;
function ring(cx,cy,rx,ry,n,radiusFn){ return Array.from({length:n},(_,i)=>{ const a=i/n*Math.PI*2-Math.PI/2, k=radiusFn(i,a); return [cx+Math.cos(a)*rx*k, cy+Math.sin(a)*ry*k]; }); }
// Order points clockwise on screen, so extra subpaths add to (not cut from) a shape.
function cw(pts){ let s=0; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; s+=a[0]*b[1]-b[0]*a[1]; } return s<0?pts.slice().reverse():pts; }
const scaledCopy=(d,cx,cy,k,attrs)=>`<path d="${d}" transform="translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})" ${attrs}/>`;

// Backdrop shapes. Returns {d | rect, under, mid, over, defs, tc (text center), tw (text width)}:
// under = before the body, mid = after the body (same-color add-ons), over = on top.
function logoShape(kind, r, cx, cy, rx, ry, pal, id){
  const out={d:'',under:'',mid:'',over:'',defs:''};
  const tv=(antenna, legs)=>{
    const w=rx*1.8, h=ry*(legs?1.4:1.55), l=cx-w/2, t=cy-h/2+(legs?-14:12), b=24;
    out.d=`M${f1(l+40)},${f1(t)} Q${f1(cx)},${f1(t-b)} ${f1(l+w-40)},${f1(t)} Q${f1(l+w+b)},${f1(t+h/2)} ${f1(l+w-40)},${f1(t+h)} Q${f1(cx)},${f1(t+h+b)} ${f1(l+40)},${f1(t+h)} Q${f1(l-b)},${f1(t+h/2)} ${f1(l+40)},${f1(t)}Z`;
    const L=antenna==='rabbit'?ry*.7:ry*.58, sw=antenna==='rabbit'?5:7, by=t-b*.6;
    [lgR(r,-38,-22), lgR(r,22,38)].forEach((a,i)=>{ const x=cx+Math.sin(a*Math.PI/180)*L, y=by-Math.cos(a*Math.PI/180)*L;
      out.under+=`<line x1="${cx}" y1="${f1(by)}" x2="${f1(x)}" y2="${f1(y)}" stroke="${pal.shape2}" stroke-width="${sw}" stroke-linecap="round"/>`+
        `<circle cx="${f1(x)}" cy="${f1(y)}" r="${antenna==='rabbit'?8:11}" fill="${pal.accents[i]}" stroke="${pal.shadow}" stroke-width="4"/>`; });
    if(antenna==='rabbit') out.under+=`<ellipse cx="${cx}" cy="${f1(by+4)}" rx="34" ry="18" fill="${pal.shadow}"/>`;
    if(legs){ [-1,1].forEach(s=>{ const x=cx+s*w*.28, y=t+h+b*.6;
      out.under+=`<line x1="${f1(x)}" y1="${f1(y-10)}" x2="${f1(x+s*8)}" y2="${f1(y+34)}" stroke="${pal.shadow}" stroke-width="12" stroke-linecap="round"/>`+
        `<ellipse cx="${f1(x+s*20)}" cy="${f1(y+40)}" rx="26" ry="12" fill="${pal.accents[2]||pal.accents[0]}" stroke="${pal.shadow}" stroke-width="4"/>`; }); }
    out.over+=`<circle cx="${f1(l+w-30)}" cy="${f1(t+h-28)}" r="9" fill="${pal.accents[0]}" stroke="${pal.shadow}" stroke-width="3"/>`;
    out.tw=w*.8; out.tc=[cx-8,t+h/2];
  };
  switch(kind){
    case 'blob': out.d=smoothPath(ring(cx,cy,rx,ry,Math.floor(lgR(r,7,10)),()=>lgR(r,.86,1.06))); break;
    case 'splat': {
      out.d=smoothPath(ring(cx,cy,rx,ry,Math.floor(lgR(r,9,13)),i=>i%2?lgR(r,.8,.9):lgR(r,.98,1.1)));
      for(let i=0;i<4;i++){ const a=lgR(r,0,Math.PI*2), k=lgR(r,1.1,1.2), s=lgR(r,10,22);
        out.under+=`<circle cx="${f1(cx+Math.cos(a)*rx*k)}" cy="${f1(cy+Math.sin(a)*ry*k)}" r="${f1(s)}" fill="${pal.shape}"/>`; }
      break; }
    case 'goo': {
      const gy=cy-16; out.d=smoothPath(ring(cx,gy,rx,ry*.86,Math.floor(lgR(r,8,11)),()=>lgR(r,.9,1.05)));
      const n=Math.floor(lgR(r,3,6));
      for(let i=0;i<n;i++){ const x=cx-rx*.6+rx*1.2*(i+.5)/n+lgR(r,-15,15), w=lgR(r,18,30), len=lgR(r,40,95), y0=cy+ry*.5;
        const dd=`M${f1(x-w/2)},${f1(y0)} V${f1(y0+len)} A${f1(w/2)},${f1(w/2)} 0 0 0 ${f1(x+w/2)},${f1(y0+len)} V${f1(y0)}Z`;
        out.under+=`<path d="${dd}" fill="${pal.shadow}" transform="translate(14 14)"/>`;
        out.mid+=`<path d="${dd}" fill="${pal.shape}"/>`; }
      out.tc=[cx,gy]; break; }
    case 'softburst': out.d=smoothPath(ring(cx,cy,rx,ry,24,i=>i%2?.8:1.04)); break;
    case 'cloud': out.d=smoothPath(ring(cx,cy,rx,ry*.92,18,i=>i%2?.88:1.02)); break;
    case 'rainbowcloud': {
      const cyc=cy+28;
      ['#ff4d4d','#ffa53d','#ffe14d','#4dd06a','#3d9bff','#8a5cff'].forEach((c,k)=>{ const R=rx*1.0-k*15;
        out.under+=`<path d="M${f1(cx-R)},${f1(cyc)} A${f1(R)},${f1(R*.8)} 0 0 1 ${f1(cx+R)},${f1(cyc)}" fill="none" stroke="${c}" stroke-width="15"/>`; });
      out.d=smoothPath(ring(cx,cyc,rx*.92,ry*.72,18,i=>i%2?.86:1.02)); out.tc=[cx,cyc]; out.tw=rx*1.5; break; }
    case 'speech': {
      const sy=cy-14; out.d=smoothPath(ring(cx,sy,rx,ry*.84,16,()=>1));
      const s=r()<.5?-1:1;
      out.d+=' '+polyPath(cw([[cx+s*rx*.2,sy+ry*.55],[cx+s*rx*.62,sy+ry*1.18],[cx+s*rx*.52,sy+ry*.45]]));
      out.tc=[cx,sy]; break; }
    case 'burst': out.d=polyPath(ring(cx,cy,rx,ry,Math.floor(lgR(r,11,16))*2,i=>i%2?lgR(r,.76,.84):1.05)); break;
    case 'sharpburst': out.d=polyPath(ring(cx,cy,rx*1.04,ry,Math.floor(lgR(r,8,11))*2,i=>i%2?lgR(r,.62,.74):1.06)); break;
    case 'spiky': out.d=polyPath(ring(cx,cy,rx,ry,Math.floor(lgR(r,16,22)),i=>i%2?lgR(r,.82,.9):lgR(r,.98,1.08))); break;
    case 'badge': {
      const w=rx*1.9,h=ry*1.5;
      out.rot=lgR(r,-7,7); out.rx=36; out.rect=[cx-w/2,cy-h/2,w,h]; break; }
    case 'shield': {
      const w=rx*1.75, h=ry*1.85, t=cy-h/2, l=cx-w/2;
      out.d=polyPath([[l,t+20],[l+w*.3,t],[cx,t+16],[l+w*.7,t],[l+w,t+20],[l+w*.94,t+h*.62],[cx,t+h],[l+w*.06,t+h*.62]]);
      out.tc=[cx,cy-ry*.12]; break; }
    case 'slash': {
      const w=rx*1.95, h=ry*1.25, k=60;
      out.d=polyPath([[cx-w/2+k,cy-h/2],[cx+w/2+k*.3,cy-h/2],[cx+w/2-k,cy+h/2],[cx-w/2-k*.3,cy+h/2]]); break; }
    case 'band': {
      const w=rx*2.0,h=ry*1.0,a=lgR(r,-6,-2);
      out.rot=a; out.rx=10; out.rect=[cx-w/2,cy-h/2,w,h];
      [cy-h/2-24, cy+h/2+12].forEach((y,i)=>{ out.over+=`<rect x="${f1(cx-w/2)}" y="${f1(y)}" width="${f1(w)}" height="12" rx="4" fill="${pal.accents[i]}" transform="rotate(${f1(a)} ${cx} ${cy})"/>`; });
      out.tw=w*.86; break; }
    case 'circlebadge': {
      const R=ry*1.08; out.d=circlePath(cx,cy,R);
      out.over+=`<circle cx="${cx}" cy="${cy}" r="${f1(R-16)}" fill="none" stroke="${pal.accents[1]}" stroke-width="5"/>`;
      [70,90,110].forEach(deg=>{ const a=deg*Math.PI/180; out.over+=logoDecor('star',r,cx+Math.cos(a)*(R-40),cy+Math.sin(a)*(R-40),24,pal.accents[0],pal); });
      out.tw=rx*1.75; out.tc=[cx,cy-14]; break; }
    case 'planet': {
      out.d=circlePath(cx,cy,ry*1.05);
      const tilt=lgR(r,-16,-6);
      out.under+=`<ellipse cx="${cx}" cy="${cy}" rx="${f1(rx*1.18)}" ry="${f1(ry*.34)}" transform="rotate(${f1(tilt)} ${cx} ${cy})" fill="none" stroke="${pal.accents[0]}" stroke-width="10" opacity=".55"/>`;
      out.over+=`<path d="M${f1(cx-rx*1.18)},${cy} A${f1(rx*1.18)},${f1(ry*.34)} 0 0 0 ${f1(cx+rx*1.18)},${cy}" transform="rotate(${f1(tilt)} ${cx} ${cy})" fill="none" stroke="${pal.accents[0]}" stroke-width="10" opacity=".9"/>`;
      out.tw=ry*2.2; break; }
    case 'hexagon': out.d=polyPath(ring(cx,cy,rx*1.02,ry*1.08,6,()=>1)); break;
    case 'orbit': {
      out.d=smoothPath(ring(cx,cy,rx,ry*.92,12,()=>1));
      for(let i=0;i<2;i++){ const t=lgR(r,-30,30);
        out.over+=`<ellipse cx="${cx}" cy="${cy}" rx="${f1(rx*1.12)}" ry="${f1(ry*.28)}" transform="rotate(${f1(t)} ${cx} ${cy})" fill="none" stroke="${pal.accents[i]}" stroke-width="4" opacity=".7"/>`; }
      break; }
    case 'crest': {
      const w=rx*1.45,h=ry*2.0,l=cx-w/2,t=cy-h/2;
      out.d=`M${f1(l)},${f1(t+30)} L${f1(l+w*.25)},${f1(t)} L${f1(cx)},${f1(t+22)} L${f1(l+w*.75)},${f1(t)} L${f1(l+w)},${f1(t+30)} L${f1(l+w)},${f1(t+h*.5)} Q${f1(l+w)},${f1(t+h*.85)} ${f1(cx)},${f1(t+h)} Q${f1(l)},${f1(t+h*.85)} ${f1(l)},${f1(t+h*.5)}Z`;
      out.over+=scaledCopy(out.d,cx,cy,.88,`fill="none" stroke="${pal.accents[0]}" stroke-width="4" opacity=".8"`);
      out.tw=rx*1.75; out.tc=[cx,cy-ry*.12]; break; }
    case 'scroll': {
      const w=rx*1.7,h=ry*1.2,l=cx-w/2,t=cy-h/2,q=h*.16;
      out.d=`M${f1(l)},${f1(t)} H${f1(l+w)} V${f1(t+h)} H${f1(l)}Z`;
      [l,l+w].forEach(x=>{ out.mid+=`<rect x="${f1(x-q)}" y="${f1(t-14)}" width="${f1(q*2)}" height="${f1(h+28)}" rx="${f1(q)}" fill="${pal.shape2}" stroke="${pal.shadow}" stroke-width="5"/>`+
        `<circle cx="${f1(x)}" cy="${f1(t-14+q)}" r="${f1(q*.45)}" fill="none" stroke="${pal.shadow}" stroke-width="4"/>`; });
      out.tw=w*.86; break; }
    case 'drip': {
      const w=rx*1.9, top=cy-ry*.9, base=cy+ry*.5, l=cx-w/2; let d=`M${f1(l)},${f1(base)} V${f1(top+30)} Q${f1(l)},${f1(top)} ${f1(l+30)},${f1(top)} H${f1(l+w-30)} Q${f1(l+w)},${f1(top)} ${f1(l+w)},${f1(top+30)} V${f1(base)}`;
      const n=Math.floor(lgR(r,6,9)), step=w/n;
      for(let i=n-1;i>=0;i--){ const x1=l+step*i, len=lgR(r,10,ry*.55), m=x1+step/2, half=step*.32;
        d+=` L${f1(m+half)},${f1(base)} V${f1(base+len)} A${f1(half)},${f1(half)} 0 0 1 ${f1(m-half)},${f1(base+len)} V${f1(base)} L${f1(x1)},${f1(base)}`; }
      out.d=d+'Z'; out.tc=[cx,cy-ry*.2]; break; }
    case 'moon': {
      out.d=circlePath(cx,cy,ry*1.05);
      for(let i=0;i<4;i++){ const a=lgR(r,0,Math.PI*2), k=lgR(r,.2,.7), s=lgR(r,10,26);
        out.over+=`<circle cx="${f1(cx+Math.cos(a)*ry*k)}" cy="${f1(cy+Math.sin(a)*ry*k)}" r="${f1(s)}" fill="#000" opacity=".12"/>`; }
      out.tw=ry*2.2; break; }
    case 'magnify': {
      const R=ry*.96, lx=cx-34, ly=cy-16, a=Math.PI/4;
      out.d=circlePath(lx,ly,R);
      const x1=lx+Math.cos(a)*R*.92, y1=ly+Math.sin(a)*R*.92, x2=lx+Math.cos(a)*R*1.42, y2=ly+Math.sin(a)*R*1.42;
      out.under+=`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${pal.shadow}" stroke-width="40" stroke-linecap="round"/>`+
        `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${pal.accents[2]||pal.accents[0]}" stroke-width="26" stroke-linecap="round"/>`;
      out.over+=`<circle cx="${f1(lx)}" cy="${f1(ly)}" r="${f1(R-5)}" fill="none" stroke="${pal.accents[0]}" stroke-width="10"/>`;
      out.tc=[lx,ly]; out.tw=rx*1.7; break; }
    case 'spotlight': {
      [[-1,lgR(r,.15,.3)],[1,lgR(r,.15,.3)]].forEach(([s,k])=>{ const x0=cx+s*(LOGO_W/2-30);
        out.under+=`<path d="${polyPath([[x0-s*10,-10],[x0+s*40,-10],[cx+s*rx*.2,cy+ry*.4],[cx-s*rx*.55,cy+ry*.1]])}" fill="${pal.accents[0]}" opacity="${f1(k*10)/10}"/>`; });
      out.d=smoothPath(ring(cx,cy+10,rx*.95,ry*.82,12,()=>1)); out.tc=[cx,cy+10]; break; }
    case 'tape': {
      const w=rx*2.1,h=ry*.95,a=lgR(r,-9,-4);
      out.rot=a; out.rx=4; out.rect=[cx-w/2,cy-h/2,w,h];
      out.defs+=`<pattern id="${id}s" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="40" height="40" fill="${pal.shadow}"/><rect width="20" height="40" fill="${pal.accents[0]}"/></pattern>`;
      [cy-h/2, cy+h/2-20].forEach(y=>{ out.over+=`<rect x="${f1(cx-w/2)}" y="${f1(y)}" width="${f1(w)}" height="20" fill="url(#${id}s)" transform="rotate(${f1(a)} ${cx} ${cy})"/>`; });
      out.tw=w*.86; break; }
    case 'heart': {
      const sx=rx*.8, sy=ry*1.02;
      out.d=heartPath(cx,cy+8,sx,sy); out.tc=[cx,cy-ry*.12]; out.tw=rx*1.5; break; }
    case 'record': {
      const R=ry*1.06; out.d=circlePath(cx,cy,R);
      for(let k=1;k<=4;k++) out.over+=`<circle cx="${cx}" cy="${cy}" r="${f1(R*(.5+k*.11))}" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>`;
      out.over+=`<circle cx="${cx}" cy="${cy}" r="${f1(R*.34)}" fill="${pal.accents[0]}" opacity=".9"/><circle cx="${cx}" cy="${cy}" r="7" fill="${pal.shadow}"/>`;
      out.tw=rx*1.7; break; }
    case 'marquee': {
      const w=rx*1.9,h=ry*1.45; out.rx=26; out.rect=[cx-w/2,cy-h/2,w,h];
      const l=cx-w/2+14, t=cy-h/2+14, iw=w-28, ih=h-28, per=2*(iw+ih), n=Math.round(per/36);
      for(let i=0;i<n;i++){ let d=i*per/n, x, y;
        if(d<iw){ x=l+d; y=t; } else if((d-=iw)<ih){ x=l+iw; y=t+d; } else if((d-=ih)<iw){ x=l+iw-d; y=t+ih; } else { d-=iw; x=l; y=t+ih-d; }
        out.over+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="6.5" fill="#fff6c2" stroke="${pal.accents[0]}" stroke-width="2"/>`; }
      out.tw=w*.82; break; }
    case 'ticket': {
      const w=rx*1.9,h=ry*1.35,l=cx-w/2,t=cy-h/2,n=h*.16;
      out.d=`M${f1(l)},${f1(t)} H${f1(l+w)} V${f1(cy-n)} A${f1(n)},${f1(n)} 0 0 0 ${f1(l+w)},${f1(cy+n)} V${f1(t+h)} H${f1(l)} V${f1(cy+n)} A${f1(n)},${f1(n)} 0 0 0 ${f1(l)},${f1(cy-n)}Z`;
      out.over+=`<line x1="${f1(l+w*.84)}" y1="${f1(t+12)}" x2="${f1(l+w*.84)}" y2="${f1(t+h-12)}" stroke="${pal.shadow}" stroke-width="4" stroke-dasharray="10 9" opacity=".6"/>`;
      out.over+=logoDecor('star',r,l+w*.92,cy,26,pal.accents[0],pal);
      out.tc=[cx-w*.07,cy]; out.tw=w*.72; break; }
    case 'plank': {
      const w=rx*1.95,h=ry*1.12,l=cx-w/2,t=cy-h/2+16, j=()=>lgR(r,-6,6);
      [[l+w*.2,l+w*.3],[l+w*.8,l+w*.7]].forEach(([x0,x1])=>{ out.under+=`<line x1="${f1(x0)}" y1="${f1(t+8)}" x2="${f1(x1)}" y2="${f1(t-70)}" stroke="#c9a36b" stroke-width="6" stroke-linecap="round"/>`; });
      out.d=polyPath([[l+j(),t+j()],[cx,t+j()*.5],[l+w+j(),t+j()],[l+w+j(),t+h+j()],[cx,t+h+j()*.5],[l+j(),t+h+j()]]);
      for(let k=1;k<=3;k++){ const y=t+h*k/4; out.over+=`<path d="M${f1(l+20)},${f1(y)} q${f1(w*.25)},${f1(lgR(r,-8,8))} ${f1(w*.5)},0 t${f1(w*.45)},0" fill="none" stroke="${pal.shadow}" stroke-width="3" opacity=".25"/>`; }
      [[l+16,t+16],[l+w-16,t+16],[l+16,t+h-16],[l+w-16,t+h-16]].forEach(([x,y])=>{ out.over+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="6" fill="${pal.shadow}" opacity=".7"/>`; });
      out.tc=[cx,t+h/2]; out.tw=w*.86; break; }
    case 'sheriff': {
      const R=ry*1.12, pts=ring(cx,cy,R,R,12,i=>i%2?.62:1); out.d=polyPath(pts);
      pts.filter((_,i)=>i%2===0).forEach(([x,y])=>{ out.mid+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="15" fill="${pal.shape}" stroke="${pal.shadow}" stroke-width="3"/>`; });
      out.over+=`<circle cx="${cx}" cy="${cy}" r="${f1(R*.5)}" fill="none" stroke="${pal.shadow}" stroke-width="4" opacity=".35"/>`;
      out.tw=rx*1.7; break; }
    case 'plaque': {
      const w=rx*1.85,h=ry*1.3,l=cx-w/2,t=cy-h/2,c=26,i=12;
      out.d=polyPath([[l+c,t],[l+w-c,t],[l+w,t+c],[l+w,t+h-c],[l+w-c,t+h],[l+c,t+h],[l,t+h-c],[l,t+c]]);
      out.over+=`<path d="${polyPath([[l+c,t+i],[l+w-c,t+i],[l+w-i,t+c],[l+w-i,t+h-c],[l+w-c,t+h-i],[l+c,t+h-i],[l+i,t+h-c],[l+i,t+c]])}" fill="none" stroke="${pal.accents[0]}" stroke-width="3" opacity=".8"/>`;
      out.tw=w*.86; break; }
    case 'globe': {
      const R=ry*1.06; out.d=circlePath(cx,cy,R);
      [.38,.75].forEach(k=>{ out.over+=`<ellipse cx="${cx}" cy="${cy}" rx="${f1(R*k)}" ry="${f1(R)}" fill="none" stroke="${pal.shape2}" stroke-width="3" opacity=".55"/>`; });
      [-.5,0,.5].forEach(k=>{ const y=cy+k*R, hw=Math.sqrt(R*R-(k*R)**2); out.over+=`<line x1="${f1(cx-hw)}" y1="${f1(y)}" x2="${f1(cx+hw)}" y2="${f1(y)}" stroke="${pal.shape2}" stroke-width="3" opacity=".55"/>`; });
      out.tw=rx*1.75; break; }
    case 'tv': tv('v', false); break;
    case 'tvrabbit': tv('rabbit', false); break;
    case 'tvlegs': tv('v', true); break;
    case 'sunset': {
      out.d=circlePath(cx,cy,ry*1.08);
      out.stripes=true; out.tw=ry*2.2; break; }
  }
  return out;
}

// Small decorations scattered around the backdrop's edge.
function logoDecor(kind, r, x, y, s, color, pal){
  switch(kind){
    case 'sparkle': case 'twinkle': { const k=s*.28;
      return `<path d="M${f1(x)},${f1(y-s)} Q${f1(x+k)},${f1(y-k)} ${f1(x+s)},${f1(y)} Q${f1(x+k)},${f1(y+k)} ${f1(x)},${f1(y+s)} Q${f1(x-k)},${f1(y+k)} ${f1(x-s)},${f1(y)} Q${f1(x-k)},${f1(y-k)} ${f1(x)},${f1(y-s)}Z" fill="${color}"/>`; }
    case 'dot': return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(s*.4)}" fill="${color}"/>`;
    case 'ring': return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(s*.55)}" fill="none" stroke="${color}" stroke-width="4"/>`;
    case 'squiggle': { let d=`M${f1(x-s*1.4)},${f1(y)}`; for(let i=0;i<4;i++) d+=` q${f1(s*.35)},${i%2?s*.6:-s*.6} ${f1(s*.7)},0`;
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" transform="rotate(${f1(lgR(r,-40,40))} ${f1(x)} ${f1(y)})"/>`; }
    case 'zigzag': { let d=`M${f1(x-s*1.3)},${f1(y)}`; for(let i=0;i<5;i++) d+=` l${f1(s*.52)},${i%2?s*.5:-s*.5}`;
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" transform="rotate(${f1(lgR(r,-30,30))} ${f1(x)} ${f1(y)})"/>`; }
    case 'triangle': case 'confetti': case 'memphis': {
      const t=kind==='triangle'?0:Math.floor(r()*3), rot=f1(lgR(r,0,360));
      if(t===0) return `<path d="M${f1(x)},${f1(y-s*.6)} L${f1(x+s*.55)},${f1(y+s*.4)} L${f1(x-s*.55)},${f1(y+s*.4)}Z" fill="${color}" transform="rotate(${rot} ${f1(x)} ${f1(y)})"/>`;
      if(t===1) return `<rect x="${f1(x-s*.5)}" y="${f1(y-s*.18)}" width="${f1(s)}" height="${f1(s*.36)}" rx="4" fill="${color}" transform="rotate(${rot} ${f1(x)} ${f1(y)})"/>`;
      return logoDecor(kind==='memphis'?'squiggle':'dot', r, x, y, s, color, pal); }
    case 'star': return `<path d="${polyPath(ring(x,y,s*.6,s*.6,10,i=>i%2?.45:1))}" fill="${color}"/>`;
    case 'bolt': return `<path d="M${f1(x+s*.15)},${f1(y-s*.75)} L${f1(x-s*.4)},${f1(y+s*.08)} L${f1(x)},${f1(y+s*.08)} L${f1(x-s*.18)},${f1(y+s*.75)} L${f1(x+s*.42)},${f1(y-s*.12)} L${f1(x+s*.02)},${f1(y-s*.12)}Z" fill="${color}" stroke="${pal.stroke}" stroke-width="3" stroke-linejoin="round"/>`;
    case 'spark': return `<path d="M${f1(x-s*.6)},${f1(y)} L${f1(x+s*.6)},${f1(y)} M${f1(x)},${f1(y-s*.6)} L${f1(x)},${f1(y+s*.6)}" stroke="${color}" stroke-width="5" stroke-linecap="round" transform="rotate(${f1(lgR(r,0,45))} ${f1(x)} ${f1(y)})"/>`;
    case 'speed': return `<path d="M${f1(x-s*1.6)},${f1(y)} L${f1(x+s*.4)},${f1(y)}" stroke="${color}" stroke-width="${f1(lgR(r,4,9))}" stroke-linecap="round"/>`;
    case 'bat': { const w=s*1.1;
      return `<path d="M${f1(x)},${f1(y-w*.12)} Q${f1(x-w*.3)},${f1(y-w*.45)} ${f1(x-w)},${f1(y-w*.25)} Q${f1(x-w*.7)},${f1(y)} ${f1(x-w*.55)},${f1(y+w*.15)} Q${f1(x-w*.35)},${f1(y-w*.02)} ${f1(x-w*.2)},${f1(y+w*.18)} Q${f1(x)},${f1(y)} ${f1(x)},${f1(y+w*.12)} Q${f1(x)},${f1(y)} ${f1(x+w*.2)},${f1(y+w*.18)} Q${f1(x+w*.35)},${f1(y-w*.02)} ${f1(x+w*.55)},${f1(y+w*.15)} Q${f1(x+w*.7)},${f1(y)} ${f1(x+w)},${f1(y-w*.25)} Q${f1(x+w*.3)},${f1(y-w*.45)} ${f1(x)},${f1(y-w*.12)}Z" fill="${color}"/>`; }
    case 'drop': return `<path d="M${f1(x)},${f1(y-s*.6)} Q${f1(x+s*.45)},${f1(y+s*.05)} ${f1(x)},${f1(y+s*.45)} Q${f1(x-s*.45)},${f1(y+s*.05)} ${f1(x)},${f1(y-s*.6)}Z" fill="${color}"/>`;
    case 'heart': return `<path d="${heartPath(x,y,s*.45,s*.5)}" fill="${color}" transform="rotate(${f1(lgR(r,-20,20))} ${f1(x)} ${f1(y)})"/>`;
    case 'note': return `<g fill="${color}" transform="rotate(${f1(lgR(r,-15,15))} ${f1(x)} ${f1(y)})"><ellipse cx="${f1(x-s*.22)}" cy="${f1(y+s*.45)}" rx="${f1(s*.3)}" ry="${f1(s*.22)}"/>`+
      `<rect x="${f1(x)}" y="${f1(y-s*.65)}" width="${f1(s*.11)}" height="${f1(s*1.1)}"/><path d="M${f1(x+s*.1)},${f1(y-s*.65)} q${f1(s*.5)},${f1(s*.15)} ${f1(s*.38)},${f1(s*.62)} q${f1(-s*.04)},${f1(-s*.3)} ${f1(-s*.38)},${f1(-s*.34)}Z"/></g>`;
    case 'leaf': return `<path d="M${f1(x-s*.6)},${f1(y)} Q${f1(x)},${f1(y-s*.7)} ${f1(x+s*.6)},${f1(y)} Q${f1(x)},${f1(y+s*.7)} ${f1(x-s*.6)},${f1(y)}Z" fill="${color}" transform="rotate(${f1(lgR(r,-60,60))} ${f1(x)} ${f1(y)})"/>`;
    case 'cloudpuff': return `<g fill="${color}" opacity=".9"><circle cx="${f1(x-s*.45)}" cy="${f1(y+s*.1)}" r="${f1(s*.38)}"/><circle cx="${f1(x)}" cy="${f1(y-s*.12)}" r="${f1(s*.5)}"/><circle cx="${f1(x+s*.48)}" cy="${f1(y+s*.12)}" r="${f1(s*.36)}"/></g>`;
  }
  return '';
}

// Split logo text into 1–2 balanced lines (an explicit "/" or newline forces the break).
function logoLines(text){
  const t=String(text||'').trim(); if(!t) return ['TV'];
  if(/[\/\n]/.test(t)) return t.split(/\s*[\/\n]\s*/).filter(Boolean).slice(0,2);
  const w=t.split(/\s+/); if(w.length<2) return [t];
  let best=null;
  for(let i=1;i<w.length;i++){ const a=w.slice(0,i).join(' '), b=w.slice(i).join(' '); const sc=Math.max(a.length,b.length);
    if(!best||sc<best.sc) best={sc,lines:[a,b]}; }
  return best.lines;
}
const _lgCtx=document.createElement('canvas').getContext('2d');
function lgMeasure(text, fontStack, size, spacing=0, weight=900){
  _lgCtx.font=`${weight} ${size}px ${fontStack}`;
  return _lgCtx.measureText(text).width + Math.max(0,text.length-1)*spacing*size;
}

// One line of chunky type: shadow, thick outline, fill. Per-letter placement
// gives toon/comedy bounce, and lets any style curve its text along an arc.
function logoTextLine(text, cx, baseline, size, st, r, fill, pal, idx, arc){
  const font=LOGO_FONTS[st.font], sp=st.spacing||0, wt=st.weight||900;
  const attrs=`font-family="${font}" font-weight="${wt}" font-size="${f1(size)}"`;
  const sw=f1(size*(st.font==='script'?.1:.15)), shOff=f1(size*.07);
  const total=lgMeasure(text,font,size,sp,wt);
  let glyphs;  // [{ch,x,y,rot}]
  if(st.perLetter||st.jitter||arc){
    glyphs=[...text].map((ch,i,arr)=>{
      const x=cx-total/2+lgMeasure(arr.slice(0,i).join(''),font,size,sp,wt)+(i?sp*size:0);
      const w=lgMeasure(ch,font,size,0,wt), dx=x+w/2-cx;
      let y=baseline+(st.perLetter?Math.sin(i*1.9+idx*1.3)*size*.05:st.jitter?lgR(r,-1,1)*size*.03:0);
      let rot=st.tilt||st.perLetter?lgR(r,-7,7):st.jitter?lgR(r,-3,3):0;
      if(arc){ y+=arc*dx*dx; rot+=Math.atan(2*arc*dx)*180/Math.PI; }
      return {ch,x,y,rot,w};
    });
  } else glyphs=[{ch:text,x:cx-total/2,y:baseline,rot:0}];
  const ls=sp&&glyphs.length===1?` letter-spacing="${f1(sp*size)}"`:'';
  const g=(extra,dx=0,dy=0)=>glyphs.map(q=>q.ch.trim()?
    `<text x="${f1(q.x+dx)}" y="${f1(q.y+dy)}" ${attrs}${ls}${q.rot?` transform="rotate(${f1(q.rot)} ${f1(q.x+(q.w||size*.6)/2)} ${f1(q.y-size*.35)})"`:''} ${extra}>${escHtml(q.ch)}</text>`:'').join('');
  const wrap=s=>st.skew?`<g transform="translate(${f1(cx)} ${f1(baseline)}) skewX(${st.skew}) translate(${f1(-cx)} ${f1(-baseline)})">${s}</g>`:s;
  let svg='';
  if(st.echo) svg+=g(`fill="none" stroke="${pal.text2}" stroke-width="3" opacity=".35"`, -size*.08, -size*.1);
  svg+=g(`fill="${pal.shadow}" stroke="${pal.shadow}" stroke-width="${sw}" stroke-linejoin="round"`, shOff, shOff);
  svg+=g(`fill="${fill}" stroke="${pal.stroke}" stroke-width="${sw}" stroke-linejoin="round" paint-order="stroke"`);
  return {svg:wrap(svg), width:total};
}
// Banner ribbon behind a line of text, with notched, folded-back tails.
function logoRibbon(cx, midY, w, h, fill, pal){
  const l=cx-w/2, t=midY-h/2, tl=h*.75, back=h*.22;
  const tail=s=>{ const x=s<0?l:l+w; return `<path d="${polyPath([[x,t+back],[x+s*tl,t+back],[x+s*tl*.62,t+back+h/2],[x+s*tl,t+back+h],[x,t+back+h]])}" fill="${pal.shadow}"/>`; };
  return tail(-1)+tail(1)+`<rect x="${f1(l)}" y="${f1(t)}" width="${f1(w)}" height="${f1(h)}" fill="${fill}" stroke="${pal.shadow}" stroke-width="4"/>`;
}

function generateLogoSvg({text, style, variant=0}){
  const st=LOGO_STYLES[style]||LOGO_STYLES.retro;
  const r=seededRng(`${style}|${variant}`);
  const pal=lgPick(r,st.palettes), shapeKind=lgPick(r,st.shapes);
  const cx=LOGO_W/2, cy=LOGO_H/2+6, rx=lgR(r,262,282), ry=lgR(r,172,186);
  const id='lg'+(hashStr(style+'|'+variant)%1e7);
  const sh=logoShape(shapeKind, r, cx, cy, rx, ry, pal, id);
  const arcRoll=r(), ribbonRoll=r(), arcK=lgR(r,.0007,.0013)*(r()<.75?1:-1);
  const lines=logoLines(text).map(s=>st.keepCase?s:s.toUpperCase());
  const ribbon = lines.length>1 && st.ribbon && ribbonRoll<st.ribbon;
  const arc = st.arc && arcRoll<st.arc ? arcK : 0;
  // text sizing: fit each line to the backdrop's width
  const font=LOGO_FONTS[st.font], sp=st.spacing||0, wt=st.weight||900;
  const [tcx,tcy]=sh.tc||[cx,cy];
  const maxW=sh.tw||rx*1.62;
  const caps=lines.length>1?[128,ribbon?78:92]:[150];
  const sizes=lines.map((l,i)=>Math.max(28,Math.min(caps[i], caps[i]*maxW*(ribbon&&i?.8:1)/lgMeasure(l,font,caps[i],sp,wt))));
  const gap=lines.length>1?sizes[1]*(ribbon?.42:.18):0;
  const blockH=sizes.reduce((a,s)=>a+s*.74,0)+gap;
  let y=tcy-blockH/2+sizes[0]*.74;
  const textSvg=lines.map((l,i)=>{
    if(i) y+=gap+sizes[i]*.74;
    let fill=i===0?pal.text:pal.text2, rib='';
    if(ribbon && i===1){
      // ribbon colour: whichever of the shape's tones contrasts most with the
      // text; if none is clear enough, switch the text to white or near-black
      const opts=[pal.accents[0], pal.shadow, pal.shape2], tl=hexLum(fill);
      const rf=opts.reduce((b,c)=>Math.abs(hexLum(c)-tl)>Math.abs(hexLum(b)-tl)?c:b);
      if(Math.abs(hexLum(rf)-tl)<.4) fill=hexLum(rf)>.5?'#141414':'#ffffff';
      rib=rf;
    }
    const t=logoTextLine(l, tcx, y, sizes[i], st, r, fill, pal, i, i===0?arc:0);
    return (rib?logoRibbon(tcx, y-sizes[i]*.36, t.width+sizes[i]*1.1, sizes[i]*1.18, rib, pal):'')+t.svg;
  }).join('');
  // decorations on a ring around the backdrop edge, kept clear of the text's middle band
  let decor='';
  const n=Math.floor(lgR(r,4,8));
  for(let i=0;i<n;i++){
    let a=lgR(r,0,Math.PI*2); if(Math.abs(Math.sin(a))<.35) a+=Math.PI/2*.6;
    const k=lgR(r,.96,1.14), x=cx+Math.cos(a)*rx*k, yy=cy+Math.sin(a)*ry*k;
    if(x<18||x>LOGO_W-18||yy<18||yy>LOGO_H-18) continue;
    decor+=logoDecor(lgPick(r,st.decor), r, x, yy, lgR(r,14,26), lgPick(r,pal.accents), pal);
  }
  if(shapeKind==='slash'||st.decor.includes('speed')) for(let i=0;i<3;i++) decor+=logoDecor('speed',r,cx-rx*.98-lgR(r,0,30),cy-ry*.4+i*ry*.4,lgR(r,26,40),pal.accents[i%pal.accents.length],pal);
  const shapeTf=sh.rot?` transform="rotate(${f1(sh.rot)} ${cx} ${cy})"`:'';
  const body=sh.rect
    ? (o,fill)=>`<rect x="${f1(sh.rect[0]+o)}" y="${f1(sh.rect[1]+o)}" width="${f1(sh.rect[2])}" height="${f1(sh.rect[3])}" rx="${sh.rx}" fill="${fill}"${shapeTf}/>`
    : (o,fill)=>`<path d="${sh.d}" fill="${fill}"${o?` transform="translate(${o} ${o})"`:''}/>`;
  const stripes = sh.stripes ? `<clipPath id="${id}c"><path d="${sh.d}"/></clipPath><g clip-path="url(#${id}c)">`+
      [0,1,2,3].map(i=>`<rect x="0" y="${f1(cy+ry*.18+i*ry*.2)}" width="${LOGO_W}" height="${f1(ry*.09+i*2)}" fill="${pal.shadow}" opacity=".55"/>`).join('')+`</g>` : '';
  const gloss = ['blob','splat','goo','softburst','planet','moon','orbit','record','globe','circlebadge','magnify','heart'].includes(shapeKind)
    ? `<ellipse cx="${f1(cx-rx*.45)}" cy="${f1(cy-ry*.55)}" rx="${f1(rx*.22)}" ry="${f1(ry*.12)}" transform="rotate(-25 ${f1(cx-rx*.45)} ${f1(cy-ry*.55)})" fill="#fff" opacity=".22"/>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${LOGO_W}" height="${LOGO_H}" viewBox="0 0 ${LOGO_W} ${LOGO_H}">`+
    `<defs><radialGradient id="${id}g" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="${pal.shape2}"/><stop offset="1" stop-color="${pal.shape}"/></radialGradient>`+
    `<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".46" stop-color="#cfe9ff"/>`+
    `<stop offset=".5" stop-color="#5a5fb0"/><stop offset=".56" stop-color="#a9dcff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>${sh.defs}</defs>`+
    sh.under + body(14, pal.shadow) + body(0, `url(#${id}g)`) + sh.mid + stripes + gloss + sh.over + decor + textSvg + `</svg>`;
}
async function logoPng(svg){
  const img=new Image();
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  await img.decode();
  const c=document.createElement('canvas'); c.width=LOGO_W; c.height=LOGO_H;
  c.getContext('2d').drawImage(img,0,0);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('PNG export failed')),'image/png'));
}
// Upload a PNG to Tunarr (multipart; server.js streams it through) and make
// it the channel's icon. Each upload gets a fresh name so guides don't show a
// cached old logo.
async function setChannelLogo(ch, logo){
  const blob=await logoPng(generateLogoSvg(logo));
  const fd=new FormData();
  fd.append('file', blob, `studio-logo-${String(ch.id).slice(0,8)}-${Date.now().toString(36)}.png`);
  const r=await fetch(State.base.replace(/\/$/,'')+'/api/upload/image',{method:'POST',body:fd});
  if(!r.ok) throw new Error(`HTTP ${r.status} uploading logo`);
  const up=await r.json();
  if(!up||!up.fileUrl) throw new Error('Tunarr did not return an image URL');
  const full=await api('GET',`/channels/${ch.id}`);
  const icon={path:'',width:0,duration:0,position:'bottom-right',...(full.icon||{}), path:up.fileUrl};
  await api('PUT',`/channels/${ch.id}`,{...full, icon});
  await savePrefs({logo:{text:logo.text, style:logo.style, variant:logo.variant}}, ch.id).catch(()=>{});
  State.channels=await api('GET','/channels');
  return up.fileUrl;
}
// Reusable editor: big preview + a grid of designs to click, paged with ‹ ›.
// Style "All styles" mixes every style family into the grid.
// Returns {get() -> {text, style, variant}, buttons (row for extra controls)}.
function mountLogoEditor(box, init, {compact=false, textInput=null}={}){
  const N=compact?4:8, keys=Object.keys(LOGO_STYLES);
  const sel={style:LOGO_STYLES[init.style]?init.style:'retro',
    variant:init.variant!=null?init.variant:hashStr(init.text||'')%N};  // unsaved: a name-picked design on page 1
  let browse=sel.style, page=Math.floor(sel.variant/N);
  box.innerHTML='';
  box.classList.add('logo-ed'); box.classList.toggle('compact',compact);
  const prev=el('div','logo-prev'), ctl=el('div','logo-ctl');
  let txt=textInput;
  if(!txt){
    ctl.append(el('label','lab2','Logo text'));
    txt=el('input','search-in'); txt.value=init.text||''; txt.placeholder='Channel name';
    ctl.append(txt, el('div','hint','Use “/” to choose where it splits into two lines.'));
  }
  ctl.append(el('label','lab2','Style'));
  const styleSel=el('select','search-in');
  styleSel.append(new Option('All styles — mix them up','*'));
  keys.forEach(k=>styleSel.append(new Option(LOGO_STYLES[k].label,k)));
  styleSel.value=browse; ctl.append(styleSel);
  const row=el('div','logo-btns'); ctl.append(row);
  const grid=el('div','logo-grid');
  const nav=el('div','logo-nav');
  const back=el('button','btn ghost sm','‹'), fwd=el('button','btn ghost sm','More designs ›'), pg=el('span','pg');
  back.title='Previous designs';
  nav.append(back, pg, fwd);
  const text=()=>txt.value.trim()||init.text||'';
  const designs=()=>Array.from({length:N},(_,i)=>{ const idx=page*N+i;
    return browse==='*' ? {style:keys[idx%keys.length], variant:Math.floor(idx/keys.length)} : {style:browse, variant:idx}; });
  let raf=0;
  const draw=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{
    const t=text();
    prev.innerHTML=generateLogoSvg({...sel,text:t});
    grid.innerHTML='';
    designs().forEach(d=>{
      const th=el('div','logo-thumb'+(d.style===sel.style&&d.variant===sel.variant?' on':''));
      th.title=LOGO_STYLES[d.style].label.split(' — ')[0]+` · design ${d.variant+1}`;
      th.innerHTML=generateLogoSvg({...d,text:t});
      th.onclick=()=>{ sel.style=d.style; sel.variant=d.variant; draw(); };
      grid.append(th);
    });
    back.disabled=page===0;
    pg.textContent=`Designs ${page*N+1}–${page*N+N}`;
  }); };
  txt.addEventListener('input',draw);
  styleSel.onchange=()=>{ browse=styleSel.value; page=0;
    if(browse!=='*'){ sel.style=browse; sel.variant=0; } draw(); };
  back.onclick=()=>{ if(page>0){ page--; draw(); } };
  fwd.onclick=()=>{ page++; draw(); };
  box.append(prev, ctl, grid, nav); draw();
  return { get:()=>({style:sel.style, variant:sel.variant, text:text()}), buttons:row };
}

/* ---------- channel options: rename / delete ---------- */
async function openChannelOptions(){
  const ch = State.current; if(!ch) return;
  $('.modal').classList.add('wide');
  $('#modalTitle').textContent = 'Channel options';
  $('#modalOk').style.display='none'; $('#modalCancel').textContent='Close'; $('#modalCancel').onclick=()=>closeModal();
  const icon = ch.icon && ch.icon.path;
  $('#modalBody').innerHTML =
    `<label class="lab2">Name</label>`+
    `<div style="display:flex;gap:8px"><input id="coName" class="search-in" style="flex:1" value="${escHtml(ch.name||'')}">`+
    `<button class="btn primary sm" id="coRename">Save name</button></div>`+
    `<div class="co-section"><div class="co-head"><b>Logo</b>`+
      (icon?`<span class="hint">Current: <img class="cur-logo" src="${escHtml(icon)}" alt="" onerror="this.parentNode.remove()"></span>`:'')+
    `</div><div id="coLogo"></div></div>`+
    `<div class="danger-zone"><div><b>Delete channel</b><div class="hint">Removes #${ch.number} and its lineup from Tunarr. `+
    `Your media library isn't touched.</div></div><button class="btn danger sm" id="coDelete">Delete…</button></div>`;
  $('#modalBg').classList.add('show');
  const inp=$('#coName');
  const save=()=>{ const n=inp.value.trim(); if(!n){ toast('Enter a name','warn'); return; } renameChannel(ch, n); };
  $('#coRename').onclick=save;
  inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } };
  $('#coDelete').onclick=()=>deleteChannel(ch);

  // logo editor: starts from the saved logo, else the channel name + a style
  // guessed from the genres the channel was created with
  const prefs = await loadPrefs(ch.id) || {};
  const saved = prefs.logo || {};
  const ed = mountLogoEditor($('#coLogo'), {
    text: saved.text || ch.name, variant: saved.variant,
    style: saved.style || guessLogoStyle(ch.name, prefs.genres),
  });
  const use = el('button','btn primary sm','Use as channel logo');
  use.onclick = async ()=>{
    use.disabled=true; use.textContent='Uploading…';
    try{
      await setChannelLogo(ch, ed.get());
      State.current = State.channels.find(c=>c.id===ch.id) || ch;
      closeModal(); renderChannels(); renderMain();
      toast('Logo set. Guides pick it up on their next refresh.','ok');

/* ---------- group lineup by show ---------- */
function showInfo(prog){
  // Condensed programming map values are: {type:'content', id, duration, program}
  // where program is the episode, and the show is NESTED at program.show
  // ({id/uuid, title, rating}). Season is at program.season. (Verified against
  // MaterializeProgramsCommand: apiItem.show = convertedShow.)
  const term = prog.program || prog;
  const show = term.show || prog.show || null;
  const ptype = term.type || prog.type;

  let showId = (show && (show.id || show.uuid)) || term.showId || null;
  let title  = (show && show.title) || null;
  let rating = (show && show.rating) || term.rating || prog.rating || null;

  if(!title){
    if(ptype==='movie'){
      // Each movie is its own group, keyed by program id (two films can share a title).
      title = term.title || prog.title || '(movie)';
      showId = showId || ('movie::'+(prog.id||term.id||term.uuid||title));
    } else {
      // genuinely no show data — leave title null so caller can resolve by id
      title = null;
    }
  }
  if(!showId) showId = title ? ('title::'+title) : ('item::'+(term.uuid||prog.id||'x'));
  return {showId, title, rating, ptype};
}

async function groupShows(programming){
  const lineup = programming.lineup||[];
  const programs = programming.programs||{};
  const map = new Map();
  for(const e of lineup){
    if(e.type!=='content') continue;
    const prog = programs[e.id]||{};
    const {showId,title,rating,ptype} = showInfo(prog);
    let g = map.get(showId);
    if(!g){
      const term = prog.program || prog;
      g={showId,title,rating,count:0,ids:[],weight:1,dur:0,
        kind: ptype==='movie' ? 'movie' : 'show',
        year: ptype==='movie' ? (term.year||null) : null};
      map.set(showId,g);
    }
    g.count++; g.ids.push(e.id); g.dur += e.duration||0;
    if(!g.title && title) g.title = title;
    if(!g.rating && rating) g.rating = rating;
  }
  // Resolve titles only for real show groups still missing one.
  const needsTitle = [...map.values()].filter(g=>
    !g.title && !g.showId.startsWith('title::') && !g.showId.startsWith('movie::') && !g.showId.startsWith('item::')
  );
  await Promise.all(needsTitle.map(async g=>{
    try{
      const show = await api('GET',`/programming/shows/${g.showId}`);
      const t = show && (show.title || show.name);
      if(t) g.title = t;
      const r = show && (show.rating || show.contentRating);
      if(r && !g.rating) g.rating = r;
    }catch(e){ /* keep fallback */ }
  }));
  for(const g of map.values()){ if(!g.title) g.title='(unknown show)'; }
  return [...map.values()];
}
const showGroups  = ()=> State.shows.filter(g=>g.kind!=='movie');
const movieGroups = ()=> State.shows.filter(g=>g.kind==='movie');
// Movies' current share of the lineup's airtime, rounded to 5%.
function currentMoviePct(){
  const m=movieGroups().reduce((a,g)=>a+g.dur,0), s=showGroups().reduce((a,g)=>a+g.dur,0);
  return m+s ? Math.round(m/(m+s)*20)*5 : 0;
}

/* ---------- shared list helpers ---------- */
// Checkbox lists: plain click toggles one row; shift-click sets every row
// between it and the last-clicked row to the clicked row's new state.
// rows: [{chk, item}] in display order; selection lives on item._sel.
function wireRangeSelect(rows, onChange){
  let last=null;
  rows.forEach((r,idx)=>{
    r.chk.addEventListener('click', e=>{
      const v=r.chk.checked;
      if(e.shiftKey && last!=null && last!==idx){
        const [a,b]=last<idx?[last,idx]:[idx,last];
        for(let k=a;k<=b;k++){ rows[k].item._sel=v; rows[k].chk.checked=v; }
      } else r.item._sel=v;
      last=idx; onChange&&onChange();
    });
  });
}
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
// Interleave a show sequence and movies so movies get ~pct% of airtime.
// The lineup is also the channel's content pool, so nothing is dropped: the
// shorter side is repeated (up to 4 passes) to reach the target, and whatever
// ratio that achieves is spread evenly through the lineup by time.
// Returns {lineup, pct} where pct is the share actually achieved.
function mixByAirtime(showSeq, movies, pct){
  const dur=a=>a.reduce((s,e)=>s+(e.duration||0),0);
  if(!movies.length) return {lineup:showSeq.slice(), pct:0};
  if(!showSeq.length) return {lineup:movies.slice(), pct:100};
  if(pct<=0) return {lineup:showSeq.slice(), pct:0};
  if(pct>=100) return {lineup:movies.slice(), pct:100};
  const p=pct/100;
  let S=showSeq.slice(), M=shuffled(movies);
  // repeat items (a fresh pass of `base` each time round) only until `need` is met
  const grow=(arr,base,need,reshuffle)=>{
    let t=dur(arr), pass=reshuffle?shuffled(base):base, k=0;
    while(t<need && arr.length<base.length*4){
      if(k>=pass.length){ pass=reshuffle?shuffled(base):base; k=0; }
      arr.push(pass[k]); t+=pass[k++].duration||0;
    }
    return arr;
  };
  if(dur(M) < dur(S)*p/(1-p)) M=grow(M,movies,dur(S)*p/(1-p),true);
  else S=grow(S,showSeq,dur(M)*(1-p)/p,false);
  const Ts=dur(S), Tm=dur(M), q=Tm/(Ts+Tm);
  const out=[]; let i=0,j=0,ms=0,ss=0;
  while(i<S.length||j<M.length){
    if(j<M.length && (i>=S.length || ms <= q*(ms+ss))){ ms+=M[j].duration||0; out.push(M[j++]); }
    else { ss+=S[i].duration||0; out.push(S[i++]); }
  }
  return {lineup:out, pct:Math.round(q*100)};
}
// "Movies' share of airtime" slider block used by Manage and the create page.

  wrap.append(el('div','hint','Share of airtime for movies vs. show episodes.'));

}

/* ---------- NOW PLAYING / SKIP ---------- *
 * Tunarr plays a looping lineup anchored at channel.startTime (epoch ms).
 * Position now = (Date.now() - startTime) mod totalDuration. To change what's
 * on, we shift startTime so the playhead lands at the start of a chosen
 * program. Shifting startTime triggers a guide regen server-side.
 * --------------------------------------------------------------------------- */
function lineupDurations(){
  // returns [{idx, type, id, durationMs, offsetMs, title, show}] for the *content+flex* loop
  const lineup = State.programming.lineup||[];
  const programs = State.programming.programs||{};
  let off=0; const out=[];
  lineup.forEach((e,i)=>{
    const dur = e.duration || (programs[e.id] && programs[e.id].duration) || 0;
    let title='Flex', show='';
    if(e.type==='content'){
      const info = showInfo(programs[e.id]||{});
      show = info.title;
      const term = (programs[e.id]||{}).program||{};
      title = term.title || (programs[e.id]||{}).title || info.title;
    } else if(e.type==='redirect'){ title='Redirect'; }
    out.push({idx:i, type:e.type, id:e.id, durationMs:dur, offsetMs:off, title, show});
    off += dur;
  });
  return {items:out, total:off};
}

function currentPlayhead(){
  const ch = State.current;
  const {items,total} = lineupDurations();
  if(!total) return null;
  const elapsed = ((Date.now() - (ch.startTime||0)) % total + total) % total;
  let cur = items[0];
  for(const it of items){ if(elapsed >= it.offsetMs && elapsed < it.offsetMs+it.durationMs){ cur=it; break; } }
  return {cur, elapsed, total, items, into: elapsed - cur.offsetMs};
}

function renderNowPanel(){
  const wrap = el('div','now');
  const ph = currentPlayhead();
  const left = el('div'); 
  const live = el('div','live'); live.append(el('span','led')); live.append(document.createTextNode('On now'));
  left.append(live);
  const body = el('div','np-body');
  if(ph){
    const c = ph.cur;
    const t = el('div','np-title', c.type==='content' ? (c.show && c.show!==c.title ? `${c.show} — ${c.title}` : c.title) : c.title);
    const remain = Math.max(0, (c.durationMs - ph.into));
    const sub = el('div','np-sub', `${fmtDur(ph.into)} / ${fmtDur(c.durationMs)} · ${fmtDur(remain)} left`);
    body.append(t, sub);
    const prog = el('div','now-prog'); const bar=el('i'); bar.style.width=Math.min(100,(ph.into/c.durationMs*100||0))+'%'; prog.append(bar);
    body.append(prog);
  } else {
    body.append(el('div','np-title','No schedule yet'), el('div','np-sub','Apply programming to start the channel loop.'));
  }
  const actions = el('div','np-actions');
  const skipBtn = el('button','btn','Skip ▸'); skipBtn.title='Jump to the next program now'; skipBtn.onclick=()=>skipToNext();
  const pickBtn = el('button','btn','Change to…'); pickBtn.title='Jump to a specific show now'; pickBtn.onclick=()=>openPicker();
  const reshufBtn = el('button','btn','Reshuffle'); reshufBtn.title='Wipe & reload, then start fresh'; reshufBtn.onclick=()=>reshuffleNow();
  actions.append(skipBtn, pickBtn, reshufBtn);

  wrap.append(left, body, actions);
  return wrap;
}

function fmtDur(ms){
  const s=Math.round(ms/1000); const m=Math.floor(s/60), ss=s%60;
  if(m>=60){const h=Math.floor(m/60); return `${h}h${String(m%60).padStart(2,'0')}`;}
  return `${m}:${String(ss).padStart(2,'0')}`;
}

async function shiftStartTimeTo(targetOffsetMs){
  // set startTime so that "now" equals targetOffsetMs into the loop
  const fresh = await api('GET',`/channels/${State.current.id}`);
  const newStart = Date.now() - targetOffsetMs;
  const body = {...fresh, startTime: newStart};
  // SaveableChannel omits some fields; sending extras is tolerated, but strip the obvious server-only ones
  delete body.programCount; delete body.sessions; delete body.fallback; delete body.transcoding;
  await api('PUT',`/channels/${State.current.id}`, body);
  State.current.startTime = newStart;
}

async function skipToNext(){
  const ph = currentPlayhead();
  if(!ph){toast('No schedule to skip','warn');return;}
  // next program offset (wrap to 0 at end)
  const items = ph.items;
  const curIdx = items.indexOf(ph.cur);
  const next = items[(curIdx+1) % items.length];
  try{
    await shiftStartTimeTo(next.offsetMs + 50); // +50ms so we're safely inside it
    toast(`Skipped to “${next.show||next.title}”.`,'ok');
    renderMain();
  }catch(e){ toast('Skip failed: '+e.message,'err',6000); }
}

function openPicker(){
  const {items} = lineupDurations();
  // distinct shows with their first offset
  const seen = new Map();
  items.forEach(it=>{ if(it.type!=='content') return; if(!seen.has(it.show)) seen.set(it.show, it); });
  if(!seen.size){toast('No shows to jump to','warn');return;}
  const list = [...seen.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  const rows = list.map(([show,it])=>`<button class="btn ghost" style="justify-content:flex-start;width:100%;margin-bottom:6px;text-align:left" data-off="${it.offsetMs}">${show}</button>`).join('');
  $('#modalTitle').textContent='Change what\u2019s on now';
  $('#modalBody').innerHTML = `<div style="max-height:50vh;overflow:auto">${rows}</div>`;
  $('#modalBg').classList.add('show');
  // wire buttons
  $('#modalBody').querySelectorAll('button[data-off]').forEach(b=>{
    b.onclick = async ()=>{
      $('#modalBg').classList.remove('show');
      try{ await shiftStartTimeTo(+b.dataset.off + 50); toast(`Now playing “${b.textContent}”.`,'ok'); renderMain(); }
      catch(e){ toast('Change failed: '+e.message,'err',6000); }
    };
  });
  // hide default ok/cancel for picker (use cancel only)
  $('#modalOk').style.display='none';
  $('#modalCancel').textContent='Close';
  $('#modalCancel').onclick=()=>{ $('#modalBg').classList.remove('show'); $('#modalOk').style.display=''; $('#modalCancel').textContent='Cancel'; };
}

/* ---------- UP NEXT (drag-to-reorder the upcoming lineup) ----------
 * Shows the channel's content loop in PLAY ORDER, rotated so the program on
 * now is first, with projected air times. Rows are draggable; Save POSTs the
 * reordered lineup as a manual lineup. To stay seamless, after saving we shift
 * startTime so the program that was on now keeps playing from the same point
 * (unless it was dragged — then the new first item starts now). */
let upNextDrag = null;
function renderUpNext(){
  const box = el('div');
  const ph = currentPlayhead();
  const {items} = lineupDurations();
  const content = items.filter(it=>it.type==='content');
  if(!content.length){
    box.append(el('div','empty','No programming yet. Add shows or apply a schedule, then come back to reorder.'));
    return box;
  }
  // rotate so the currently-playing item leads the list
  let startIdx = 0;
  if(ph){ const ci = content.findIndex(c=>c.idx===ph.cur.idx); if(ci>=0) startIdx=ci; }
  const order = content.slice(startIdx).concat(content.slice(0,startIdx));
  State.upNext = order.map(c=>({id:c.id, durationMs:c.durationMs, title:c.title, show:c.show}));
  State.upNextInto = ph ? ph.into : 0;
  State.upNextCurId = ph ? ph.cur.id : (order[0] && order[0].id);
  State.upNextDirty = false;

  const tb = el('div','toolbar');
  tb.append(el('div','info','Drag rows to reorder. The program on now keeps playing seamlessly.'));
  tb.append(el('div','spacer'));
  const resetBtn = el('button','btn ghost sm','Reset'); resetBtn.onclick=()=>{State.tab='upnext'; renderMain();};
  const saveBtn = el('button','btn primary','Save order'); saveBtn.id='upNextSave'; saveBtn.onclick=saveUpNext;
  tb.append(resetBtn, saveBtn);
  box.append(tb);

  const list = el('div'); list.id='upNextList';
  box.append(list);
  renderUpNextRows(list);
  return box;
}

function renderUpNextRows(list){
  list = list || $('#upNextList'); if(!list) return;
  list.innerHTML='';
  let acc = Date.now() - (State.upNextInto||0); // projected start of row 0
  State.upNext.forEach((it,i)=>{
    const when = new Date(acc); acc += it.durationMs;
    const row = el('div','upnext-row'+(i===0?' on-now':'')); row.draggable=true; row.dataset.i=i;
    const handle = el('div','grip','⋮⋮');
    const tw = el('div','un-main');
    const t = el('div','title', it.show && it.show!==it.title ? `${it.show} — ${it.title}` : it.title);
    const sub = el('div','sub', `${when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${fmtDur(it.durationMs)}${i===0?' · on now':''}`);
    tw.append(t, sub);
    row.append(handle, tw);
    row.ondragstart=e=>{ upNextDrag=i; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(i));}catch(_){} };
    row.ondragend=()=>{ row.classList.remove('dragging'); };
    row.ondragover=e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; row.classList.add('drop-target'); };
    row.ondragleave=()=>row.classList.remove('drop-target');
    row.ondrop=e=>{ e.preventDefault(); row.classList.remove('drop-target'); moveUpNext(upNextDrag, i); };
    list.append(row);
  });
}

function moveUpNext(from, to){
  if(from==null || from===to || from<0) return;
  const arr = State.upNext; if(to>=arr.length) to=arr.length-1;
  const [m] = arr.splice(from,1); arr.splice(to,0,m);
  State.upNextDirty = true;
  renderUpNextRows();
}

async function saveUpNext(){
  if(!State.upNext || !State.upNext.length){ toast('Nothing to save','warn'); return; }
  const lineup = State.upNext.map(it=>({type:'content', id:it.id, duration:it.durationMs}));
  const ok = await confirmModal('Save new order',
    `Save the reordered lineup for <b>${State.current.name}</b> — ${lineup.length} programs?`);
  if(!ok) return;
  try{
    toast('Saving order…','ok',1500);
    await snapshotLineup('reorder');
    State.programming = await api('POST',`/channels/${State.current.id}/programming`, {type:'manual', lineup, append:false});
    // keep the program that was on now playing from the same point: find its new offset
    const curId = State.upNextCurId, into = State.upNextInto||0;
    let off=0, found=false;
    for(const e of (State.programming.lineup||[])){
      if(e.id===curId){ found=true; break; }
      off += e.duration || 0;
    }
    await shiftStartTimeTo(found ? off + into + 30 : 30);
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    renderMain();
    toast('Lineup reordered.','ok');
  }catch(e){ toast('Reorder save failed: '+e.message,'err',6000); }
}

async function reshuffleNow(){
  const ok = await confirmModal('Reshuffle channel',
    `Wipe and regenerate <b>${State.current.name}</b> as a fresh shuffle, then start it from the top?<br><br>This keeps the same shows — only the order changes.`);
  if(!ok) return;
  try{
    // reload as a shuffled manual lineup
    const content = (State.programming.lineup||[]).filter(e=>e.type==='content').slice();
    for(let i=content.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [content[i],content[j]]=[content[j],content[i]]; }
    await snapshotLineup('reshuffle');
    State.programming = await api('POST',`/channels/${State.current.id}/programming`, {type:'manual', lineup:content, append:false});
    await shiftStartTimeTo(0); // start from the top
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    toast('Reshuffled and restarted from the top.','ok');
    renderMain();
  }catch(e){ toast('Reshuffle failed: '+e.message,'err',6000); }
}
