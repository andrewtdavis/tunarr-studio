    const t = el('div','subtab'+(kind===k?' active':''));
    t.append(document.createTextNode(label+' '), el('span','n',String(n)));
    t.onclick=()=>{ if(State.manageKind===k) return; State.shows.forEach(s=>s._sel=false); State.manageKind=k; renderMain(); };
    sub.append(t);
  });
  box.append(sub);

  // toolbar: search + rating filter + bulk
  const tb = el('div','toolbar'); tb.id='manageBar';
  const search = el('input','search-in'); search.placeholder= kind==='movie'?'Filter movies…':'Filter shows…'; search.type='text';
  search.oninput=()=>applyManageFilter(search.value);
  tb.append(search);

  // rating filter dropdown (from ratings present in this list)
  const ratings = [...new Set(State.shows.filter(s=>s.kind===kind).map(s=>s.rating).filter(Boolean))].sort();
  if(ratings.length){
    const sel = el('select','search-in');
    sel.append(new Option('All ratings',''));
    ratings.forEach(r=> sel.append(new Option(r, r)));
    sel.onchange=()=>applyManageFilter(search.value, sel.value);
    tb.append(sel);
  }
  const spacer = el('div','spacer'); tb.append(spacer);
  tb.append(el('span','hint-inline','Shift-click to select a range'));
  const selAll = el('button','btn ghost sm','Select all'); selAll.onclick=()=>toggleAll(true);
  const selNone = el('button','btn ghost sm','Unselect all'); selNone.onclick=()=>toggleAll(false);
  tb.append(selAll, selNone);
  box.append(tb);

  // list
  const list = el('div'); list.id='showList';
  box.append(list);
  // Populate against the element we hold: at this point `box` is not yet in the
  // document (renderMain appends it after we return), so $('#showList') would
  // miss and the list would stay empty until the first filter keystroke.
  renderShowRows('', '', list);

  // named collections (save/restore the whole lineup under a name)
  box.append(renderCollectionsPanel());

  // build options panel
  const opts = el('div','opts');
  const sv = State.savedOpts || {};

  const oMode = optBlock('Build as', sel=>{
    sel.id='applyMode';
    sel.append(new Option('Random schedule','random'));
    sel.append(new Option('Manual lineup','manual'));
    if(sv.mode) sel.value=sv.mode;
    sel.onchange=syncOptState;
  });
  const oOrder = optBlock('Episode order', sel=>{
    sel.id='orderMode';
    sel.append(new Option('Series order','chronological'));
    sel.append(new Option('Random','shuffle'));
    sel.append(new Option('Continue next','next'));
    sel.append(new Option('Shuffle seasons','ordered_shuffle'));
    if(sv.order) sel.value=sv.order;
  });
  const oBlock = optNumber('Episodes per block', 'blockSize', sv.blockSize||1, 1, 20,
    'How many episodes of a show play back-to-back before moving on.');
  const oDays = optNumber('Schedule days', 'daysIn', sv.days||2, 1, 14,
    'How far ahead to generate (random mode).');

  // normalize toggle
  const oNorm = el('div','opt toggle');
  const nchk = el('input'); nchk.type='checkbox'; nchk.id='normalize';
  nchk.checked = sv.normalize!=null ? !!sv.normalize : true;
  nchk.onchange=syncOptState;
  const nlab = el('div','lab');
  nlab.append(el('label',null,'Equal airtime'));
  nlab.append(el('div','hint','Give every show roughly the same airtime, ignoring how many episodes each has.'));
  oNorm.append(nchk, nlab);

  opts.append(oMode, oOrder, oBlock, oNorm, oDays);
  // Shows-vs-movies airtime split, only meaningful when the channel has both.
  if(nShows && nMovies){
    const pct = sv.moviePct!=null ? sv.moviePct : currentMoviePct();
    opts.append(airtimeSlider(pct));
  }
  box.append(opts);

  // action bar
  const bar = el('div','actionbar');
  const info = el('div','info'); info.id='selInfo';
  const sp = el('div','spacer');
  const restoreBtn = el('button','btn ghost','Restore previous lineup');
  restoreBtn.title='Undo the last apply/add/remove by restoring the saved snapshot';
  restoreBtn.onclick=restoreLineup;
  const removeBtn = el('button','btn danger','Remove selected'); removeBtn.onclick=removeSelected;
  const applyBtn = el('button','btn primary','Apply'); applyBtn.onclick=applyWeighting;
  bar.append(info, sp, restoreBtn, removeBtn, applyBtn);
  box.append(bar);
  // reflect whether a backup exists (label + enabled state)
  loadPrefs(State.current.id).then(p=>{
    const bak = p && p.lineupBackup;
    if(bak && bak.savedAt){
      restoreBtn.textContent = `Restore previous (${bak.totalPrograms} programs)`;
    } else {
      restoreBtn.disabled = true; restoreBtn.style.opacity='.5'; restoreBtn.title='No saved lineup yet';
    }
  });

  updateSelInfo();
  setTimeout(syncOptState,0);
  return box;
}

/* small builders for the options panel */
function optBlock(labelText, setup){
  const wrap = el('div','opt');
  wrap.append(el('label',null,labelText));
  const sel = el('select'); setup(sel); wrap.append(sel);
  return wrap;
}
function optNumber(labelText, id, val, min, max, hint){
  const wrap = el('div','opt');
  wrap.append(el('label',null,labelText));
  const inp = el('input'); inp.type='number'; inp.id=id; inp.value=val; inp.min=min; inp.max=max;
  inp.style.width='90px';
  wrap.append(inp);
  if(hint) wrap.append(el('div','hint',hint));
  return wrap;
}
/* enable/disable options that don't apply to the chosen mode */
function syncOptState(){
  const mode = ($('#applyMode')||{}).value;
  const days = $('#daysIn');
  if(days) days.closest('.opt').style.opacity = mode==='random'?'1':'.4';
  if(days) days.disabled = mode!=='random';
}

// Rows of the current Manage list (shows or movies) passing the filters.
function visibleManageRows(filterText='', filterRating=''){
  const ft = filterText.trim().toLowerCase();
  return State.shows.filter(s=> s.kind===State.manageKind
    && (!ft || s.title.toLowerCase().includes(ft))
    && (!filterRating || s.rating===filterRating));
}
function manageFilterValues(){
  return [($('#manageBar input')||{}).value||'', ($('#manageBar select')||{}).value||''];
}
function renderShowRows(filterText='', filterRating='', listEl=null){
  const list = listEl || $('#showList'); if(!list) return;
  list.innerHTML='';
  const isMovie = State.manageKind==='movie';
  const rows=[];
  visibleManageRows(filterText, filterRating).forEach(s=>{
    const row = el('div','show'+(isMovie?' movie':''));
    const chk = el('input'); chk.type='checkbox'; chk.className='chk'; chk.checked=!!s._sel;
    rows.push({chk, item:s});
    const titleWrap = el('div');
    const t = el('div','title'); t.textContent=s.title;
    if(s.rating){ const rt=el('span','rating-tag', s.rating); t.append(rt); }
    const sub = el('div','sub', isMovie
       ? [s.year, fmtDur(s.dur/Math.max(1,s.count))].filter(Boolean).join(' · ')
       : s.showId.startsWith('title::')
         ? 'no show-id metadata — kept in manual lineups, left out of random schedules'
         : s.showId.slice(0,18)+'…');
    titleWrap.append(t, sub);

    // fader (shows only: random-schedule movie picks come from one shared slot)
    const fader = el('div','fader');
    if(!isMovie){
      const rng = el('input'); rng.type='range'; rng.min='0'; rng.max='10'; rng.step='1'; rng.value=s.weight;
      const wv = el('span','wval', s.weight+'×');
      rng.oninput=()=>{ s.weight=+rng.value; wv.textContent=s.weight+'×'; };
      fader.append(rng, wv);
    }

    const ep = el('div','epcount', isMovie ? (s.count>1?`${s.count}× in lineup`:'') : s.count+' ep');
    const rm = el('button','btn danger sm','Remove');
    rm.onclick=()=>removeShows([s]);

    row.append(chk, titleWrap, fader, ep, rm);
    list.append(row);
  });
  wireRangeSelect(rows, updateSelInfo);
  if(!rows.length){
    list.append(el('div','empty', isMovie?'No movies match this filter.':'No shows match this filter.'));
  }
}

function applyManageFilter(text, rating){
  const [t,r]=manageFilterValues();
  renderShowRows(text!==undefined?text:t, rating!==undefined?rating:r);
}

// Select/unselect only what's visible in the current list (respects filters).
function toggleAll(v){
  const [t,r]=manageFilterValues();
  visibleManageRows(t,r).forEach(s=>s._sel=v);
  renderShowRows(t,r); updateSelInfo();
}

function updateSelInfo(){
  const isMovie = State.manageKind==='movie';
  const all = State.shows.filter(s=>s.kind===State.manageKind);
  const sel = all.filter(s=>s._sel);
  const eps = sel.reduce((a,s)=>a+s.count,0);
  const info = $('#selInfo');
  if(info) info.textContent = sel.length
    ? (isMovie ? `${sel.length} movie${sel.length>1?'s':''} selected` : `${sel.length} selected · ${eps} episodes`)
    : (isMovie ? `${all.length} movies` : `${all.length} shows · drag faders to set play frequency`);
}

/* ---------- remove ---------- */
async function removeSelected(){
  const sel = State.shows.filter(s=>s._sel);
  if(!sel.length){toast('Select something to remove first','warn');return;}
  removeShows(sel);
}

async function removeShows(shows){
  const eps = shows.reduce((a,s)=>a+s.count,0);
  const nm = shows.filter(s=>s.kind==='movie').length, ns = shows.length-nm;
  const what = [ns?`${ns} show(s) — ${shows.filter(s=>s.kind!=='movie').reduce((a,s)=>a+s.count,0)} episodes`:'', nm?`${nm} movie(s)`:''].filter(Boolean).join(' and ');
  const names = shows.map(s=>`<code class="k">${escHtml(s.title)}</code>`).join(' ');
  const ok = await confirmModal(nm&&!ns?'Remove movies':'Remove shows',
    `Remove ${what} from <b>${escHtml(State.current.name)}</b>?<br><br>${names}`);
  if(!ok) return;
  try{
    toast('Saving…','ok',1200);
    await doRemoveShows(shows);
    renderMain();
    toast(`Removed ${what}. Guide will refresh.`,'ok');
  }catch(e){ toast('Remove failed: '+e.message,'err',6000); }
}
// Core removal (no confirm, no render) shared by Manage and the Add tab.
async function doRemoveShows(shows){
  const removeIds = new Set(shows.flatMap(s=>s.ids));
  const newLineup = (State.programming.lineup||[]).filter(e=>
    e.type!=='content' || !removeIds.has(e.id));
  await snapshotLineup('remove');
  State.programming = await api('POST',`/channels/${State.current.id}/programming`,
    {type:'manual', lineup:newLineup, append:false});
  State.shows = await groupShows(State.programming);
  State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
}
// Which grouped channel show(s) a search result corresponds to (for add-state
// + inline remove). Shows match by show id; movies match by their program id.
function findChannelGroupsForResult(it){
  const id = itemId(it);
  if(itemType(it)==='movie') return State.shows.filter(g=> (g.ids||[]).includes(id));
  return State.shows.filter(g=> g.showId===id);
}
async function removeResultFromChannel(it){
  const groups = findChannelGroupsForResult(it);
  if(!groups.length){ toast('Not on this channel','warn'); return; }
  try{
    toast('Removing…','ok',1200);
    await doRemoveShows(groups);
    renderAddResults(State.addTotalHits||State.addResults.length);
    toast(`Removed “${itemTitle(it)}” from ${State.current.name}. Undo via Manage → Restore previous.`,'ok');
  }catch(e){ toast('Remove failed: '+e.message,'err',6000); }
}

/* ---------- weighting ---------- */
async function applyWeighting(){
  const mode = $('#applyMode').value;
  const days = Math.max(1, Math.min(14, +($('#daysIn')||{}).value||2));
  const order = ($('#orderMode')||{}).value || 'shuffle';
  const blockSize = Math.max(1, Math.min(20, +($('#blockSize')||{}).value||1));
  const normalize = !!($('#normalize')||{}).checked;

  // Shows without a show id can't get a random-schedule slot; manual lineups keep them.
  const allShows = showGroups();
  const usable = mode==='random' ? allShows.filter(s=>!s.showId.startsWith('title::')) : allShows;
  const fallback = allShows.length - usable.length;
  const movies = movieGroups();
  const moviePct = movies.length && allShows.length ? Math.max(0,Math.min(100, +(($('#moviePct')||{}).value ?? currentMoviePct())))
    : (movies.length ? 100 : 0);
  const lineupById = new Map((State.programming.lineup||[]).filter(e=>e.type==='content').map(e=>[e.id,e]));
  const programIds = [...lineupById.keys()];

  // Order a show's episode ids according to the chosen ordering. The lineup is
  // already stored in the channel's existing order (usually series order from
  // when shows were added), so 'chronological'/'next' preserve it; 'shuffle'
  // randomizes; 'ordered_shuffle' is handled server-side in random mode.
  function orderEpisodes(ids){
    if(order==='shuffle' || order==='ordered_shuffle'){
      const a = ids.slice();
      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
      return a;
    }
    return ids.slice(); // chronological / next => keep stored order
  }

  let body, achievedPct = moviePct;
  if(mode==='random'){
    // Native Tunarr random schedule. programCount = block size; order maps
    // directly; weight balances selection. Normalize => equal weight per show.
    const slots = moviePct>=100 ? [] : usable.filter(s=>s.weight>0).map(s=>({
      id: uuid(),
      type:'show', showId:s.showId, seasonFilter:[], seasonExcludeFilter:[],
      order, direction:'asc',
      weight: normalize ? 1 : s.weight,
      cooldownMs:0,
      durationSpec:{type:'dynamic', programCount: blockSize},
    }));
    // Movies: one Tunarr 'movie' slot drawing from every movie in the pool.
    // Slot weights pick *slots*, not airtime, so scale by average durations:
    // a pick of the movie slot plays one movie; a show pick plays a block.
    if(movies.length && moviePct>0){
      const avg = (gs)=>{ const n=gs.reduce((a,g)=>a+g.count,0); return n ? gs.reduce((a,g)=>a+g.dur,0)/n : 0; };
      const avgMovie = avg(movies) || 1, avgBlock = (avg(usable)||avgMovie)*blockSize;
      const showW = slots.reduce((a,s)=>a+s.weight,0);
      const w = slots.length ? (moviePct/(100-moviePct)) * showW * avgBlock / avgMovie : 1;
      slots.push({ id: uuid(), type:'movie', order:'shuffle', direction:'asc',
        weight: Math.max(0.01, +w.toFixed(3)), cooldownMs:0,
        durationSpec:{type:'dynamic', programCount:1} });
    }
    if(!slots.length){toast('All weights are 0 — nothing to schedule','warn');return;}
    // padStyle MUST be 'slot' (not 'episode'): with 'episode' the scheduler
    // emits only ~programCount programs total and ignores maxDays, producing a
    // 1-item lineup that WIPES the channel. 'slot' fills the full maxDays window
    // (verified vs Tunarr 1.3.6: maxDays 1/2/7 -> 41/62/181 programs).
    body = {type:'random', programs:programIds, schedule:{
      type:'random', flexPreference:'distribute', maxDays:days, padMs:0, padStyle:'slot',
      // 'uniform' ignores weights, so a movie slot needs 'weighted' to get its share.
      slots, randomDistribution: normalize && !slots.some(s=>s.type==='movie') ? 'uniform' : 'weighted', lockWeights:false,
    }};
  } else {
    // Manual lineup we assemble ourselves.
    //  - normalize: cap every show to the same number of episode *visits* so
    //    airtime is balanced regardless of library size.
    //  - blockSize: take that many consecutive episodes per visit.
    //  - weight: a show with weight w gets w times as many visits.
    const pools = moviePct>=100 ? [] : usable.filter(s=>s.weight>0).map(s=>({
      show:s, w:s.weight, q:orderEpisodes(s.ids), pos:0,
    }));
    if(!pools.length && !(movies.length && moviePct>0)){toast('All weights are 0 — nothing to schedule','warn');return;}

    // visits per unit weight: with normalize, base it on the smallest library so
    // every show can supply that many blocks without over-looping. Without
    // normalize, let longer shows contribute more (proportional to their length).
    const blocksAvail = pools.map(p=>Math.max(1, Math.ceil(p.q.length/blockSize)));
    const baseVisits = normalize && pools.length ? Math.max(1, Math.min(...blocksAvail)) : null;

    // build a weighted round-robin of *visits*
    const visitQuota = pools.map((p,i)=>{
      const units = normalize ? baseVisits : blocksAvail[i];
      return units * p.w;
    });
    const remaining = visitQuota.slice();
    const acc = pools.map(()=>0);
    const totalW = pools.reduce((a,p)=>a+p.w,0);
    const out=[];
    let guard = (visitQuota.reduce((a,b)=>a+b,0))*2 + 10;
    while(remaining.some(r=>r>0) && guard-->0){
      let best=-1,bestVal=-Infinity;
      pools.forEach((p,i)=>{ if(remaining[i]<=0) return; acc[i]+=p.w; if(acc[i]>bestVal){bestVal=acc[i];best=i;} });
      if(best<0) break;
      acc[best]-=totalW; remaining[best]--;
      const p=pools[best];
      // emit a block of up to blockSize consecutive episodes, looping the
      // show's queue if needed
      for(let k=0;k<blockSize;k++){
        if(p.pos>=p.q.length){ if(normalize) break; p.pos=0; p.q=orderEpisodes(p.show.ids); }
        const e=lineupById.get(p.q[p.pos++]); if(e) out.push(e);
      }
    }
    // movies (each as it appears in the lineup) mixed in by airtime share
    const movieEntries = moviePct>0 ? movies.flatMap(g=>g.ids.map(id=>lineupById.get(id)).filter(Boolean)) : [];
    const mixed = mixByAirtime(out, movieEntries, moviePct);
    achievedPct = mixed.pct;
    if(!mixed.lineup.length){toast('Nothing to schedule with these options','warn');return;}
    body = {type:'manual', lineup:mixed.lineup, append:false};
  }

  // confirmation summary
  const bits = [];
  bits.push(mode==='random'?`random schedule (${days} day${days>1?'s':''})`:'manual lineup');
  bits.push(`order: ${({chronological:'series',shuffle:'random',next:'continue next',ordered_shuffle:'shuffle seasons'})[order]||order}`);
  if(blockSize>1) bits.push(`${blockSize}-episode blocks`);
  bits.push(normalize?'equal airtime per show':'weighted by fader');
  if(movies.length && allShows.length) bits.push(`movies ~${achievedPct}% of airtime`);
  const notes = [];
  if(fallback) notes.push(`${fallback} show(s) lack show-id metadata and can't get a random-schedule slot, so they'll drop out of the lineup.`);
  if(mode==='manual' && movies.length && allShows.length && Math.abs(achievedPct-moviePct)>=5)
    notes.push(`Asked for ${moviePct}% movies; the closest without dropping anything (repeating the shorter side up to 4×) is ${achievedPct}%.`);
  if(movies.length && allShows.length && moviePct===0)
    notes.push(`Movies at 0%: the channel's ${movies.length} movie(s) will drop out of the lineup (Restore previous brings them back).`);
  if(movies.length && allShows.length && moviePct===100)
    notes.push(`Movies at 100%: the channel's ${allShows.length} show(s) will drop out of the lineup (Restore previous brings them back).`);
  const note = notes.map(n=>`<br><br><span style="color:var(--amber)">${n}</span>`).join('');
  const ok = await confirmModal('Rebuild programming',
    `Rebuild <b>${State.current.name}</b> as a ${bits.join(' · ')}?${note}`);
  if(!ok) return;
  try{
    toast('Building schedule…','ok',1500);
    await snapshotLineup('apply');
    State.programming = await api('POST',`/channels/${State.current.id}/programming`, body);
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    // persist prefs + the exact schedule body so the backend can re-feed the
    // guide on a timer and restore the fader/options on next load.
    await savePrefs({
      name: State.current.name,
      mode, order, blockSize, normalize, days, moviePct,
      weights: Object.fromEntries(showGroups().map(s=>[s.showId, s.weight])),
      // only random schedules can be auto-replayed to keep the guide fed
      scheduleBody: mode==='random' ? body : null,
    });
    renderMain();
    toast(mode==='random' ? 'Programming rebuilt. Guide will stay fed automatically.' : 'Programming rebuilt.','ok');
  }catch(e){ toast('Apply failed: '+e.message,'err',6000); }
}

/* ---- studio prefs persistence (backend JSON store; falls back to localStorage) ---- */
async function savePrefs(patch, id = State.current && State.current.id){
  try{
    await fetch(`/studio-api/prefs/${encodeURIComponent(id)}`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch),
    });
  }catch(e){
    try{ localStorage.setItem('tunarrStudioPrefs:'+id, JSON.stringify(patch)); }catch(_){}
  }
}
async function loadPrefs(id){
  try{
    const r = await fetch('/studio-api/prefs');
    if(r.ok){ const all = await r.json(); return (all.channels&&all.channels[id])||null; }
  }catch(e){}
  try{ const v=localStorage.getItem('tunarrStudioPrefs:'+id); return v?JSON.parse(v):null; }catch(_){ return null; }
}

/* ---------- lineup backup / restore safety net ----------
 * Every lineup-mutating action (apply / add / remove / reshuffle) calls
 * snapshotLineup() FIRST, persisting the pre-change content lineup to prefs.
 * If a change goes wrong (e.g. a bad apply that wipes the channel), the user
 * can hit "Restore previous lineup" to POST the saved snapshot back. The
 * snapshot is normalized to {type,id,duration} so it re-POSTs as a valid
 * manual lineup. We never snapshot an empty lineup, so a wiped channel can't
 * clobber a good backup. */
async function snapshotLineup(reason){
  if(!State.current || !State.programming) return;
  const lineup = (State.programming.lineup||[]).map(e=>
    e.type==='content' ? {type:'content', id:e.id, duration:e.duration} : e
  ).filter(e=> e.type!=='content' || (e.id && e.duration!=null));
  const content = lineup.filter(e=>e.type==='content');
  if(!content.length) return; // refuse to overwrite a backup with nothing
  await savePrefs({ lineupBackup: {
    savedAt: Date.now(), reason,
    lineup, totalPrograms: content.length,
    summary: State.shows.map(s=>({title:s.title, count:s.count})),
  }});
}
async function restoreLineup(){
  const saved = await loadPrefs(State.current.id);
  const bak = saved && saved.lineupBackup;
  if(!bak || !bak.lineup || !bak.lineup.length){ toast('No saved lineup to restore yet','warn'); return; }
  const when = new Date(bak.savedAt).toLocaleString();
  const shows = (bak.summary||[]).map(s=>`<code class="k">${s.title}</code>`).join(' ') || '(content)';
  const ok = await confirmModal('Restore previous lineup',
    `Restore the lineup saved <b>${when}</b> — ${bak.totalPrograms} programs?<br><br>${shows}<br><br>This replaces the current programming.`);
  if(!ok) return;
  try{
    toast('Restoring…','ok',1500);
    State.programming = await api('POST',`/channels/${State.current.id}/programming`,
      {type:'manual', lineup:bak.lineup, append:false});
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    renderMain();
    toast(`Restored ${bak.totalPrograms} programs.`,'ok');
  }catch(e){ toast('Restore failed: '+e.message,'err',6000); }
}

/* ---------- named collections ----------
 * Save the current channel lineup under an arbitrary name so you can swap the
 * channel to something else and bring it back later. Stored per-channel in
 * prefs under `collections` (name -> {savedAt, lineup, totalPrograms, summary}).
 * Distinct from the auto-snapshot undo above: these are deliberate, named. */
async function saveCollection(){
  if(!State.current || !State.programming) return;
  const content=(State.programming.lineup||[]).filter(e=>e.type==='content');
  if(!content.length){ toast('Nothing to save — the channel is empty','warn'); return; }
  const name=await promptModal('Save collection',
    'Name this collection (its full lineup is saved):','e.g. Barney favorites');
  if(!name) return;
  const prefs=await loadPrefs(State.current.id)||{};
  const collections={...(prefs.collections||{})};
  const existed=!!collections[name];

/* ---------- add channel (themed suggestions) ----------
 * Analyze the Plex library (genre counts via the search index), suggest themed
 * channels, then create + auto-populate one. Movies come straight from search
 * (they carry duration); shows are expanded to episodes via /descendants. */
function genreFilter(genres, type){
  const v=(k,val)=>({type:'value',fieldSpec:{key:k,name:k,type:'faceted_string',op:'=',value:[val]}});
  const nodes=[v('type',type), ...genres.map(g=>v('genres.name',g))];
  return nodes.length===1 ? nodes[0] : {type:'op',op:'and',children:nodes};
}
// With no text query, Tunarr (1.3.6) pages as offset = page*limit (0-based).
// Sortable fields: title, sortTitle, duration, originalReleaseDate,
// originalReleaseYear, addedAt, index. There is no review score in Tunarr.
function searchGenre(genres,type,limit,page=0,sort=[{field:'sortTitle',direction:'asc'}]){
  return api('POST','/programs/search',{query:{query:null,filter:genreFilter(genres,type),sort},limit,page});
}
async function countTheme(t){
  let shows=0,movies=0;
  if(t.types.includes('show')){ try{shows=(await searchGenre(t.genres,'show',1)).totalHits||0;}catch(e){} }
  if(t.types.includes('movie')){ try{movies=(await searchGenre(t.genres,'movie',1)).totalHits||0;}catch(e){} }
  return {shows,movies,total:shows+movies};
}

/* ----- example titles for the Add-channel suggestions ----- */
const EXAMPLE_N=5;
const EXAMPLE_MODES=[['top','Top rated'],['random','Random'],['recent','Recently added'],['newest','Newest']];
// Pick n distinct random positions and fetch each as a 1-item page.
async function randomExamples(genres,type,total,n){
  const idx=new Set(); while(idx.size<Math.min(n,total)) idx.add(Math.floor(Math.random()*total));
  const rs=await Promise.all([...idx].map(i=>searchGenre(genres,type,1,i).catch(()=>null)));
  return rs.flatMap(r=>(r&&r.results)||[]);
}
async function sortedExamples(genres,type,n,field){
  const r=await searchGenre(genres,type,n,0,[{field,direction:'desc'}]);
  return (r&&r.results)||[];
}
// "Top rated" asks Plex itself: Tunarr's GET /plex/:sourceId/search forwards
// `searchParam` to Plex's /library/sections/:key/all, so Plex can sort by
// audienceRating. Plex returns the order only — Tunarr drops the score.
// Plex filters genres by tag id, looked up once per library.
const plexGenreCache=new Map();
function plexGenreIds(msId,libKey){
  const k=msId+':'+libKey;
  if(!plexGenreCache.has(k)) plexGenreCache.set(k,
    api('GET',`/plex/${msId}/tags?libraryKey=${encodeURIComponent(libKey)}&itemKey=genre`).then(r=>{
      const m=new Map();
      ((r&&r.Directory)||[]).forEach(d=>{ const f=/[?&]genre=([^&]+)/.exec(d.fastKey||'');
        m.set(String(d.title).toLowerCase(), f?decodeURIComponent(f[1]):d.key); });
      return m;
    }).catch(()=>{ plexGenreCache.delete(k); return null; }));
  return plexGenreCache.get(k);
}
function plexLibraries(type){
  const mt=type==='show'?'shows':'movies';
  return State.mediaSources.filter(s=>String(s.type||'').toLowerCase()==='plex')
    .flatMap(s=>(s.libraries||[]).filter(l=>l.mediaType===mt&&l.enabled!==false&&l.externalKey)
      .map(l=>({msId:s.id||s.uuid,key:l.externalKey})));
}
// Returns null when Plex can't answer (no Plex library, or every request failed).
async function topRatedExamples(genres,type,n){
  const libs=plexLibraries(type); if(!libs.length) return null;
  const want=genres.map(g=>g.toLowerCase());
  let anyOk=false;
  const perLib=await Promise.all(libs.map(async l=>{
    const ids=await plexGenreIds(l.msId,l.key); if(!ids) return [];
    const gid=ids.get(want[0]); anyOk=true; if(gid==null) return [];
    const sp=`genre=${gid}&sort=audienceRating:desc`;
    // Plex is filtered by the first genre; any others are AND-ed here, so over-fetch.
    const r=await api('GET',`/plex/${l.msId}/search?key=${encodeURIComponent(l.key)}`+
      `&searchParam=${encodeURIComponent(sp)}&offset=0&limit=${want.length>1?60:n}`).catch(()=>null);
    if(!r){ return []; }
    const gname=x=>String(x&&(x.name||x.tag)||x).toLowerCase();
    return (r.result||[]).filter(it=>want.slice(1).every(g=>(it.genres||[]).some(x=>gname(x)===g)));
  }));
  if(!anyOk) return null;
  const out=[];  // interleave libraries; Plex gives us rank, not a comparable score
  for(let i=0;out.length<n&&perLib.some(a=>i<a.length);i++) perLib.forEach(a=>{ if(a[i]&&out.length<n) out.push(a[i]); });
  return out;
}
// -> {items, note}; note says when we fell back from the requested mode
async function themeExamples(t,type,mode){
  const total=type==='show'?t.shows:t.movies; if(!total) return {items:[]};
  if(mode==='top'){
    const r=await topRatedExamples(t.genres,type,EXAMPLE_N).catch(()=>null);
    if(r&&r.length) return {items:r};
    return {items:await randomExamples(t.genres,type,total,EXAMPLE_N), note:'random'};
  }
  if(mode==='recent') return {items:await sortedExamples(t.genres,type,EXAMPLE_N,'addedAt')};
  if(mode==='newest') return {items:await sortedExamples(t.genres,type,EXAMPLE_N,'originalReleaseYear')};
  const items=await randomExamples(t.genres,type,total,EXAMPLE_N);
  return {items:items.sort((a,b)=>itemTitle(a).localeCompare(itemTitle(b)))};
}
function escHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Every title of one type in a theme, paged (Tunarr: offset = page*limit).
async function fetchAllGenre(genres,type){
  const out=[], L=250;
  for(let page=0; page<40; page++){
    const r=await searchGenre(genres,type,L,page);
    const items=(r&&r.results)||[]; out.push(...items);
    if(items.length<L || out.length>=((r&&r.totalHits)||0)) break;
  }
  return out.filter(it=>itemId(it));
}

async function buildNewChannel(name, shows, movies, moviePct, {genres=[], logo=null}={}){
  const tmpl=State.channels[0]||{};
  $('#modalTitle').textContent='Creating channel';
  $('#modalOk').style.display='none'; $('#modalCancel').textContent='Cancel'; $('#modalCancel').onclick=()=>closeModal();
  const prog=msg=>{ const b=$('#modalBody'); if(b) b.innerHTML=`<div class="empty"><span class="spin"></span> ${msg}</div>`; };
  try{
    // every episode of each selected show, in the order Tunarr returns them
    const epLists=new Array(shows.length); let done=0;
    prog(`Collecting episodes… (0/${shows.length} shows)`);
    const queue=shows.map((s,i)=>[s,i]);
    await Promise.all(Array.from({length:Math.min(4,queue.length)}, async ()=>{
      while(queue.length){
        const [s,i]=queue.shift();
        const desc=await api('GET',`/programs/${itemId(s)}/descendants`).catch(()=>null);
        epLists[i]=(Array.isArray(desc)?desc:[]).map(d=>({type:'content',id:d.id||d.uuid,duration:d.duration})).filter(c=>c.id&&c.duration);
        prog(`Collecting episodes… (${++done}/${shows.length} shows)`);
      }
    }));
    const movieEntries=movies.map(m=>({type:'content',id:itemId(m),duration:m.duration}));
    const {lineup:content}=mixByAirtime(roundRobin(epLists), movieEntries, moviePct);
    if(!content.length){ toast('No playable content found in that selection','warn'); closeModal(); return; }
    prog(`Creating channel + ${content.length} programs…`);
    const number=Math.max(0,...State.channels.map(c=>c.number||0))+1;
    const chan={ id:uuid(), name, number, duration:0, startTime:Date.now(),
      disableFillerOverlay:true, groupTitle:'tunarr', guideMinimumDuration:30000, fillerRepeatCooldown:30000,
      icon:{path:'',width:0,duration:0,position:'bottom-right',useDefaultIconFallback:true},
      offline:{picture:'',soundtrack:'',mode:'pic'}, stealth:false, streamMode:tmpl.streamMode||'hls',
      transcodeConfigId:tmpl.transcodeConfigId, subtitlesEnabled:false };
    const created=await api('POST','/channels',{type:'new',channel:chan});
    State.channels=await api('GET','/channels');
    // Tunarr assigns its own id; match by the response id if present, else by number
    const nc=(created&&created.id&&State.channels.find(c=>c.id===created.id))||State.channels.find(c=>c.number===number);
    if(!nc) throw new Error('channel created but could not be located');
    await api('POST',`/channels/${nc.id}/programming`,{type:'manual',lineup:content,append:false});
    // remember the airtime split (so Manage → Apply starts from it) and the
    // genres (so the logo editor keeps picking a matching style)
    await savePrefs({name, genres, ...(shows.length && movies.length ? {moviePct} : {})}, nc.id).catch(()=>{});
    let logoNote='';
    if(logo){
      prog('Uploading logo…');
      try{ await setChannelLogo(nc, logo); }
      catch(e){ logoNote=` Logo upload failed (${e.message}); you can retry from Channel options.`; }
    }
    closeModal(); renderChannels();
    toast(`Created “${name}” (#${number}) with ${content.length} programs.${logoNote}`, logoNote?'warn':'ok', logoNote?7000:3200);
    selectChannel(State.channels.find(c=>c.id===nc.id)||nc);
  }catch(e){ toast('Create failed: '+e.message,'err',6000); closeModal(); }
}

  };
  let seq=0;

    }));

  if(ok.length) showMode(State.exampleMode);
}

    `<label class="lab2" style="margin-top:8px">Include</label><select id="ccType" class="search-in" style="width:100%">`+
      `<option value="show,movie">Shows + Movies</option><option value="show">Shows only</option><option value="movie">Movies only</option></select>`+
    `<div style="margin-top:12px;text-align:right"><button class="btn primary" id="ccCreate">Next: pick titles</button></div>`;
  $('#ccCreate').onclick=()=>{
    const name=$('#ccName').value.trim();
    if(!name){ toast('Enter a name','warn'); return; }
    createThemedChannel({name, genres:[$('#ccGenre').value], types:$('#ccType').value.split(',')});
  };
}

/* ---------- ADD tab (query Plex through Tunarr) ---------- */
async function loadMediaSources(){
  try{
    State.mediaSources = await api('GET','/media-sources') || [];
  }catch(e){ State.mediaSources=[]; }
}

async function ensureAddTab(){
  if(!State.mediaSources.length){ await loadMediaSources(); }
  // discover the rating facet values for the first source/library lazily
}

function renderAdd(){
  const box = el('div');
  const tb = el('div','toolbar');

  // source picker
  const srcSel = el('select','search-in'); srcSel.id='srcSel';
  if(!State.mediaSources.length){ srcSel.append(new Option('No media sources found','')); }
  State.mediaSources.forEach(s=> srcSel.append(new Option(`${s.name} (${s.type})`, s.id||s.uuid)));
  srcSel.onchange=async ()=>{ State.filterRatings.clear(); await loadLibraries(srcSel.value); await loadRatingFacet(); runSearch(); };
  tb.append(srcSel);

  const libSel = el('select','search-in'); libSel.id='libSel';
  libSel.append(new Option('All libraries',''));
  libSel.onchange=async ()=>{ State.filterRatings.clear(); await loadRatingFacet(); runSearch(); };
  tb.append(libSel);

  // content type: shows or movies
  const typeSel = el('select','search-in'); typeSel.id='typeSel';
  typeSel.append(new Option('Shows','show'));
  typeSel.append(new Option('Movies','movie'));
  typeSel.value = State.addType;
  typeSel.onchange=async ()=>{
    State.addType = typeSel.value;
    // studio etc. that don't apply to the new type fall back to Title
    rebuildMetaFieldOptions();
    State.filterRatings.clear();
    await loadRatingFacet(); runSearch();
  };
  tb.append(typeSel);

  // "search by" metadata field
  const fieldSel = el('select','search-in'); fieldSel.id='metaField';
  fieldSel.onchange=()=>{ State.metaField = fieldSel.value; updateQueryPlaceholder(); runSearch(); };
  tb.append(fieldSel);

  const q = el('input','search-in'); q.id='addQuery'; q.type='text';
  q.style.minWidth='220px';
  q.onkeydown=e=>{ if(e.key==='Enter') runSearch(); };
  tb.append(q);
  const go = el('button','btn primary','Search'); go.onclick=runSearch; tb.append(go);
  box.append(tb);
  rebuildMetaFieldOptions();
  updateQueryPlaceholder();

  // rating filter chips (populated from facets)
  const chips = el('div','facet-chips'); chips.id='ratingChips';
  chips.append(el('span','info','Filter by rating:'));
  box.append(chips);

  const dbg = el('div','info'); dbg.id='addDebug'; dbg.style.marginBottom='8px'; box.append(dbg);

  const results = el('div'); results.id='addResults';
  results.append(el('div','empty'));
  box.append(results);

  // add action bar
  const bar = el('div','actionbar');
  const info = el('div','info'); info.id='addInfo'; info.textContent='Nothing selected';
  const sp = el('div','spacer');
  const addBtn = el('button','btn primary','Add selected to channel'); addBtn.onclick=addSelectedToChannel;
  bar.append(info, sp, addBtn);
  box.append(bar);

  // init: load libraries + ratings, then show all shows immediately
  if(State.mediaSources.length){
    const sid = State.mediaSources[0].id || State.mediaSources[0].uuid;
    srcSel.value = sid;
    (async()=>{ await loadLibraries(sid); await loadRatingFacet(); runSearch(); })();
  } else {
    results.querySelector('.empty').textContent='No Plex media sources found in Tunarr.';
  }
  return box;
}

// Populate the "search by" dropdown with the fields valid for the current type.
function rebuildMetaFieldOptions(){
  const sel = $('#metaField'); if(!sel) return;
  const fields = META_FIELDS.filter(f=> !f.movieOnly || State.addType==='movie');
  if(!fields.some(f=>f.key===State.metaField)) State.metaField=''; // reset if now-invalid
  sel.innerHTML='';
  fields.forEach(f=> sel.append(new Option('By '+f.label, f.key)));
  sel.value = State.metaField;
}
function updateQueryPlaceholder(){
  const q = $('#addQuery'); if(!q) return;
  const noun = State.addType==='movie' ? 'movies' : 'shows';
  const f = META_FIELDS.find(x=>x.key===State.metaField);
  q.placeholder = (!f || f.q)
    ? `Search ${noun} by title…`
    : `Exact ${f.label.toLowerCase()} (e.g. ${({'genres.name':'Comedy','actors.name':'Tom Hanks','director.name':'Brad Bird','studio.name':'Walt Disney Pictures','originalReleaseYear':'1994','tags':'kids'})[f.key]||'value'})`;
}

async function loadLibraries(srcId){
  const libSel = $('#libSel'); if(!libSel) return;
  libSel.innerHTML=''; libSel.append(new Option('All libraries',''));
  if(!srcId) return;
  try{
    const libs = await api('GET',`/media-sources/${srcId}/libraries`) || [];
    State.libraries = libs;
    libs.forEach(l=>{
      const id = l.id || l.uuid || l.libraryId || l.externalKey;
      const name = l.name || l.title || id;
      const mt = l.mediaType ? ` · ${l.mediaType}` : '';
      libSel.append(new Option(name+mt, id));
    });
    const dbg = $('#addDebug');
    if(dbg) dbg.textContent = libs.length
      ? `${libs.length} libraries`
      : 'libraries endpoint returned empty';
  }catch(e){
    const dbg = $('#addDebug'); if(dbg) dbg.textContent = 'libraries error: '+e.message;
    console.error('loadLibraries', e);
  }
}

async function loadRatingFacet(){
  // The server only facets on 'type', so we can't get rating counts from the
  // search response. Instead we run one unfiltered show search and tally the
  // 'rating' field across the returned shows to build the filter chips.
  const chips = $('#ratingChips'); if(!chips) return;
  const srcId = $('#srcSel') ? $('#srcSel').value : '';
  const libId = $('#libSel') ? $('#libSel').value : '';
  try{
    const res = await api('POST','/programs/search', {
      query:{ query:null,
        filter:valueNode('type','=',[State.addType]),
        sort:[{field:'sortTitle',direction:'asc'}] },
      mediaSourceId: srcId||undefined,
      libraryId: libId||undefined,
      limit: 500, page:0,
    });
    const items = ((res&&res.results)||[]).filter(it=>(it.type||'')===State.addType);
    const counts = {};
    items.forEach(it=>{ const r=it.rating||it.contentRating; if(r) counts[r]=(counts[r]||0)+1; });
    if(Object.keys(counts).length){
      State.ratingFacet='rating'; State.ratingValues=counts;
      chips.style.display=''; renderRatingChips(); return;
    }
  }catch(e){ console.error('loadRatingFacet', e); }
  chips.style.display='none';
}

function renderRatingChips(){
  const chips = $('#ratingChips'); if(!chips) return;
  chips.innerHTML=''; chips.append(el('span','info','Filter by rating:'));
  Object.entries(State.ratingValues).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([val,count])=>{
    const c = el('div','chip'+(State.filterRatings.has(val)?' on':''), `${val} · ${count}`);
    c.onclick=()=>{ if(State.filterRatings.has(val)) State.filterRatings.delete(val); else State.filterRatings.add(val);
      c.classList.toggle('on'); runSearch(); };
    chips.append(c);
  });
}

function valueNode(key, op, value){
  return { type:'value', fieldSpec:{ key, name:key, type:'faceted_string', op, value } };
}
function buildFilterTree(){
  // AND of: type = show|movie, optional rating IN [...], and an optional exact
  // metadata filter (genre/actor/studio/…). Exact match is case-insensitive but
  // not partial. Verified filterable attributes against the live index.
  const nodes = [ valueNode('type','=',[State.addType]) ];
  if(State.ratingFacet && State.filterRatings.size){
    nodes.push(valueNode('rating','in',[...State.filterRatings]));
  }
  const f = META_FIELDS.find(x=>x.key===State.metaField);
  const val = ($('#addQuery') ? $('#addQuery').value.trim() : '');
  if(f && !f.q && f.key && val){
    nodes.push(valueNode(f.key,'=',[val]));
  }
  if(nodes.length===1) return nodes[0];
  return { type:'op', op:'and', children:nodes };
}

async function runSearch(){
  // Guard against out-of-order responses: rapid filter changes fire overlapping
  // searches, and a slow earlier one can resolve after a later one and clobber
  // the results. Tag each request; only the latest may render.
  const seq = (State.searchSeq = (State.searchSeq||0) + 1);
  const results = $('#addResults'); results.innerHTML = `<div class="empty"><span class="spin"></span> Searching…</div>`;
  const srcId = $('#srcSel') ? $('#srcSel').value : '';
  const libId = $('#libSel') ? $('#libSel').value : '';
  const text = $('#addQuery') ? $('#addQuery').value.trim() : '';
  const f = META_FIELDS.find(x=>x.key===State.metaField);
  const asText = (!f || f.q);
  // NOTE: Tunarr 1.3.6's free-text `query` is broken — a non-null query returns
  // totalHits>0 but an EMPTY results array, so title search never worked. We
  // therefore always send query:null and rely on the filter tree (type / rating
  // / metadata — all verified working), then filter by title CLIENT-SIDE below.
  const body = {
    query:{
      query: null,
      filter: buildFilterTree(),
      sort:[{field:'sortTitle', direction:'asc'}],
    },
    mediaSourceId: srcId||undefined,
    libraryId: libId||undefined,
    limit: 1000, page:0,
  };
  try{
    const res = await api('POST','/programs/search', body);
    if(seq !== State.searchSeq) return; // a newer search superseded this one
    let items = (res && res.results) || [];
    items = items.filter(it=> (it.type||'')===State.addType);
    const totalHits = res ? res.totalHits : items.length;
    // client-side title contains-filter (only when "By Title" is selected)
    if(asText && text){
      const t = text.toLowerCase();
      items = items.filter(it=> itemTitle(it).toLowerCase().includes(t));
    }
    State.addResults = items;
    State.addTotalHits = totalHits;
    // capped flag: server returned fewer than the true total, so a title filter
    // may have missed matches beyond the fetched page.
    State.addCapped = (totalHits > (res ? (res.results||[]).length : 0));
    renderAddResults(totalHits);
  }catch(e){
    if(seq !== State.searchSeq) return;
    results.innerHTML = `<div class="empty"><b>Search failed</b>${e.message}</div>`;
  }
}

function itemRating(it){ return it.rating || it.contentRating || ''; }
function itemTitle(it){ return it.title || it.name || '(untitled)'; }
function itemType(it){ return it.type || ''; }
function itemId(it){ return it.uuid || it.id; }
function itemEpisodes(it){ return it.grandchildCount!=null?it.grandchildCount:(it.childCount!=null?it.childCount:null); }

function renderAddResults(totalHits){
  const box = $('#addResults'); box.innerHTML='';
  const items = State.addResults;
  const noun = State.addType==='movie' ? 'movies' : 'shows';
  if(!items.length){
    const src = State.mediaSources.find(s=>(s.id||s.uuid)===($('#srcSel')||{}).value);
    const hint = `No ${noun} match. Try a different search or clear filters.`
      + (src ? `<br><span style="color:var(--ink-faint)">If “${src.name}” shows nothing at all, its libraries may not be scanned into Tunarr yet.</span>` : '');
    box.append(el('div','empty',hint)); return;
  }
  if(State.addCapped){
    box.append(el('div','info',`Showing ${items.length} ${noun} (first ${noun==='movies'?'1000':'all'} loaded of ${totalHits}). Use a Genre/Year/Studio filter or a library to narrow — title matching only covers what's loaded.`));
  } else if(totalHits!=null && totalHits>items.length){
    box.append(el('div','info',`${items.length} of ${totalHits} ${noun} match.`));
  }
  // what's already on this channel: shows by show-id, movies by program-id
  const addedShowIds = new Set(State.shows
    .filter(s=>!s.showId.startsWith('movie::')&&!s.showId.startsWith('title::')&&!s.showId.startsWith('item::'))
    .map(s=>s.showId));
  const addedContentIds = new Set((State.programming.lineup||[]).filter(e=>e.type==='content').map(e=>e.id));
  items.forEach(it=>{
    const id = itemId(it);
    const onChannel = itemType(it)==='movie' ? addedContentIds.has(id) : addedShowIds.has(id);
    const row = el('div','result'+(onChannel?' on-channel':''));
    const chk = el('input'); chk.type='checkbox'; chk.className='chk';
    if(onChannel){ chk.style.visibility='hidden'; } // no bulk-select for already-added
    else {
      chk.checked = State.addSelected.has(id);
      chk.onchange=()=>{ if(chk.checked) State.addSelected.set(id, it); else State.addSelected.delete(id); updateAddInfo(); };
    }
    const tWrap = el('div');
    const t = el('div','title', itemTitle(it));
    const rt = itemRating(it); if(rt){ const tag=el('span','rating-tag',rt); t.append(tag); }
    if(onChannel) t.append(el('span','on-tag','on channel'));
    const eps = itemEpisodes(it);
    const yr = it.year ? ` · ${it.year}` : '';
    const sub = itemType(it)==='movie' ? `movie${yr}` : (eps!=null?`${eps} episodes${yr}`:`show${yr}`);
    tWrap.append(t, el('div','sub', sub));
    const typ = el('div','sub', itemType(it)==='movie' ? fmtDur(it.duration||0) : (eps!=null?`${eps} ep`:''));
    let btn;
    if(onChannel){
      btn = el('button','btn sm danger','Remove'); btn.onclick=()=>removeResultFromChannel(it);
    } else {
      btn = el('button','btn sm','Add'); btn.onclick=()=>{ State.addSelected.set(id,it); updateAddInfo(); addSelectedToChannel(); };
    }
    row.append(chk, tWrap, typ, btn);
    box.append(row);
  });
  updateAddInfo();
}

function updateAddInfo(){
  const info = $('#addInfo'); if(!info) return;
  info.textContent = State.addSelected.size ? `${State.addSelected.size} selected to add` : 'Nothing selected';
}

// Round-robin several groups into one list (A,B,A,B,…) so multiple added shows
// mix together rather than playing as consecutive blocks.
function roundRobin(groups){
  const out=[]; for(let i=0;;i++){ let any=false; for(const g of groups){ if(i<g.length){ out.push(g[i]); any=true; } } if(!any) break; }
  return out;
}
// Slot `additions` evenly through `existing`, preserving both orders — so a
// newly-added show lands throughout the rotation (where it would have been),
// not appended as a block at the end.
function evenMerge(existing, additions){
  if(!existing.length) return additions.slice();
  if(!additions.length) return existing.slice();
  const out=[]; const ratio=existing.length/additions.length; let ai=0, nextAt=ratio/2;
  for(let i=0;i<existing.length;i++){
    while(ai<additions.length && i>=nextAt){ out.push(additions[ai++]); nextAt+=ratio; }
    out.push(existing[i]);
  }
  while(ai<additions.length) out.push(additions[ai++]);
  return out;
}
async function addSelectedToChannel(){
  if(!State.addSelected.size){ toast('Select something to add first','warn'); return; }
  // Shows/seasons expand to their descendant episodes; movies add as a single
  // content entry. Both carry the `duration` the manual lineup POST requires.
  toast('Resolving titles…','ok',1500);
  const newGroups=[];
  try{
    for(const [id,it] of State.addSelected){
      const g=[];
      if(itemType(it)==='movie'){
        g.push({type:'content', id, duration: it.duration});
      } else {
        const desc = await api('GET',`/programs/${id}/descendants`).catch(()=>null);
        if(Array.isArray(desc) && desc.length) desc.forEach(d=> g.push({type:'content', id: d.id || d.uuid, duration: d.duration}));
        else g.push({type:'content', id, duration: it.duration});
      }
      newGroups.push(g.filter(c=>c.id && c.duration!=null));
    }
    const additions = roundRobin(newGroups);
    if(!additions.length){ toast('Nothing playable to add','warn'); return; }
    // normalize existing content refs (keep duration the POST requires), then
    // slot the new content evenly through it instead of appending a block.
    const existing = (State.programming.lineup||[]).map(e=>
      e.type==='content' ? {type:'content', id:e.id, duration:e.duration} : e);
    const body = {type:'manual', lineup: evenMerge(existing, additions), append:false};
    await snapshotLineup('add');
    State.programming = await api('POST',`/channels/${State.current.id}/programming`, body);
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    State.addSelected.clear();
    toast(`Added ${additions.length} item(s) into ${State.current.name}'s rotation.`,'ok');
    State.tab='manage'; renderMain();
  }catch(e){ toast('Add failed: '+e.message,'err',6000); }
}

/* ---------- boot ---------- */
window.addEventListener('DOMContentLoaded',()=>{
  const servedOverHttp = location.protocol === 'http:' || location.protocol === 'https:';
  const saved = localStorage && localStorage.getItem('tunarrStudioUrl');
  if(servedOverHttp){
    // Served by server.js (same origin as /api). Default to same-origin and
    // auto-connect so non-technical users don't have to type anything.
    $('#urlInput').value = saved || location.origin;
    $('#connectBtn').onclick = connect;
    $('#urlInput').onkeydown = e=>{ if(e.key==='Enter') connect(); };
    connect();
  } else {
    // Opened as a local file:// — needs an explicit server URL, and Tunarr
    // must allow this origin (TUNARR_CORS_ORIGINS). Dev/testing only.
    $('#urlInput').value = saved || 'http://tunarr.local:8000';
    $('#connectBtn').onclick = connect;
    $('#urlInput').onkeydown = e=>{ if(e.key==='Enter') connect(); };
  }
});
</script>
