<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunarr Studio — Channel Programming</title>
<style>
  .lab2{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:4px}
  :root{
    --bg:#0d0f14; --panel:#151821; --panel-2:#1b1f2b; --line:#262b38;
    --ink:#e8eaf0; --ink-dim:#8b93a7; --ink-faint:#5a6276;
    --accent:#ff6a1a; --accent-dim:#c44a00; --accent-soft:#ff6a1a22;
    --green:#2dc43a; --red:#e2463c; --amber:#e8b53a;
    --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.45;
  }
  button{font-family:inherit}
  a{color:var(--accent)}

  /* ---- top bar ---- */
  header{
    display:flex; align-items:center; gap:16px; padding:10px 18px;
    background:linear-gradient(180deg,#171a23,#11131a);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.5px}
  .brand .dot{
    width:22px;height:22px;border-radius:6px;
    background:radial-gradient(circle at 35% 30%,#ff8c00,#c44a00);
    box-shadow:0 0 0 2px #00000040 inset;
  }
  .brand small{font-weight:600;color:var(--ink-dim);letter-spacing:0}
  header .conn{display:flex;align-items:center;gap:8px;margin-left:auto;font-family:var(--mono);font-size:12px}
  header input[type=text]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:6px 9px;border-radius:7px;font-family:var(--mono);font-size:12px;width:230px;
  }
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    font-family:var(--mono);font-size:11px;border:1px solid var(--line);color:var(--ink-dim)}
  .pill .led{width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
  .pill.ok .led{background:var(--green);box-shadow:0 0 6px var(--green)}
  .pill.err .led{background:var(--red);box-shadow:0 0 6px var(--red)}

  .btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
    padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
    transition:.12s; white-space:nowrap;
  }
  .btn:hover{border-color:#3a4256;background:#222736}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0a02}
  .btn.primary:hover{background:#ff7d33}
  .btn.danger{color:#ffb4ae;border-color:#46221f;background:#1f1413}
  .btn.danger:hover{background:#2a1715}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}

  /* ---- layout ---- */
  .wrap{display:grid;grid-template-columns:230px 1fr;height:calc(100vh - 53px)}
  aside{
    background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:10px;
  }
  aside h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);
    margin:8px 6px;font-weight:700}
  .chan{
    display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;
  }
  .chan:hover{background:var(--panel-2)}
  .chan.active{background:var(--accent-soft);border-color:#5a3318}
  .chan .num{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:26px}
  .chan .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  main{overflow-y:auto;padding:18px 22px}
  .head-row{display:flex;align-items:flex-end;gap:14px;margin-bottom:4px}
  .head-row h1{font-size:22px;margin:0;font-weight:800}
  .head-row .meta{font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-bottom:3px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
  .toolbar .spacer{flex:1}
  .search-in{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:7px 10px;border-radius:8px;font-size:13px;min-width:180px;
  }
  select.search-in{cursor:pointer}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tab{padding:9px 14px;cursor:pointer;color:var(--ink-dim);font-weight:600;font-size:13px;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  /* ---- show rows (mixing-board style) ---- */
  .show{
    display:grid;grid-template-columns:26px 1fr 150px 70px 84px;gap:12px;align-items:center;
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    margin-bottom:7px;
  }
  .show:hover{border-color:#333a4b}
  .show .chk{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
  .show .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .show .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .rating-tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;
    border:1px solid var(--line);border-radius:5px;color:var(--ink-dim);margin-left:7px;vertical-align:1px}

  /* ---- up-next reorder rows ---- */
  .upnext-row{
    display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;
    padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    margin-bottom:6px;cursor:grab;
  }
  .upnext-row:hover{border-color:#333a4b}
  .upnext-row.dragging{opacity:.4}
  .upnext-row.drop-target{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .upnext-row.on-now{border-color:var(--accent)}
  .upnext-row .grip{color:var(--ink-faint);font-size:14px;letter-spacing:-2px;cursor:grab;user-select:none}
  .upnext-row .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .upnext-row .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}

  /* weight fader */
  .fader{position:relative;height:26px;display:flex;align-items:center;gap:8px}
  .fader input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent-dim),var(--accent));outline:none;flex:1}
  .fader input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:pointer}
  .fader input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);cursor:pointer}
  .fader .wval{font-family:var(--mono);font-size:12px;width:30px;text-align:right;color:var(--ink)}
  .epcount{font-family:var(--mono);font-size:12px;color:var(--ink-dim);text-align:right}

  /* now-playing strip */
  .now{
    display:flex;align-items:center;gap:14px;margin:14px 0 4px;padding:12px 14px;
    border:1px solid var(--line);border-radius:12px;
    background:linear-gradient(110deg,#1a1410,#14161e 55%);
  }
  .now .live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
    text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  .now .live .led{width:8px;height:8px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px var(--accent);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .now .np-title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .now .np-sub{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
  .now .np-body{flex:1;min-width:0}
  .now .np-actions{display:flex;gap:8px;flex-shrink:0}
  .now-prog{height:5px;border-radius:3px;background:#2a2f3d;margin-top:7px;overflow:hidden}
  .now-prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent))}

  .empty{padding:50px 20px;text-align:center;color:var(--ink-faint)}
  .empty b{display:block;color:var(--ink-dim);font-size:15px;margin-bottom:6px}

  /* sticky action bar */
  .actionbar{
    position:sticky;bottom:0;margin-top:16px;padding:12px 14px;border:1px solid var(--line);
    border-radius:12px;background:linear-gradient(180deg,#1a1e29,#12141c);
    display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px #00000040;
  }
  .actionbar .info{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
  .actionbar .spacer{flex:1}
  /* build options panel */
  .opts{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;
    padding:13px 14px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);margin-top:14px}
  .opt{display:flex;flex-direction:column;gap:5px}
  .opt label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);font-weight:700}
  .opt select,.opt input[type=number]{background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);padding:7px 9px;border-radius:8px;font-size:13px}
  .opt .hint{font-size:11px;color:var(--ink-faint);max-width:190px;line-height:1.35}
  .opt.toggle{flex-direction:row;align-items:center;gap:9px}
  .opt.toggle input{width:17px;height:17px;accent-color:var(--accent)}
  .opt.toggle .lab{display:flex;flex-direction:column;gap:2px}
  .opt.toggle label{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-weight:600}

  /* add/search results */
  .result{
    display:grid;grid-template-columns:26px 1fr 90px 70px;gap:12px;align-items:center;
    padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:var(--panel)
  }
  .result .title{font-weight:600}
  .result.on-channel{background:rgba(64,160,96,.10);border-color:rgba(80,180,110,.5)}
  .on-tag{display:inline-block;font-size:10px;padding:1px 6px;margin-left:7px;border-radius:5px;
    background:rgba(80,180,110,.18);color:#7fd6a0;vertical-align:1px}
  .facet-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
  .chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);
    cursor:pointer;font-size:12px;font-family:var(--mono);color:var(--ink-dim)}
  .chip:hover{border-color:#3a4256;color:var(--ink)}
  .chip.on{background:var(--accent-soft);border-color:#5a3318;color:var(--accent)}

  /* toast */
  #toast{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:8px}
  .toast{padding:11px 15px;border-radius:9px;font-size:13px;border:1px solid var(--line);
    background:#1c2230;box-shadow:0 8px 24px #00000060;min-width:220px;animation:slide .25s}
  .toast.ok{border-color:#1f5a28}.toast.err{border-color:#5a2420}.toast.warn{border-color:#5a4a1f}
  @keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ink-faint);
    border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
  @keyframes rot{to{transform:rotate(360deg)}}

  .modal-bg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:480px;width:90%}
  .modal h2{margin:0 0 8px;font-size:17px}
  .modal p{color:var(--ink-dim);margin:0 0 16px}
  .modal .row{display:flex;gap:10px;justify-content:flex-end}
  code.k{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:1px 6px;border-radius:5px;color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> Tunarr&nbsp;Studio <small>· programming desk</small></div>
  <div class="conn">
    <input id="urlInput" type="text" spellcheck="false" placeholder="http://tunarr.local:8000">
    <button class="btn sm" id="connectBtn">Connect</button>
    <span class="pill" id="connPill"><span class="led"></span><span id="connTxt">offline</span></span>
  </div>
</header>

<div class="wrap">
  <aside>
    <h3>Channels</h3>
    <div id="chanList"></div>
  </aside>

  <main id="main">
    <div class="empty"><b>Connect to your Tunarr server</b>
      Enter your server URL above and hit Connect to load channels.</div>
  </main>
</div>

<div id="toast"></div>

<!-- confirm modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Confirm</h2>
    <p id="modalBody"></p>
    <div class="row">
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalOk">Confirm</button>
    </div>
  </div>
</div>

<script>
/* ============================================================= *
 *  Tunarr Studio — single-file control surface for channel
 *  programming. Talks directly to the Tunarr REST API.
 *  Verified endpoints:
 *    GET  /api/channels
 *    GET  /api/channels/:id/programming   {lineup, programs}
 *    POST /api/channels/:id/programming    (manual|random)
 *    POST /api/programs/search             filter tree + facets
 *    GET  /api/programs/facets/:name       discover rating values
 *    GET  /api/media-sources               list plex/jellyfin sources
 *    GET  /api/media-sources/:id/libraries
 * ============================================================= */

const State = {
  base: '',
  channels: [],
  current: null,        // channel object
  programming: null,    // raw {lineup, programs}
  shows: [],            // grouped [{showId,title,count,ids,rating,weights...}]
  tab: 'manage',        // manage | add
  mediaSources: [],
  libraries: [],
  ratingFacet: null,    // facet name that holds content ratings
  ratingValues: {},     // value -> count
  addResults: [],
  addSelected: new Map(),// id -> result item
  filterRatings: new Set(),
  addType: 'show',      // 'show' | 'movie' — what the Add tab searches/adds
  metaField: '',        // '' = free-text title; else a filterable attribute key
  addCapped: false,     // true when search results were truncated by the fetch limit
};

// Metadata fields the Add tab can search by. Verified filterable against the
// live index; values are matched EXACTLY (case-insensitive), partials don't
// match. `key` is the Meilisearch attribute; `q:true` means "use the free-text
// query string" instead of an exact filter. `movieOnly` fields are hidden for
// shows (e.g. studio is only populated on movies in this Plex data).
const META_FIELDS = [
  {key:'',             label:'Title',    q:true},
  {key:'genres.name',  label:'Genre'},
  {key:'actors.name',  label:'Actor'},
  {key:'director.name',label:'Director'},
  {key:'studio.name',  label:'Studio', movieOnly:true},
  {key:'originalReleaseYear', label:'Year'},
  {key:'tags',         label:'Tag'},
];

// Genre vocabulary present in this library (verified via genres.name counts).
const ALL_GENRES = ['Action','Adventure','Animation','Comedy','Crime','Documentary',
  'Drama','Family','Fantasy','History','Horror','Music','Mystery','Romance',
  'Science Fiction','Thriller','War','Western','Reality','Children','Sport','Suspense'];

// Curated themed-channel suggestions. Each is validated against live content
// counts when the Add-channel dialog opens; only those with enough content show.
// types: which content kinds to pull; genres are AND-ed together.
const CHANNEL_THEMES = [
  {name:'Crime Dramas',  genres:['Crime'],              types:['show','movie']},
  {name:'Sci-Fi',        genres:['Science Fiction'],    types:['show','movie']},
  {name:'Rom-Coms',      genres:['Romance','Comedy'],   types:['movie']},
  {name:'All Comedy',    genres:['Comedy'],             types:['show','movie']},
  {name:'Cartoons',      genres:['Animation'],          types:['show','movie']},
  {name:'Action',        genres:['Action'],             types:['show','movie']},
  {name:'Adventure',     genres:['Adventure'],          types:['show','movie']},
  {name:'Fantasy',       genres:['Fantasy'],            types:['show','movie']},
  {name:'Horror Movies', genres:['Horror'],             types:['movie']},
  {name:'Mystery',       genres:['Mystery'],            types:['show','movie']},
  {name:'Family',        genres:['Family'],             types:['show','movie']},
  {name:'Documentaries', genres:['Documentary'],        types:['show','movie']},
  {name:'Westerns',      genres:['Western'],            types:['show','movie']},
  {name:'Thrillers',     genres:['Thriller'],           types:['show','movie']},
];

const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const uuid = ()=> (crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});

/* ---------- HTTP ---------- */
async function api(method, path, body){
  const url = State.base.replace(/\/$/,'') + '/api' + path;
  const opt = {method, headers:{'Accept':'application/json'}};
  if(body!==undefined){opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body);}
  const r = await fetch(url, opt);
  if(!r.ok){
    const t = await r.text().catch(()=> '');
    throw new Error(`HTTP ${r.status} ${method} ${path}\n${t.slice(0,300)}`);
  }
  const txt = await r.text();
  return txt.trim() ? JSON.parse(txt) : null;
}

/* ---------- toast ---------- */
function toast(msg, kind='ok', ms=3200){
  const t = el('div','toast '+kind, msg);
  $('#toast').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);}, ms);
}

/* ---------- confirm modal ---------- */
function confirmModal(title, body){
  return new Promise(res=>{
    $('#modalOk').style.display=''; $('#modalCancel').textContent='Cancel';
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = body;
    $('#modalBg').classList.add('show');
    const done = v=>{ $('#modalBg').classList.remove('show'); $('#modalOk').onclick=null; $('#modalCancel').onclick=null; res(v); };
    $('#modalOk').onclick = ()=>done(true);
    $('#modalCancel').onclick = ()=>done(false);
  });
}

/* ---------- prompt modal (text input) ---------- */
function promptModal(title, label, placeholder='', initial=''){
  return new Promise(res=>{
    $('#modalOk').style.display=''; $('#modalCancel').textContent='Cancel';
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML =
      `<label style="display:block;margin-bottom:6px;color:var(--ink-dim);font-size:13px">${label}</label>`+
      `<input id="promptInput" class="search-in" style="width:100%" placeholder="${placeholder.replace(/"/g,'&quot;')}" value="${initial.replace(/"/g,'&quot;')}">`;
    $('#modalBg').classList.add('show');
    const inp=$('#promptInput'); setTimeout(()=>inp.focus(),30);
    const done=v=>{ $('#modalBg').classList.remove('show'); $('#modalOk').onclick=null; $('#modalCancel').onclick=null; inp.onkeydown=null; res(v); };
    $('#modalOk').onclick=()=>done(inp.value.trim()||null);
    $('#modalCancel').onclick=()=>done(null);
    inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault(); done(inp.value.trim()||null);} };
  });
}

function closeModal(){
  $('#modalBg').classList.remove('show');
  $('#modalOk').style.display=''; $('#modalCancel').textContent='Cancel';
  $('#modalOk').onclick=null; $('#modalCancel').onclick=null;
}

/* ---------- connection ---------- */
function setConn(state, txt){
  const p = $('#connPill'); p.className = 'pill '+(state||'');
  $('#connTxt').textContent = txt;
}

async function connect(){
  const url = $('#urlInput').value.trim();
  if(!url){toast('Enter a server URL first','warn');return;}
  State.base = url;
  localStorage && localStorage.setItem('tunarrStudioUrl', url);
  setConn('', 'connecting…');
  try{
    State.channels = await api('GET','/channels');
    setConn('ok', `online · ${State.channels.length} ch`);
    renderChannels();
    // background: load media sources for the Add tab
    loadMediaSources();
    if(State.channels.length) selectChannel(State.channels[0]);
  }catch(e){
    setConn('err','connection failed');
    toast('Could not reach Tunarr. If the page and server are on different origins, Tunarr needs CORS enabled (see notes).','err',6000);
    console.error(e);
  }
}

/* ---------- channels sidebar ---------- */
function renderChannels(){
  const box = $('#chanList'); box.innerHTML='';
  State.channels.slice().sort((a,b)=>(a.number||0)-(b.number||0)).forEach(ch=>{
    const row = el('div','chan'+(State.current&&State.current.id===ch.id?' active':''));
    row.append(el('span','num', ch.number!=null?ch.number:'—'));
    row.append(el('span','nm', ch.name||'(unnamed)'));
    row.onclick=()=>selectChannel(ch);
    box.append(row);
  });
  const add=el('div','chan add-chan'); add.style.cursor='pointer'; add.style.opacity='.85';
  add.append(el('span','num','＋'));
  add.append(el('span','nm','Add channel…'));
  add.onclick=openAddChannel;
  box.append(add);
}

/* ---------- group lineup by show ---------- */
function showInfo(prog){
  // Condensed programming map values are: {type:'content', id, duration, program}
  // where program is the episode, and the show is NESTED at program.show
  // ({id/uuid, title, rating}). Season is at program.season. (Verified against
  // MaterializeProgramsCommand: apiItem.show = convertedShow.)
  const term = prog.program || prog;
  const show = term.show || prog.show || null;
  const ptype = term.type || prog.type;

  let showId = (show && (show.id || show.uuid)) || term.showId || null;
  let title  = (show && show.title) || null;
  let rating = (show && show.rating) || term.rating || prog.rating || null;

  if(!title){
    if(ptype==='movie'){
      title = term.title || prog.title || '(movies)';
      showId = showId || ('movie::'+title);
    } else {
      // genuinely no show data — leave title null so caller can resolve by id
      title = null;
    }
  }
  if(!showId) showId = title ? ('title::'+title) : ('item::'+(term.uuid||prog.id||'x'));
  return {showId, title, rating, ptype};
}

async function groupShows(programming){
  const lineup = programming.lineup||[];
  const programs = programming.programs||{};
  const map = new Map();
  for(const e of lineup){
    if(e.type!=='content') continue;
    const prog = programs[e.id]||{};
    const {showId,title,rating} = showInfo(prog);
    let g = map.get(showId);
    if(!g){ g={showId,title,rating,count:0,ids:[],weight:1}; map.set(showId,g); }
    g.count++; g.ids.push(e.id);
    if(!g.title && title) g.title = title;
    if(!g.rating && rating) g.rating = rating;
  }
  // Resolve titles only for real show groups still missing one.
  const needsTitle = [...map.values()].filter(g=>
    !g.title && !g.showId.startsWith('title::') && !g.showId.startsWith('movie::') && !g.showId.startsWith('item::')
  );
  await Promise.all(needsTitle.map(async g=>{
    try{
      const show = await api('GET',`/programming/shows/${g.showId}`);
      const t = show && (show.title || show.name);
      if(t) g.title = t;
      const r = show && (show.rating || show.contentRating);
      if(r && !g.rating) g.rating = r;
    }catch(e){ /* keep fallback */ }
  }));
  for(const g of map.values()){ if(!g.title) g.title='(unknown show)'; }
  return [...map.values()];
}

/* ---------- select + render a channel ---------- */
async function selectChannel(ch){
  State.current = ch; State.tab='manage';

    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));

  }
}

/* ---------- NOW PLAYING / SKIP ---------- *
 * Tunarr plays a looping lineup anchored at channel.startTime (epoch ms).
 * Position now = (Date.now() - startTime) mod totalDuration. To change what's
 * on, we shift startTime so the playhead lands at the start of a chosen
 * program. Shifting startTime triggers a guide regen server-side.
 * --------------------------------------------------------------------------- */
function lineupDurations(){
  // returns [{idx, type, id, durationMs, offsetMs, title, show}] for the *content+flex* loop
  const lineup = State.programming.lineup||[];
  const programs = State.programming.programs||{};
  let off=0; const out=[];
  lineup.forEach((e,i)=>{
    const dur = e.duration || (programs[e.id] && programs[e.id].duration) || 0;
    let title='Flex', show='';
    if(e.type==='content'){
      const info = showInfo(programs[e.id]||{});
      show = info.title;
      const term = (programs[e.id]||{}).program||{};
      title = term.title || (programs[e.id]||{}).title || info.title;
    } else if(e.type==='redirect'){ title='Redirect'; }
    out.push({idx:i, type:e.type, id:e.id, durationMs:dur, offsetMs:off, title, show});
    off += dur;
  });
  return {items:out, total:off};
}

function currentPlayhead(){
  const ch = State.current;
  const {items,total} = lineupDurations();
  if(!total) return null;
  const elapsed = ((Date.now() - (ch.startTime||0)) % total + total) % total;
  let cur = items[0];
  for(const it of items){ if(elapsed >= it.offsetMs && elapsed < it.offsetMs+it.durationMs){ cur=it; break; } }
  return {cur, elapsed, total, items, into: elapsed - cur.offsetMs};
}

function renderNowPanel(){
  const wrap = el('div','now');
  const ph = currentPlayhead();
  const left = el('div'); 
  const live = el('div','live'); live.append(el('span','led')); live.append(document.createTextNode('On now'));
  left.append(live);
  const body = el('div','np-body');
  if(ph){
    const c = ph.cur;
    const t = el('div','np-title', c.type==='content' ? (c.show && c.show!==c.title ? `${c.show} — ${c.title}` : c.title) : c.title);
    const remain = Math.max(0, (c.durationMs - ph.into));
    const sub = el('div','np-sub', `${fmtDur(ph.into)} / ${fmtDur(c.durationMs)} · ${fmtDur(remain)} left`);
    body.append(t, sub);
    const prog = el('div','now-prog'); const bar=el('i'); bar.style.width=Math.min(100,(ph.into/c.durationMs*100||0))+'%'; prog.append(bar);
    body.append(prog);
  } else {
    body.append(el('div','np-title','No schedule yet'), el('div','np-sub','Apply programming to start the channel loop.'));
  }
  const actions = el('div','np-actions');
  const skipBtn = el('button','btn','Skip ▸'); skipBtn.title='Jump to the next program now'; skipBtn.onclick=()=>skipToNext();
  const pickBtn = el('button','btn','Change to…'); pickBtn.title='Jump to a specific show now'; pickBtn.onclick=()=>openPicker();
  const reshufBtn = el('button','btn','Reshuffle'); reshufBtn.title='Wipe & reload, then start fresh'; reshufBtn.onclick=()=>reshuffleNow();
  actions.append(skipBtn, pickBtn, reshufBtn);

  wrap.append(left, body, actions);
  return wrap;
}

function fmtDur(ms){
  const s=Math.round(ms/1000); const m=Math.floor(s/60), ss=s%60;
  if(m>=60){const h=Math.floor(m/60); return `${h}h${String(m%60).padStart(2,'0')}`;}
  return `${m}:${String(ss).padStart(2,'0')}`;
}

async function shiftStartTimeTo(targetOffsetMs){
  // set startTime so that "now" equals targetOffsetMs into the loop
  const fresh = await api('GET',`/channels/${State.current.id}`);
  const newStart = Date.now() - targetOffsetMs;
  const body = {...fresh, startTime: newStart};
  // SaveableChannel omits some fields; sending extras is tolerated, but strip the obvious server-only ones
  delete body.programCount; delete body.sessions; delete body.fallback; delete body.transcoding;
  await api('PUT',`/channels/${State.current.id}`, body);
  State.current.startTime = newStart;
}

async function skipToNext(){
  const ph = currentPlayhead();
  if(!ph){toast('No schedule to skip','warn');return;}
  // next program offset (wrap to 0 at end)
  const items = ph.items;
  const curIdx = items.indexOf(ph.cur);
  const next = items[(curIdx+1) % items.length];
  try{
    await shiftStartTimeTo(next.offsetMs + 50); // +50ms so we're safely inside it
    toast(`Skipped to “${next.show||next.title}”.`,'ok');
    renderMain();
  }catch(e){ toast('Skip failed: '+e.message,'err',6000); }
}

function openPicker(){
  const {items} = lineupDurations();
  // distinct shows with their first offset
  const seen = new Map();
  items.forEach(it=>{ if(it.type!=='content') return; if(!seen.has(it.show)) seen.set(it.show, it); });
  if(!seen.size){toast('No shows to jump to','warn');return;}
  const list = [...seen.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  const rows = list.map(([show,it])=>`<button class="btn ghost" style="justify-content:flex-start;width:100%;margin-bottom:6px;text-align:left" data-off="${it.offsetMs}">${show}</button>`).join('');
  $('#modalTitle').textContent='Change what\u2019s on now';
  $('#modalBody').innerHTML = `<div style="max-height:50vh;overflow:auto">${rows}</div>`;
  $('#modalBg').classList.add('show');
  // wire buttons
  $('#modalBody').querySelectorAll('button[data-off]').forEach(b=>{
    b.onclick = async ()=>{
      $('#modalBg').classList.remove('show');
      try{ await shiftStartTimeTo(+b.dataset.off + 50); toast(`Now playing “${b.textContent}”.`,'ok'); renderMain(); }
      catch(e){ toast('Change failed: '+e.message,'err',6000); }
    };
  });
  // hide default ok/cancel for picker (use cancel only)
  $('#modalOk').style.display='none';
  $('#modalCancel').textContent='Close';
  $('#modalCancel').onclick=()=>{ $('#modalBg').classList.remove('show'); $('#modalOk').style.display=''; $('#modalCancel').textContent='Cancel'; };
}

/* ---------- UP NEXT (drag-to-reorder the upcoming lineup) ----------
 * Shows the channel's content loop in PLAY ORDER, rotated so the program on
 * now is first, with projected air times. Rows are draggable; Save POSTs the
 * reordered lineup as a manual lineup. To stay seamless, after saving we shift
 * startTime so the program that was on now keeps playing from the same point
 * (unless it was dragged — then the new first item starts now). */
let upNextDrag = null;
function renderUpNext(){
  const box = el('div');
  const ph = currentPlayhead();
  const {items} = lineupDurations();
  const content = items.filter(it=>it.type==='content');
  if(!content.length){
    box.append(el('div','empty','No programming yet. Add shows or apply a schedule, then come back to reorder.'));
    return box;
  }
  // rotate so the currently-playing item leads the list
  let startIdx = 0;
  if(ph){ const ci = content.findIndex(c=>c.idx===ph.cur.idx); if(ci>=0) startIdx=ci; }
  const order = content.slice(startIdx).concat(content.slice(0,startIdx));
  State.upNext = order.map(c=>({id:c.id, durationMs:c.durationMs, title:c.title, show:c.show}));
  State.upNextInto = ph ? ph.into : 0;
  State.upNextCurId = ph ? ph.cur.id : (order[0] && order[0].id);
  State.upNextDirty = false;

  const tb = el('div','toolbar');
  tb.append(el('div','info','Drag rows to reorder. The program on now keeps playing seamlessly.'));
  tb.append(el('div','spacer'));
  const resetBtn = el('button','btn ghost sm','Reset'); resetBtn.onclick=()=>{State.tab='upnext'; renderMain();};
  const saveBtn = el('button','btn primary','Save order'); saveBtn.id='upNextSave'; saveBtn.onclick=saveUpNext;
  tb.append(resetBtn, saveBtn);
  box.append(tb);

  const list = el('div'); list.id='upNextList';
  box.append(list);
  renderUpNextRows(list);
  return box;
}

function renderUpNextRows(list){
  list = list || $('#upNextList'); if(!list) return;
  list.innerHTML='';
  let acc = Date.now() - (State.upNextInto||0); // projected start of row 0
  State.upNext.forEach((it,i)=>{
    const when = new Date(acc); acc += it.durationMs;
    const row = el('div','upnext-row'+(i===0?' on-now':'')); row.draggable=true; row.dataset.i=i;
    const handle = el('div','grip','⋮⋮');
    const tw = el('div','un-main');
    const t = el('div','title', it.show && it.show!==it.title ? `${it.show} — ${it.title}` : it.title);
    const sub = el('div','sub', `${when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${fmtDur(it.durationMs)}${i===0?' · on now':''}`);
    tw.append(t, sub);
    row.append(handle, tw);
    row.ondragstart=e=>{ upNextDrag=i; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(i));}catch(_){} };
    row.ondragend=()=>{ row.classList.remove('dragging'); };
    row.ondragover=e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; row.classList.add('drop-target'); };
    row.ondragleave=()=>row.classList.remove('drop-target');
    row.ondrop=e=>{ e.preventDefault(); row.classList.remove('drop-target'); moveUpNext(upNextDrag, i); };
    list.append(row);
  });
}

function moveUpNext(from, to){
  if(from==null || from===to || from<0) return;
  const arr = State.upNext; if(to>=arr.length) to=arr.length-1;
  const [m] = arr.splice(from,1); arr.splice(to,0,m);
  State.upNextDirty = true;
  renderUpNextRows();
}

async function saveUpNext(){
  if(!State.upNext || !State.upNext.length){ toast('Nothing to save','warn'); return; }
  const lineup = State.upNext.map(it=>({type:'content', id:it.id, duration:it.durationMs}));
  const ok = await confirmModal('Save new order',
    `Save the reordered lineup for <b>${State.current.name}</b> — ${lineup.length} programs?`);
  if(!ok) return;
  try{
    toast('Saving order…','ok',1500);
    await snapshotLineup('reorder');
    State.programming = await api('POST',`/channels/${State.current.id}/programming`, {type:'manual', lineup, append:false});
    // keep the program that was on now playing from the same point: find its new offset
    const curId = State.upNextCurId, into = State.upNextInto||0;
    let off=0, found=false;
    for(const e of (State.programming.lineup||[])){
      if(e.id===curId){ found=true; break; }
      off += e.duration || 0;
    }
    await shiftStartTimeTo(found ? off + into + 30 : 30);
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    renderMain();
    toast('Lineup reordered.','ok');
  }catch(e){ toast('Reorder save failed: '+e.message,'err',6000); }
}

async function reshuffleNow(){
  const ok = await confirmModal('Reshuffle channel',
    `Wipe and regenerate <b>${State.current.name}</b> as a fresh shuffle, then start it from the top?<br><br>This keeps the same shows — only the order changes.`);
  if(!ok) return;
  try{
    // reload as a shuffled manual lineup
    const content = (State.programming.lineup||[]).filter(e=>e.type==='content').slice();
    for(let i=content.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [content[i],content[j]]=[content[j],content[i]]; }
    await snapshotLineup('reshuffle');
    State.programming = await api('POST',`/channels/${State.current.id}/programming`, {type:'manual', lineup:content, append:false});
    await shiftStartTimeTo(0); // start from the top
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    toast('Reshuffled and restarted from the top.','ok');
    renderMain();
  }catch(e){ toast('Reshuffle failed: '+e.message,'err',6000); }
}

/* ---------- MANAGE tab ---------- */
function renderManage(){
  const box = el('div');

  // toolbar: search + rating filter + bulk
  const tb = el('div','toolbar');
  const search = el('input','search-in'); search.placeholder='Filter shows…'; search.type='text';
  search.oninput=()=>applyManageFilter(search.value);

  if(ratings.length){
    const sel = el('select','search-in');
    sel.append(new Option('All ratings',''));
    ratings.forEach(r=> sel.append(new Option(r, r)));

  }

  const selAll = el('button','btn ghost sm','Select all'); selAll.onclick=()=>toggleAll(true);
  const selNone = el('button','btn ghost sm','Clear'); selNone.onclick=()=>toggleAll(false);

  // miss and the list would stay empty until the first filter keystroke.
  renderShowRows('', '', list);

  // named collections (save/restore the whole lineup under a name)
  box.append(renderCollectionsPanel());

  // build options panel
  const opts = el('div','opts');

  const oMode = optBlock('Build as', sel=>{
    sel.id='applyMode';
    sel.append(new Option('Random schedule','random'));
    sel.append(new Option('Manual lineup','manual'));
    if(sv.mode) sel.value=sv.mode;
    sel.onchange=syncOptState;
  });
  const oOrder = optBlock('Episode order', sel=>{
    sel.id='orderMode';
    sel.append(new Option('Series order','chronological'));
    sel.append(new Option('Random','shuffle'));
    sel.append(new Option('Continue next','next'));
    sel.append(new Option('Shuffle seasons','ordered_shuffle'));
    if(sv.order) sel.value=sv.order;
  });
  const oBlock = optNumber('Episodes per block', 'blockSize', sv.blockSize||1, 1, 20,
    'How many episodes of a show play back-to-back before moving on.');
  const oDays = optNumber('Schedule days', 'daysIn', sv.days||2, 1, 14,
    'How far ahead to generate (random mode).');

  // normalize toggle
  const oNorm = el('div','opt toggle');
  const nchk = el('input'); nchk.type='checkbox'; nchk.id='normalize';
  nchk.checked = sv.normalize!=null ? !!sv.normalize : true;
  nchk.onchange=syncOptState;
  const nlab = el('div','lab');
  nlab.append(el('label',null,'Equal airtime'));
  nlab.append(el('div','hint','Give every show roughly the same airtime, ignoring how many episodes each has.'));
  oNorm.append(nchk, nlab);

  opts.append(oMode, oOrder, oBlock, oNorm, oDays);
  box.append(opts);

  // action bar
  const bar = el('div','actionbar');
  const info = el('div','info'); info.id='selInfo';
  const sp = el('div','spacer');
  const restoreBtn = el('button','btn ghost','Restore previous lineup');
  restoreBtn.title='Undo the last apply/add/remove by restoring the saved snapshot';
  restoreBtn.onclick=restoreLineup;
  const removeBtn = el('button','btn danger','Remove selected'); removeBtn.onclick=removeSelected;
  const applyBtn = el('button','btn primary','Apply'); applyBtn.onclick=applyWeighting;
  bar.append(info, sp, restoreBtn, removeBtn, applyBtn);
  box.append(bar);
  // reflect whether a backup exists (label + enabled state)
  loadPrefs(State.current.id).then(p=>{
    const bak = p && p.lineupBackup;
    if(bak && bak.savedAt){
      restoreBtn.textContent = `Restore previous (${bak.totalPrograms} programs)`;
    } else {
      restoreBtn.disabled = true; restoreBtn.style.opacity='.5'; restoreBtn.title='No saved lineup yet';
    }
  });

  updateSelInfo();
  setTimeout(syncOptState,0);
  return box;
}

/* small builders for the options panel */
function optBlock(labelText, setup){
  const wrap = el('div','opt');
  wrap.append(el('label',null,labelText));
  const sel = el('select'); setup(sel); wrap.append(sel);
  return wrap;
}
function optNumber(labelText, id, val, min, max, hint){
  const wrap = el('div','opt');
  wrap.append(el('label',null,labelText));
  const inp = el('input'); inp.type='number'; inp.id=id; inp.value=val; inp.min=min; inp.max=max;
  inp.style.width='90px';
  wrap.append(inp);
  if(hint) wrap.append(el('div','hint',hint));
  return wrap;
}
/* enable/disable options that don't apply to the chosen mode */
function syncOptState(){
  const mode = ($('#applyMode')||{}).value;
  const days = $('#daysIn');
  if(days) days.closest('.opt').style.opacity = mode==='random'?'1':'.4';
  if(days) days.disabled = mode!=='random';
}

function renderShowRows(filterText='', filterRating='', listEl=null){
  const list = listEl || $('#showList'); if(!list) return;
  list.innerHTML='';
  const ft = filterText.trim().toLowerCase();
  let shown=0;
  State.shows.forEach(s=>{
    if(ft && !s.title.toLowerCase().includes(ft)) return;
    if(filterRating && s.rating!==filterRating) return;
    shown++;
    const row = el('div','show');
    const chk = el('input'); chk.type='checkbox'; chk.className='chk'; chk.checked=!!s._sel;
    chk.onchange=()=>{s._sel=chk.checked; updateSelInfo();};
    const titleWrap = el('div');
    const t = el('div','title'); t.textContent=s.title;
    if(s.rating){ const rt=el('span','rating-tag', s.rating); t.append(rt); }
    const sub = el('div','sub', s.showId.startsWith('title::')||s.showId.startsWith('movie::')
       ? 'no show-id metadata — weighting falls back to manual' : s.showId.slice(0,18)+'…');
    titleWrap.append(t, sub);

    // fader
    const fader = el('div','fader');
    const rng = el('input'); rng.type='range'; rng.min='0'; rng.max='10'; rng.step='1'; rng.value=s.weight;
    const wv = el('span','wval', s.weight+'×');
    rng.oninput=()=>{ s.weight=+rng.value; wv.textContent=s.weight+'×'; };
    fader.append(rng, wv);

    const ep = el('div','epcount', s.count+' ep');
    const rm = el('button','btn danger sm','Remove');
    rm.onclick=()=>removeShows([s]);

    row.append(chk, titleWrap, fader, ep, rm);
    list.append(row);
  });
  if(!shown){
    list.append(el('div','empty','No shows match this filter.'));
  }
}

function applyManageFilter(text, rating){
  const sel = document.querySelector('#showList');
  const ratingSel = [...document.querySelectorAll('.toolbar select')][0];
  renderShowRows(text||'', rating!==undefined?rating:(ratingSel?ratingSel.value:''));
}

function toggleAll(v){ State.shows.forEach(s=>s._sel=v); renderShowRows(
  ($('.toolbar input')||{}).value||'', ($('.toolbar select')||{}).value||''); updateSelInfo(); }

function updateSelInfo(){
  const sel = State.shows.filter(s=>s._sel);
  const eps = sel.reduce((a,s)=>a+s.count,0);
  const info = $('#selInfo');
  if(info) info.textContent = sel.length
    ? `${sel.length} selected · ${eps} episodes`
    : `${State.shows.length} shows · drag faders to set play frequency`;
}

/* ---------- remove ---------- */
async function removeSelected(){
  const sel = State.shows.filter(s=>s._sel);
  if(!sel.length){toast('Select shows to remove first','warn');return;}
  removeShows(sel);
}

async function removeShows(shows){
  const eps = shows.reduce((a,s)=>a+s.count,0);
  const names = shows.map(s=>`<code class="k">${s.title}</code>`).join(' ');
  const ok = await confirmModal('Remove shows',

/* ---------- weighting ---------- */
async function applyWeighting(){
  const mode = $('#applyMode').value;
  const days = Math.max(1, Math.min(14, +($('#daysIn')||{}).value||2));
  const order = ($('#orderMode')||{}).value || 'shuffle';
  const blockSize = Math.max(1, Math.min(20, +($('#blockSize')||{}).value||1));
  const normalize = !!($('#normalize')||{}).checked;

  const usable = State.shows.filter(s=>!s.showId.startsWith('title::')&&!s.showId.startsWith('movie::'));
  const fallback = State.shows.length - usable.length;
  const lineupById = new Map((State.programming.lineup||[]).filter(e=>e.type==='content').map(e=>[e.id,e]));
  const programIds = [...lineupById.keys()];

  // Order a show's episode ids according to the chosen ordering. The lineup is
  // already stored in the channel's existing order (usually series order from
  // when shows were added), so 'chronological'/'next' preserve it; 'shuffle'
  // randomizes; 'ordered_shuffle' is handled server-side in random mode.
  function orderEpisodes(ids){
    if(order==='shuffle' || order==='ordered_shuffle'){
      const a = ids.slice();
      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
      return a;
    }
    return ids.slice(); // chronological / next => keep stored order
  }

  let body;
  if(mode==='random'){
    // Native Tunarr random schedule. programCount = block size; order maps
    // directly; weight balances selection. Normalize => equal weight per show.
    const slots = usable.filter(s=>s.weight>0).map(s=>({
      id: uuid(),
      type:'show', showId:s.showId, seasonFilter:[], seasonExcludeFilter:[],
      order, direction:'asc',
      weight: normalize ? 1 : s.weight,
      cooldownMs:0,
      durationSpec:{type:'dynamic', programCount: blockSize},
    }));
    if(!slots.length){toast('All weights are 0 — nothing to schedule','warn');return;}
    // padStyle MUST be 'slot' (not 'episode'): with 'episode' the scheduler
    // emits only ~programCount programs total and ignores maxDays, producing a
    // 1-item lineup that WIPES the channel. 'slot' fills the full maxDays window
    // (verified vs Tunarr 1.3.6: maxDays 1/2/7 -> 41/62/181 programs).
    body = {type:'random', programs:programIds, schedule:{
      type:'random', flexPreference:'distribute', maxDays:days, padMs:0, padStyle:'slot',
      slots, randomDistribution: normalize ? 'uniform' : 'weighted', lockWeights:false,
    }};
  } else {
    // Manual lineup we assemble ourselves.
    //  - normalize: cap every show to the same number of episode *visits* so
    //    airtime is balanced regardless of library size.
    //  - blockSize: take that many consecutive episodes per visit.
    //  - weight: a show with weight w gets w times as many visits.
    const pools = usable.filter(s=>s.weight>0).map(s=>({
      show:s, w:s.weight, q:orderEpisodes(s.ids), pos:0,
    }));
    if(!pools.length){toast('All weights are 0 — nothing to schedule','warn');return;}

    // visits per unit weight: with normalize, base it on the smallest library so
    // every show can supply that many blocks without over-looping. Without
    // normalize, let longer shows contribute more (proportional to their length).
    const blocksAvail = pools.map(p=>Math.max(1, Math.ceil(p.q.length/blockSize)));
    const baseVisits = normalize ? Math.max(1, Math.min(...blocksAvail)) : null;

    // build a weighted round-robin of *visits*
    const visitQuota = pools.map((p,i)=>{
      const units = normalize ? baseVisits : blocksAvail[i];
      return units * p.w;
    });
    const remaining = visitQuota.slice();
    const acc = pools.map(()=>0);
    const totalW = pools.reduce((a,p)=>a+p.w,0);
    const out=[];
    let guard = (visitQuota.reduce((a,b)=>a+b,0))*2 + 10;
    while(remaining.some(r=>r>0) && guard-->0){
      let best=-1,bestVal=-Infinity;
      pools.forEach((p,i)=>{ if(remaining[i]<=0) return; acc[i]+=p.w; if(acc[i]>bestVal){bestVal=acc[i];best=i;} });
      if(best<0) break;
      acc[best]-=totalW; remaining[best]--;
      const p=pools[best];
      // emit a block of up to blockSize consecutive episodes, looping the
      // show's queue if needed
      for(let k=0;k<blockSize;k++){
        if(p.pos>=p.q.length){ if(normalize) break; p.pos=0; p.q=orderEpisodes(p.show.ids); }
        const e=lineupById.get(p.q[p.pos++]); if(e) out.push(e);
      }
    }
    if(!out.length){toast('Nothing to schedule with these options','warn');return;}
    body = {type:'manual', lineup:out, append:false};
  }

  // confirmation summary
  const bits = [];
  bits.push(mode==='random'?`random schedule (${days} day${days>1?'s':''})`:'manual lineup');
  bits.push(`order: ${({chronological:'series',shuffle:'random',next:'continue next',ordered_shuffle:'shuffle seasons'})[order]||order}`);
  if(blockSize>1) bits.push(`${blockSize}-episode blocks`);
  bits.push(normalize?'equal airtime per show':'weighted by fader');
  const note = fallback ? `<br><br><span style="color:var(--amber)">${fallback} show(s) lack show-id metadata and were ${mode==='random'?'excluded':'included via episode duplication'}.</span>`:'';
  const ok = await confirmModal('Rebuild programming',
    `Rebuild <b>${State.current.name}</b> as a ${bits.join(' · ')}?${note}`);
  if(!ok) return;
  try{
    toast('Building schedule…','ok',1500);
    await snapshotLineup('apply');
    State.programming = await api('POST',`/channels/${State.current.id}/programming`, body);
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    // persist prefs + the exact schedule body so the backend can re-feed the
    // guide on a timer and restore the fader/options on next load.
    await savePrefs({
      name: State.current.name,
      mode, order, blockSize, normalize, days,
      weights: Object.fromEntries(State.shows.map(s=>[s.showId, s.weight])),
      // only random schedules can be auto-replayed to keep the guide fed
      scheduleBody: mode==='random' ? body : null,
    });
    renderMain();
    toast(mode==='random' ? 'Programming rebuilt. Guide will stay fed automatically.' : 'Programming rebuilt.','ok');
  }catch(e){ toast('Apply failed: '+e.message,'err',6000); }
}

/* ---------- lineup backup / restore safety net ----------
 * Every lineup-mutating action (apply / add / remove / reshuffle) calls
 * snapshotLineup() FIRST, persisting the pre-change content lineup to prefs.
 * If a change goes wrong (e.g. a bad apply that wipes the channel), the user
 * can hit "Restore previous lineup" to POST the saved snapshot back. The
 * snapshot is normalized to {type,id,duration} so it re-POSTs as a valid
 * manual lineup. We never snapshot an empty lineup, so a wiped channel can't
 * clobber a good backup. */
async function snapshotLineup(reason){
  if(!State.current || !State.programming) return;
  const lineup = (State.programming.lineup||[]).map(e=>
    e.type==='content' ? {type:'content', id:e.id, duration:e.duration} : e
  ).filter(e=> e.type!=='content' || (e.id && e.duration!=null));
  const content = lineup.filter(e=>e.type==='content');
  if(!content.length) return; // refuse to overwrite a backup with nothing
  await savePrefs({ lineupBackup: {
    savedAt: Date.now(), reason,
    lineup, totalPrograms: content.length,
    summary: State.shows.map(s=>({title:s.title, count:s.count})),
  }});
}
async function restoreLineup(){
  const saved = await loadPrefs(State.current.id);
  const bak = saved && saved.lineupBackup;
  if(!bak || !bak.lineup || !bak.lineup.length){ toast('No saved lineup to restore yet','warn'); return; }
  const when = new Date(bak.savedAt).toLocaleString();
  const shows = (bak.summary||[]).map(s=>`<code class="k">${s.title}</code>`).join(' ') || '(content)';
  const ok = await confirmModal('Restore previous lineup',
    `Restore the lineup saved <b>${when}</b> — ${bak.totalPrograms} programs?<br><br>${shows}<br><br>This replaces the current programming.`);
  if(!ok) return;
  try{
    toast('Restoring…','ok',1500);
    State.programming = await api('POST',`/channels/${State.current.id}/programming`,
      {type:'manual', lineup:bak.lineup, append:false});
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    renderMain();
    toast(`Restored ${bak.totalPrograms} programs.`,'ok');
  }catch(e){ toast('Restore failed: '+e.message,'err',6000); }
}

/* ---------- named collections ----------
 * Save the current channel lineup under an arbitrary name so you can swap the
 * channel to something else and bring it back later. Stored per-channel in
 * prefs under `collections` (name -> {savedAt, lineup, totalPrograms, summary}).
 * Distinct from the auto-snapshot undo above: these are deliberate, named. */
async function saveCollection(){
  if(!State.current || !State.programming) return;
  const content=(State.programming.lineup||[]).filter(e=>e.type==='content');
  if(!content.length){ toast('Nothing to save — the channel is empty','warn'); return; }
  const name=await promptModal('Save collection',
    'Name this collection (its full lineup is saved):','e.g. Barney favorites');
  if(!name) return;
  const prefs=await loadPrefs(State.current.id)||{};
  const collections={...(prefs.collections||{})};
  const existed=!!collections[name];
  collections[name]={
    savedAt:Date.now(),
    lineup: content.map(e=>({type:'content',id:e.id,duration:e.duration})),
    totalPrograms: content.length,
    summary: State.shows.map(s=>({title:s.title,count:s.count})),
  };
  await savePrefs({collections});
  toast(`${existed?'Updated':'Saved'} collection “${name}” (${content.length} programs).`,'ok');
  renderMain();
}
async function restoreCollection(name){
  const prefs=await loadPrefs(State.current.id)||{};
  const c=(prefs.collections||{})[name];
  if(!c||!c.lineup||!c.lineup.length){ toast('Collection not found','warn'); return; }
  const shows=(c.summary||[]).map(s=>`<code class="k">${s.title}</code>`).join(' ')||'(content)';
  const ok=await confirmModal(`Load “${name}”`,
    `Replace the current lineup with <b>${name}</b> — ${c.totalPrograms} programs?<br><br>${shows}`+
    `<br><br><span style="color:var(--ink-faint)">The current lineup is auto-saved to “Restore previous” first.</span>`);

    toast('Loading collection…','ok',1500);
    await snapshotLineup('pre-collection-load');
    State.programming=await api('POST',`/channels/${State.current.id}/programming`,{type:'manual',lineup:c.lineup,append:false});
    State.shows=await groupShows(State.programming);
    State.shows.sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true}));
    renderMain();

  }catch(e){ toast('Load failed: '+e.message,'err',6000); }
}
async function deleteCollection(name){
  const ok=await confirmModal('Delete collection',
    `Delete saved collection <b>${name}</b>?<br><br>The channel's current lineup is unaffected.`);
  if(!ok) return;

function renderCollectionsPanel(){
  const wrap=el('div','coll-panel'); wrap.style.margin='10px 0';

/* ---------- add channel (themed suggestions) ----------
 * Analyze the Plex library (genre counts via the search index), suggest themed
 * channels, then create + auto-populate one. Movies come straight from search
 * (they carry duration); shows are expanded to episodes via /descendants. */
function genreFilter(genres, type){
  const v=(k,val)=>({type:'value',fieldSpec:{key:k,name:k,type:'faceted_string',op:'=',value:[val]}});
  const nodes=[v('type',type), ...genres.map(g=>v('genres.name',g))];
  return nodes.length===1 ? nodes[0] : {type:'op',op:'and',children:nodes};
}
function searchGenre(genres,type,limit){
  return api('POST','/programs/search',{query:{query:null,filter:genreFilter(genres,type),
    sort:[{field:'sortTitle',direction:'asc'}]},limit,page:0});
}
async function countTheme(t){
  let shows=0,movies=0;
  if(t.types.includes('show')){ try{shows=(await searchGenre(t.genres,'show',1)).totalHits||0;}catch(e){} }
  if(t.types.includes('movie')){ try{movies=(await searchGenre(t.genres,'movie',1)).totalHits||0;}catch(e){} }
  return {shows,movies,total:shows+movies};
}
async function gatherContent(theme, onProg){
  const out=[];
  if(theme.types.includes('movie')){
    onProg&&onProg('Collecting movies…');
    const r=await searchGenre(theme.genres,'movie',200).catch(()=>null);
    (r&&r.results||[]).forEach(m=>{ const id=m.uuid||m.id; if(id&&m.duration) out.push({type:'content',id,duration:m.duration}); });
  }
  if(theme.types.includes('show')){
    const r=await searchGenre(theme.genres,'show',40).catch(()=>null);
    const shows=(r&&r.results||[]).slice(0,30);
    for(let i=0;i<shows.length;i++){
      onProg&&onProg(`Adding episodes… (${i+1}/${shows.length} shows)`);
      const sid=shows[i].uuid||shows[i].id;
      const desc=await api('GET',`/programs/${sid}/descendants`).catch(()=>null);
      if(Array.isArray(desc)) desc.slice(0,25).forEach(d=>{ const id=d.id||d.uuid; if(id&&d.duration) out.push({type:'content',id,duration:d.duration}); });
      if(out.length>1200) break;
    }
  }
  for(let j=out.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[out[j],out[k]]=[out[k],out[j]];}
  return out.slice(0,800);
}
async function createThemedChannel(theme){
  const tmpl=State.channels[0]||{};
  if(!tmpl.transcodeConfigId){ toast('Need at least one existing channel (for a transcode config) before adding more.','err',6000); return; }
  const name=await promptModal('Create channel','Channel name:','', theme.name);
  if(!name) return;
  $('#modalTitle').textContent='Creating channel';
  $('#modalOk').style.display='none'; $('#modalCancel').textContent='Cancel'; $('#modalCancel').onclick=()=>closeModal();
  $('#modalBody').innerHTML=`<div class="empty"><span class="spin"></span> Collecting content…</div>`;
  $('#modalBg').classList.add('show');
  try{
    const content=await gatherContent(theme, msg=>{ const b=$('#modalBody'); if(b) b.innerHTML=`<div class="empty"><span class="spin"></span> ${msg}</div>`; });
    if(!content.length){ toast('No playable content found for this theme','warn'); closeModal(); return; }
    $('#modalBody').innerHTML=`<div class="empty"><span class="spin"></span> Creating channel + ${content.length} programs…</div>`;
    const number=Math.max(0,...State.channels.map(c=>c.number||0))+1;
    const chan={ id:uuid(), name, number, duration:0, startTime:Date.now(),
      disableFillerOverlay:true, groupTitle:'tunarr', guideMinimumDuration:30000, fillerRepeatCooldown:30000,
      icon:{path:'',width:0,duration:0,position:'bottom-right',useDefaultIconFallback:true},
      offline:{picture:'',soundtrack:'',mode:'pic'}, stealth:false, streamMode:tmpl.streamMode||'hls',
      transcodeConfigId:tmpl.transcodeConfigId, subtitlesEnabled:false };
    const created=await api('POST','/channels',{type:'new',channel:chan});
    State.channels=await api('GET','/channels');
    // Tunarr assigns its own id; match by the response id if present, else by number
    const nc=(created&&created.id&&State.channels.find(c=>c.id===created.id))||State.channels.find(c=>c.number===number);
    if(!nc) throw new Error('channel created but could not be located');
    await api('POST',`/channels/${nc.id}/programming`,{type:'manual',lineup:content,append:false});
    closeModal(); renderChannels();
    toast(`Created “${name}” (#${number}) with ${content.length} programs.`,'ok');
    selectChannel(nc);
  }catch(e){ toast('Create failed: '+e.message,'err',6000); closeModal(); }
}

  $('#modalTitle').textContent='Add a channel';
  $('#modalOk').style.display='none'; $('#modalCancel').textContent='Close'; $('#modalCancel').onclick=()=>closeModal();

  // content type: shows or movies
  const typeSel = el('select','search-in'); typeSel.id='typeSel';
  typeSel.append(new Option('Shows','show'));
  typeSel.append(new Option('Movies','movie'));
  typeSel.value = State.addType;
  typeSel.onchange=async ()=>{
    State.addType = typeSel.value;
    // studio etc. that don't apply to the new type fall back to Title
    rebuildMetaFieldOptions();
    State.filterRatings.clear();
    await loadRatingFacet(); runSearch();
  };
  tb.append(typeSel);

  // "search by" metadata field
  const fieldSel = el('select','search-in'); fieldSel.id='metaField';
  fieldSel.onchange=()=>{ State.metaField = fieldSel.value; updateQueryPlaceholder(); runSearch(); };
  tb.append(fieldSel);

  const q = el('input','search-in'); q.id='addQuery'; q.type='text';
  q.style.minWidth='220px';
  q.onkeydown=e=>{ if(e.key==='Enter') runSearch(); };
  tb.append(q);
  const go = el('button','btn primary','Search'); go.onclick=runSearch; tb.append(go);
  box.append(tb);
  rebuildMetaFieldOptions();
  updateQueryPlaceholder();

  // rating filter chips (populated from facets)
  const chips = el('div','facet-chips'); chips.id='ratingChips';
  chips.append(el('span','info','Filter by rating:'));
  box.append(chips);

  const dbg = el('div','info'); dbg.id='addDebug'; dbg.style.marginBottom='8px'; box.append(dbg);

  const results = el('div'); results.id='addResults';
  results.append(el('div','empty'));
  box.append(results);

  // add action bar
  const bar = el('div','actionbar');
  const info = el('div','info'); info.id='addInfo'; info.textContent='Nothing selected';
  const sp = el('div','spacer');
  const addBtn = el('button','btn primary','Add selected to channel'); addBtn.onclick=addSelectedToChannel;
  bar.append(info, sp, addBtn);
  box.append(bar);

  // init: load libraries + ratings, then show all shows immediately
  if(State.mediaSources.length){
    const sid = State.mediaSources[0].id || State.mediaSources[0].uuid;
    srcSel.value = sid;
    (async()=>{ await loadLibraries(sid); await loadRatingFacet(); runSearch(); })();
  } else {
    results.querySelector('.empty').textContent='No Plex media sources found in Tunarr.';
  }
  return box;
}

// Populate the "search by" dropdown with the fields valid for the current type.
function rebuildMetaFieldOptions(){
  const sel = $('#metaField'); if(!sel) return;
  const fields = META_FIELDS.filter(f=> !f.movieOnly || State.addType==='movie');
  if(!fields.some(f=>f.key===State.metaField)) State.metaField=''; // reset if now-invalid
  sel.innerHTML='';
  fields.forEach(f=> sel.append(new Option('By '+f.label, f.key)));
  sel.value = State.metaField;
}
function updateQueryPlaceholder(){
  const q = $('#addQuery'); if(!q) return;
  const noun = State.addType==='movie' ? 'movies' : 'shows';
  const f = META_FIELDS.find(x=>x.key===State.metaField);
  q.placeholder = (!f || f.q)
    ? `Search ${noun} by title…`
    : `Exact ${f.label.toLowerCase()} (e.g. ${({'genres.name':'Comedy','actors.name':'Tom Hanks','director.name':'Brad Bird','studio.name':'Walt Disney Pictures','originalReleaseYear':'1994','tags':'kids'})[f.key]||'value'})`;
}

async function loadLibraries(srcId){
  const libSel = $('#libSel'); if(!libSel) return;
  libSel.innerHTML=''; libSel.append(new Option('All libraries',''));
  if(!srcId) return;
  try{
    const libs = await api('GET',`/media-sources/${srcId}/libraries`) || [];
    State.libraries = libs;
    libs.forEach(l=>{
      const id = l.id || l.uuid || l.libraryId || l.externalKey;
      const name = l.name || l.title || id;
      const mt = l.mediaType ? ` · ${l.mediaType}` : '';
      libSel.append(new Option(name+mt, id));
    });
    const dbg = $('#addDebug');
    if(dbg) dbg.textContent = libs.length
      ? `${libs.length} libraries`
      : 'libraries endpoint returned empty';
  }catch(e){
    const dbg = $('#addDebug'); if(dbg) dbg.textContent = 'libraries error: '+e.message;
    console.error('loadLibraries', e);
  }
}

async function loadRatingFacet(){
  // The server only facets on 'type', so we can't get rating counts from the
  // search response. Instead we run one unfiltered show search and tally the
  // 'rating' field across the returned shows to build the filter chips.
  const chips = $('#ratingChips'); if(!chips) return;
  const srcId = $('#srcSel') ? $('#srcSel').value : '';
  const libId = $('#libSel') ? $('#libSel').value : '';
  try{
    const res = await api('POST','/programs/search', {
      query:{ query:null,
        filter:valueNode('type','=',[State.addType]),
        sort:[{field:'sortTitle',direction:'asc'}] },
      mediaSourceId: srcId||undefined,
      libraryId: libId||undefined,
      limit: 500, page:0,
    });
    const items = ((res&&res.results)||[]).filter(it=>(it.type||'')===State.addType);
    const counts = {};
    items.forEach(it=>{ const r=it.rating||it.contentRating; if(r) counts[r]=(counts[r]||0)+1; });
    if(Object.keys(counts).length){
      State.ratingFacet='rating'; State.ratingValues=counts;
      chips.style.display=''; renderRatingChips(); return;
    }
  }catch(e){ console.error('loadRatingFacet', e); }
  chips.style.display='none';
}

function renderRatingChips(){
  const chips = $('#ratingChips'); if(!chips) return;
  chips.innerHTML=''; chips.append(el('span','info','Filter by rating:'));
  Object.entries(State.ratingValues).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([val,count])=>{
    const c = el('div','chip'+(State.filterRatings.has(val)?' on':''), `${val} · ${count}`);
    c.onclick=()=>{ if(State.filterRatings.has(val)) State.filterRatings.delete(val); else State.filterRatings.add(val);
      c.classList.toggle('on'); runSearch(); };
    chips.append(c);
  });
}

function valueNode(key, op, value){
  return { type:'value', fieldSpec:{ key, name:key, type:'faceted_string', op, value } };
}
function buildFilterTree(){
  // AND of: type = show|movie, optional rating IN [...], and an optional exact
  // metadata filter (genre/actor/studio/…). Exact match is case-insensitive but
  // not partial. Verified filterable attributes against the live index.
  const nodes = [ valueNode('type','=',[State.addType]) ];
  if(State.ratingFacet && State.filterRatings.size){
    nodes.push(valueNode('rating','in',[...State.filterRatings]));
  }
  const f = META_FIELDS.find(x=>x.key===State.metaField);
  const val = ($('#addQuery') ? $('#addQuery').value.trim() : '');
  if(f && !f.q && f.key && val){
    nodes.push(valueNode(f.key,'=',[val]));
  }
  if(nodes.length===1) return nodes[0];
  return { type:'op', op:'and', children:nodes };
}

async function runSearch(){
  // Guard against out-of-order responses: rapid filter changes fire overlapping
  // searches, and a slow earlier one can resolve after a later one and clobber
  // the results. Tag each request; only the latest may render.
  const seq = (State.searchSeq = (State.searchSeq||0) + 1);
  const results = $('#addResults'); results.innerHTML = `<div class="empty"><span class="spin"></span> Searching…</div>`;
  const srcId = $('#srcSel') ? $('#srcSel').value : '';
  const libId = $('#libSel') ? $('#libSel').value : '';
  const text = $('#addQuery') ? $('#addQuery').value.trim() : '';
  const f = META_FIELDS.find(x=>x.key===State.metaField);
  const asText = (!f || f.q);
  // NOTE: Tunarr 1.3.6's free-text `query` is broken — a non-null query returns
  // totalHits>0 but an EMPTY results array, so title search never worked. We
  // therefore always send query:null and rely on the filter tree (type / rating
  // / metadata — all verified working), then filter by title CLIENT-SIDE below.
  const body = {
    query:{
      query: null,
      filter: buildFilterTree(),
      sort:[{field:'sortTitle', direction:'asc'}],
    },
    mediaSourceId: srcId||undefined,
    libraryId: libId||undefined,
    limit: 1000, page:0,
  };
  try{
    const res = await api('POST','/programs/search', body);
    if(seq !== State.searchSeq) return; // a newer search superseded this one
    let items = (res && res.results) || [];
    items = items.filter(it=> (it.type||'')===State.addType);
    const totalHits = res ? res.totalHits : items.length;
    // client-side title contains-filter (only when "By Title" is selected)
    if(asText && text){
      const t = text.toLowerCase();
      items = items.filter(it=> itemTitle(it).toLowerCase().includes(t));
    }
    State.addResults = items;
    State.addTotalHits = totalHits;
    // capped flag: server returned fewer than the true total, so a title filter
    // may have missed matches beyond the fetched page.
    State.addCapped = (totalHits > (res ? (res.results||[]).length : 0));
    renderAddResults(totalHits);
  }catch(e){
    if(seq !== State.searchSeq) return;
    results.innerHTML = `<div class="empty"><b>Search failed</b>${e.message}</div>`;
  }
}

function itemRating(it){ return it.rating || it.contentRating || ''; }
function itemTitle(it){ return it.title || it.name || '(untitled)'; }
function itemType(it){ return it.type || ''; }
function itemId(it){ return it.uuid || it.id; }
function itemEpisodes(it){ return it.grandchildCount!=null?it.grandchildCount:(it.childCount!=null?it.childCount:null); }

function renderAddResults(totalHits){
  const box = $('#addResults'); box.innerHTML='';
  const items = State.addResults;
  const noun = State.addType==='movie' ? 'movies' : 'shows';
  if(!items.length){
    const src = State.mediaSources.find(s=>(s.id||s.uuid)===($('#srcSel')||{}).value);
    const hint = `No ${noun} match. Try a different search or clear filters.`
      + (src ? `<br><span style="color:var(--ink-faint)">If “${src.name}” shows nothing at all, its libraries may not be scanned into Tunarr yet.</span>` : '');
    box.append(el('div','empty',hint)); return;
  }
  if(State.addCapped){
    box.append(el('div','info',`Showing ${items.length} ${noun} (first ${noun==='movies'?'1000':'all'} loaded of ${totalHits}). Use a Genre/Year/Studio filter or a library to narrow — title matching only covers what's loaded.`));
  } else if(totalHits!=null && totalHits>items.length){
    box.append(el('div','info',`${items.length} of ${totalHits} ${noun} match.`));
  }
  // what's already on this channel: shows by show-id, movies by program-id
  const addedShowIds = new Set(State.shows
    .filter(s=>!s.showId.startsWith('movie::')&&!s.showId.startsWith('title::')&&!s.showId.startsWith('item::'))
    .map(s=>s.showId));
  const addedContentIds = new Set((State.programming.lineup||[]).filter(e=>e.type==='content').map(e=>e.id));
  items.forEach(it=>{
    const id = itemId(it);
    const onChannel = itemType(it)==='movie' ? addedContentIds.has(id) : addedShowIds.has(id);
    const row = el('div','result'+(onChannel?' on-channel':''));
    const chk = el('input'); chk.type='checkbox'; chk.className='chk';
    if(onChannel){ chk.style.visibility='hidden'; } // no bulk-select for already-added
    else {
      chk.checked = State.addSelected.has(id);
      chk.onchange=()=>{ if(chk.checked) State.addSelected.set(id, it); else State.addSelected.delete(id); updateAddInfo(); };
    }
    const tWrap = el('div');
    const t = el('div','title', itemTitle(it));
    const rt = itemRating(it); if(rt){ const tag=el('span','rating-tag',rt); t.append(tag); }
    if(onChannel) t.append(el('span','on-tag','on channel'));
    const eps = itemEpisodes(it);
    const yr = it.year ? ` · ${it.year}` : '';
    const sub = itemType(it)==='movie' ? `movie${yr}` : (eps!=null?`${eps} episodes${yr}`:`show${yr}`);
    tWrap.append(t, el('div','sub', sub));
    const typ = el('div','sub', itemType(it)==='movie' ? fmtDur(it.duration||0) : (eps!=null?`${eps} ep`:''));
    let btn;
    if(onChannel){
      btn = el('button','btn sm danger','Remove'); btn.onclick=()=>removeResultFromChannel(it);
    } else {
      btn = el('button','btn sm','Add'); btn.onclick=()=>{ State.addSelected.set(id,it); updateAddInfo(); addSelectedToChannel(); };
    }
    row.append(chk, tWrap, typ, btn);
    box.append(row);
  });
  updateAddInfo();
}

function updateAddInfo(){
  const info = $('#addInfo'); if(!info) return;
  info.textContent = State.addSelected.size ? `${State.addSelected.size} selected to add` : 'Nothing selected';
}

// Round-robin several groups into one list (A,B,A,B,…) so multiple added shows
// mix together rather than playing as consecutive blocks.
function roundRobin(groups){
  const out=[]; for(let i=0;;i++){ let any=false; for(const g of groups){ if(i<g.length){ out.push(g[i]); any=true; } } if(!any) break; }
  return out;
}
// Slot `additions` evenly through `existing`, preserving both orders — so a
// newly-added show lands throughout the rotation (where it would have been),
// not appended as a block at the end.
function evenMerge(existing, additions){
  if(!existing.length) return additions.slice();
  if(!additions.length) return existing.slice();
  const out=[]; const ratio=existing.length/additions.length; let ai=0, nextAt=ratio/2;
  for(let i=0;i<existing.length;i++){
    while(ai<additions.length && i>=nextAt){ out.push(additions[ai++]); nextAt+=ratio; }
    out.push(existing[i]);
  }
  while(ai<additions.length) out.push(additions[ai++]);
  return out;
}
async function addSelectedToChannel(){
  if(!State.addSelected.size){ toast('Select something to add first','warn'); return; }
  // Shows/seasons expand to their descendant episodes; movies add as a single
  // content entry. Both carry the `duration` the manual lineup POST requires.
  toast('Resolving titles…','ok',1500);
  const newGroups=[];
  try{
    for(const [id,it] of State.addSelected){
      const g=[];
      if(itemType(it)==='movie'){
        g.push({type:'content', id, duration: it.duration});
      } else {
        const desc = await api('GET',`/programs/${id}/descendants`).catch(()=>null);
        if(Array.isArray(desc) && desc.length) desc.forEach(d=> g.push({type:'content', id: d.id || d.uuid, duration: d.duration}));
        else g.push({type:'content', id, duration: it.duration});
      }
      newGroups.push(g.filter(c=>c.id && c.duration!=null));
    }
    const additions = roundRobin(newGroups);
    if(!additions.length){ toast('Nothing playable to add','warn'); return; }
    // normalize existing content refs (keep duration the POST requires), then
    // slot the new content evenly through it instead of appending a block.
    const existing = (State.programming.lineup||[]).map(e=>
      e.type==='content' ? {type:'content', id:e.id, duration:e.duration} : e);
    const body = {type:'manual', lineup: evenMerge(existing, additions), append:false};
    await snapshotLineup('add');
    State.programming = await api('POST',`/channels/${State.current.id}/programming`, body);
    State.shows = await groupShows(State.programming);
    State.shows.sort((a,b)=> a.title.localeCompare(b.title, undefined, {numeric:true}));
    State.addSelected.clear();
    toast(`Added ${additions.length} item(s) into ${State.current.name}'s rotation.`,'ok');
    State.tab='manage'; renderMain();
  }catch(e){ toast('Add failed: '+e.message,'err',6000); }
}

/* ---------- boot ---------- */
window.addEventListener('DOMContentLoaded',()=>{
  const servedOverHttp = location.protocol === 'http:' || location.protocol === 'https:';
  const saved = localStorage && localStorage.getItem('tunarrStudioUrl');
  if(servedOverHttp){
    // Served by server.js (same origin as /api). Default to same-origin and
    // auto-connect so non-technical users don't have to type anything.
    $('#urlInput').value = saved || location.origin;
    $('#connectBtn').onclick = connect;
    $('#urlInput').onkeydown = e=>{ if(e.key==='Enter') connect(); };
    connect();
  } else {
    // Opened as a local file:// — needs an explicit server URL, and Tunarr
    // must allow this origin (TUNARR_CORS_ORIGINS). Dev/testing only.
    $('#urlInput').value = saved || 'http://tunarr.local:8000';
    $('#connectBtn').onclick = connect;
    $('#urlInput').onkeydown = e=>{ if(e.key==='Enter') connect(); };
  }
});
</script>
</body>
